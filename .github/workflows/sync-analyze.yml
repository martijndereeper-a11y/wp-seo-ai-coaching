name: Sync & Analyze Recordings

on:
  schedule:
    # Every weekday at 06:00 UTC (08:00 CET) — before the team starts
    - cron: '0 6 * * 1-5'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  sync-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync recordings from Claap
        run: npx tsx src/sync/claap-to-supabase.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLAAP_API_KEY: ${{ secrets.CLAAP_API_KEY }}

      - name: Analyze new recordings
        run: npx tsx src/analysis/run-analysis.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Measure coaching interventions
        run: |
          # Hit the measure endpoint to update intervention outcomes
          if [ -n "$API_URL" ]; then
            curl -s -X POST "$API_URL/api/interventions/measure" \
              -H "Authorization: Bearer $LEAD_TOKEN" \
              -H "Content-Type: application/json" || true
          fi
        env:
          API_URL: ${{ secrets.API_URL }}
          LEAD_TOKEN: ${{ secrets.LEAD_PASSWORD }}

  notify-failure:
    needs: sync-and-analyze
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Alert on pipeline failure
        run: |
          echo "::error::Sync & Analyze pipeline failed — coaching data may be stale"
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \":rotating_light: *Sync & Analyze Failed*\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTime: $(date -u '+%Y-%m-%d %H:%M UTC')\"
            }" 2>/dev/null || true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}

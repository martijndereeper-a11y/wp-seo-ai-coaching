          // Show best moment as proof
          if (p.goodMoments.length > 0) {
            const m = p.goodMoments[0];
            html += '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">Example from '+m.callTitle?.slice(0,30)+' ('+m.date+'):</div>';
            html += renderMoment(m.h, 'good', m.url, m.rid);
          }
          html += '</div>';
        });
      } else {
        html += '<div style="font-size:13px;color:var(--text2)">Building baseline — keep calling and we\'ll identify your strengths.</div>';
      }
      html += '</div>';

      // What To Change
      html += '<div class="coach-box work"><div class="cb-title">What To Change</div>';
      if (worstPillars.length) {
        worstPillars.forEach(p => {
          html += '<div style="margin-bottom:12px">';
          html += '<div style="font-size:14px;font-weight:600;margin-bottom:4px"><span class="pillar-badge needs-work" style="margin-right:6px"><span class="pdot"></span>'+p.label+'</span> Score: '+p.avg+'</div>';
          html += '<div style="font-size:12px;color:var(--text);margin-bottom:4px;line-height:1.6"><strong>Do this:</strong> '+pillarPrescriptions[p.key].do+'</div>';
          html += '<div style="font-size:12px;color:var(--text2);margin-bottom:6px;line-height:1.6"><strong>Avoid:</strong> '+pillarPrescriptions[p.key].avoid+'</div>';
          // Show coachable moment as evidence
          if (p.badMoments.length > 0) {
            const m = p.badMoments[0];
            html += '<div style="font-size:11px;color:var(--text2);margin-bottom:4px">This happened in '+m.callTitle?.slice(0,30)+' ('+m.date+'):</div>';
            html += renderMoment(m.h, 'coachable', m.url, m.rid);
          }
          html += '</div>';
        });
      } else {
        html += '<div style="font-size:13px;color:var(--text2)">All pillars developing or strong. Focus on consistency.</div>';
      }
      html += '</div>';

      html += '</div>';

      // Progression chart
      if (safeTrend.length >= 2) {
        html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Progression (Rolling 5-Call Average)</h3><div class="chart-container"><canvas id="chart-progression"></canvas></div></div>';
      }

      // Recent Calls — rich previews, not just a table
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Your Recent Calls</h3>';
      safeCalls.slice(0, 10).forEach(c => {
        const ps = c.pillar_scores || {};
        const sr = c.smart_review || {};
        const vd = Array.isArray(c.call_verdict) ? c.call_verdict : [];
        const dur = Math.round((c.duration_seconds||0)/60);
        const date = (c.created_at||'').slice(0,10);

        html += '<div onclick="loadCallDetail(\''+c.recording_id+'\',\''+esc(name)+'\')" style="padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s" onmouseover="this.style.borderColor=\'var(--purple)\'" onmouseout="this.style.borderColor=\'var(--border)\'">';

        // Top line: date, title, stats
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">';
        html += '<span style="font-size:12px;color:var(--text2);width:75px">'+date+'</span>';
        html += '<span style="font-size:13px;font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+(c.title||'Untitled')+'</span>';
        html += '<span style="font-size:12px;color:var(--text2)">'+dur+'min</span>';
        html += '<span style="font-size:14px;font-weight:700;color:'+qClr(c.call_quality_score||0)+';width:30px;text-align:right">'+(c.call_quality_score||0)+'</span>';
        html += '</div>';

        // Pillar badges
        html += '<div class="pillar-row" style="margin:4px 0">';
        PILLAR_KEYS.forEach(k => {
          const p = ps[k];
          if (!p) return;
          const level = p.level || pillarLevel(p.score || 0);
          html += '<span class="pillar-badge '+pillarLevelCls(level)+'" style="font-size:10px;padding:2px 6px"><span class="pdot" style="width:5px;height:5px"></span>'+PILLAR_LABELS[k]+'</span>';
        });
        html += '</div>';

        // Quick summary from smart review
        if (sr.summary) {
          html += '<div style="font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+sr.summary.slice(0,150)+'</div>';
        }

        // Verdict tags if any issues
        if (vd.length > 0) {
          html += '<div style="margin-top:4px">';
          vd.slice(0,2).forEach(v => {
            html += '<span style="font-size:10px;padding:2px 6px;background:rgba(239,68,68,.08);color:var(--red);border-radius:3px;margin-right:4px">'+v+'</span>';
          });
          html += '</div>';
        }

        html += '</div>';
      });
      html += '</div>';

    } else {
      // ── LEAD MODE ──

      // Performance Radar — full width for visibility
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Performance Radar: AE vs Team Average</h3><div style="max-width:500px;margin:0 auto"><div class="chart-container" style="height:350px"><canvas id="chart-radar"></canvas></div></div></div>';

      // Progression charts
      if (safeTrend.length >= 2) {
        html += '<div class="grid-2">';
        html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Quality & Script Trend</h3><div class="chart-container"><canvas id="chart-trend-quality"></canvas></div></div>';
        html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Talk Ratio & Questions Trend</h3><div class="chart-container"><canvas id="chart-trend-talk"></canvas></div></div>';
        html += '</div>';
      }

      // Strengths vs Team / Gaps vs Team
      const { edges, gaps } = getEdgesAndGaps(allPatterns, tavg);
      const dimNames = {contentEngine:'Content Engine',marketContext:'Market Context',roiReframe:'ROI Reframe',humor:'Humor',urgency:'Urgency',contract:'Close Language',checkIn:'Check-ins',theirBusiness:'Prospect Business',activeListening:'Active Listening',personalStory:'Personal Stories',vsAgency:'Agency Diff.',directness:'Directness',opinionAsk:'Opinion Asks',research:'Research',priceAnchor:'Price Anchoring',assumptiveClose:'Assumptive Close'};

      html += '<div class="grid-2">';
      html += '<div class="coach-box keep"><div class="cb-title">Strengths vs Team</div>';
      edges.slice(0,5).forEach(e => {
        html += '<div style="font-size:13px;margin-bottom:4px">'+(dimNames[e.dim]||e.dim)+': <strong style="color:var(--green)">'+e.val.toFixed(1)+'</strong> vs team '+e.teamAvg.toFixed(1)+' <span style="color:var(--green)">(+'+e.lift+')</span></div>';
      });
      // Add strength moments
      const strengthMoments = [];
      safeCalls.slice(0,5).forEach(c => { (c.highlights||[]).filter(h=>h.type==='strength').slice(0,1).forEach(h => { strengthMoments.push({h, url:c.recording_url, rid:c.recording_id}); }); });
      strengthMoments.slice(0,2).forEach(m => { html += renderMoment(m.h, 'good', m.url, m.rid); });
      html += '</div>';

      html += '<div class="coach-box work"><div class="cb-title">Gaps vs Team</div>';
      gaps.slice(0,5).forEach(g => {
        html += '<div style="font-size:13px;margin-bottom:4px">'+(dimNames[g.dim]||g.dim)+': <strong style="color:var(--red)">'+g.val.toFixed(1)+'</strong> vs team '+g.teamAvg.toFixed(1)+' <span style="color:var(--red)">(-'+g.gap+')</span></div>';
      });
      const gapMoments = [];
      safeCalls.slice(0,5).forEach(c => { (c.highlights||[]).filter(h=>h.type==='coachable').slice(0,1).forEach(h => { gapMoments.push({h, url:c.recording_url, rid:c.recording_id}); }); });
      gapMoments.slice(0,2).forEach(m => { html += renderMoment(m.h, 'coachable', m.url, m.rid); });
      html += '</div>';
      html += '</div>';

      // Coaching Interventions for this AE
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Coaching Interventions</h3><div id="ae-interventions" style="font-size:12px;color:var(--text2)">Loading...</div></div>';

      // Full calls table
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">All Calls</h3>';
      html += '<table class="calls-table"><thead><tr><th>Date</th><th>Title</th><th>Deal</th><th>Quality</th><th>Talk</th><th>Qs</th><th>Dur</th></tr></thead><tbody>';
      safeCalls.forEach(c => { html += callRowHTML(c, name); });
      html += '</tbody></table></div>';
    }

    // ── SHARED: Engagement pills, Verdict, Script, Behavior scores ──
    // (These are computed from the most recent call for the AE-level view)
    const latestCall = safeCalls[0] || {};
    const pe = latestCall.prospect_engagement || {};

    // Engagement pills
    html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Engagement Signals (Latest Call)</h3>';
    const peEvidence = pe.evidence || {};
    const engTypes = [
      { key: 'buyingSignals', label: 'Buying Signals', cls: 'g', count: pe.buyingSignals || 0, evidenceKey: 'buying' },
      { key: 'engagementIndicators', label: 'Engagement', cls: 'b', count: pe.engagementIndicators || 0, evidenceKey: 'engagement' },
      { key: 'redFlags', label: 'Red Flags', cls: 'r', count: pe.redFlags || 0, evidenceKey: 'redFlags' },
    ];
    engTypes.forEach(e => {
      const evidence = peEvidence[e.evidenceKey] || pe[e.key + 'Evidence'] || pe[e.key + 'List'] || [];
      html += '<span class="pill '+e.cls+'" onclick="var el=document.getElementById(\'eng-'+e.key+'\');if(el)el.classList.toggle(\'hidden\')">'+e.label+': '+e.count+'</span>';
      if (evidence.length) {
        html += '<div id="eng-'+e.key+'" class="hidden" style="margin:6px 0 10px 8px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:12px">';
        evidence.forEach(ev => {
          const text = typeof ev === 'string' ? ev : (ev.quote || ev.excerpt || ev.text || '');
          const ts = typeof ev === 'object' ? (ev.timestamp || '') : '';
          const speaker = typeof ev === 'object' ? (ev.speaker || '') : '';
          const evType = typeof ev === 'object' ? (ev.type || '') : '';
          html += '<div style="padding:4px 0;border-bottom:1px solid rgba(46,51,72,.3)">';
          if (ts || speaker) html += '<div style="font-size:10px;color:var(--text2);margin-bottom:2px">'+(ts?'<span style="font-family:monospace">'+ts+'</span> ':'')+(speaker?speaker:'')+(evType?' — <span style="font-weight:600">'+evType+'</span>':'')+'</div>';
          html += '<div style="font-style:italic">"'+text+'"</div></div>';
        });
        html += '</div>';
      }
    });
    html += '</div>';

    // Call verdict pills
    const verdict = latestCall.call_verdict || [];
    const verdictArr = Array.isArray(verdict) ? verdict : (typeof verdict === 'string' ? verdict.split(',').map(v => v.trim()) : []);
    if (verdictArr.length > 0) {
      const verdictExplanations = {
        'No Close': 'The AE ended the call without attempting any closing technique — no assumptive close, no next-step commitment, no contract mention.',
        'Never Checked In': 'The AE talked without checking if the prospect was following along. No pace checks like "Gaat dit te snel?" or "Is dit relevant?"',
        'Missed Buy Signal': 'The prospect showed interest or asked a buying question, but the AE did not advance or build on it.',
        'Too Much Talking': 'The AE dominated the conversation with a talk ratio above 62%, leaving too little room for the prospect.',
        'Accepted Think-It-Over': 'When the prospect said "ik moet erover nadenken", the AE accepted it instead of converting to concrete conditions.',
        'No Discovery': 'The AE jumped into pitching without asking enough discovery questions to understand the prospect\'s situation.',
        'Strong Discovery': 'The AE asked 18+ targeted questions, understood the prospect\'s business before pitching.',
        'Good Check-ins': 'The AE regularly checked in with the prospect, maintaining engagement and adjusting pace.',
        'Price Without Anchor': 'Pricing was mentioned without first establishing ROI context or value anchoring.',
        'Pricing Without ROI': 'The AE discussed pricing before building a clear ROI case for the prospect.',
        'Live Proof': 'The AE demonstrated the product live with the prospect\'s actual data or website.',
        'Assumptive Close': 'The AE used an assumptive close technique, moving the conversation toward a decision naturally.',
        'ROI Reframe': 'The AE reframed the price in terms of ROI or business impact.',
      };
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Call Verdicts (Latest Call)</h3>';
      verdictArr.filter(Boolean).forEach(v => {
        const isNeg = v.includes('No ') || v.includes('Never') || v.includes('Missed') || v.includes('Too ') || v.includes('Accepted');
        const vId = 'vd-'+v.replace(/[^a-zA-Z]/g,'');
        const explanation = verdictExplanations[v] || '';
        html += '<span class="pill '+(isNeg?'r':'g')+'" onclick="var el=document.getElementById(\''+vId+'\');if(el)el.classList.toggle(\'hidden\')">'+v+'</span>';
        if (explanation) {
          html += '<div id="'+vId+'" class="hidden" style="margin:4px 0 8px 8px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.6;border-left:2px solid '+(isNeg?'var(--red)':'var(--green)')+'">'+explanation+'</div>';
        }
      });
      html += '</div>';
    }

    // Script adherence pills
    const sHit = latestCall.sections_hit || [];
    const sMiss = latestCall.sections_missed || [];
    if (sHit.length || sMiss.length) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Script Adherence — '+(latestCall.script_adherence||0)+'% (Latest Call)</h3>'+scriptPillsHTML(sHit, sMiss)+'</div>';
    }

    // Behavior scores
    if (latestCall.patterns && Object.keys(latestCall.patterns).length) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Behavior Scores (Latest Call)</h3>'+behaviorScoresHTML(latestCall)+'</div>';
    }

    $('app').innerHTML = html;

    // Auto-load period comparison
    currentPeriodAE = name;
    currentPeriodWindow = 'opening';
    loadPeriodComparison(name, 'opening', 'month', null);

    // Render charts after DOM is ready
    setTimeout(() => {
      if (mode === 'ae' && safeTrend.length >= 2) {
        // Progression chart
        const ctx = document.getElementById('chart-progression');
        if (ctx) {
          destroyChart('progression');
          chartInstances['progression'] = new Chart(ctx, {
            type: 'line',
            data: {
              labels: safeTrend.map(t => t.date || 'Call '+t.callIndex),
              datasets: [
                { label: 'Quality', data: safeTrend.map(t => t.callQuality), borderColor: '#a855f7', backgroundColor: 'rgba(168,85,247,.1)', fill: true, tension: .3 },
                { label: 'Script', data: safeTrend.map(t => t.scriptAdherence), borderColor: '#22c55e', tension: .3 },
              ]
            },
            options: chartOpts('Score'),
          });
        }
      }

      if (mode === 'lead') {
        // Radar chart
        const rCtx = document.getElementById('chart-radar');
        if (rCtx) {
          destroyChart('radar');
          const radarMaxes = { contentEngine: 20, roiReframe: 3, urgency: 5, contract: 3, checkIn: 3, activeListening: 3, directness: 5, research: 2 };
          const normalizeRadar = (val, dim) => Math.min(10, (val / (radarMaxes[dim] || 5)) * 10);
          chartInstances['radar'] = new Chart(rCtx, {
            type: 'radar',
            data: {
              labels: radarLabels,
              datasets: [
                { label: name, data: radarDims.map(d => normalizeRadar(allPatterns[d]||0, d)), borderColor: '#a855f7', backgroundColor: 'rgba(168,85,247,.15)', pointBackgroundColor: '#a855f7' },
                { label: 'Team Avg', data: radarDims.map(d => normalizeRadar(tavg[d]||0, d)), borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.1)', pointBackgroundColor: '#3b82f6' },
              ]
            },
            options: { ...radarOpts(), scales: { ...radarOpts().scales, r: { ...radarOpts().scales.r, min: 0, max: 10, ticks: { ...radarOpts().scales.r.ticks, stepSize: 2 } } } },
          });
        }

        // Trend charts
        if (safeTrend.length >= 2) {
          const tqCtx = document.getElementById('chart-trend-quality');
          if (tqCtx) {
            destroyChart('trend-quality');
            chartInstances['trend-quality'] = new Chart(tqCtx, {
              type: 'line',
              data: {
                labels: safeTrend.map(t => t.date || 'Call '+t.callIndex),
                datasets: [
                  { label: 'Quality', data: safeTrend.map(t => t.callQuality), borderColor: '#a855f7', tension: .3 },
                  { label: 'Script', data: safeTrend.map(t => t.scriptAdherence), borderColor: '#22c55e', tension: .3 },
                ]
              },
              options: chartOpts('Score'),
            });
          }

          const ttCtx = document.getElementById('chart-trend-talk');
          if (ttCtx) {
            destroyChart('trend-talk');
            chartInstances['trend-talk'] = new Chart(ttCtx, {
              type: 'line',
              data: {
                labels: safeTrend.map(t => t.date || 'Call '+t.callIndex),
                datasets: [
                  { label: 'Talk Ratio', data: safeTrend.map(t => t.talkRatio), borderColor: '#f59e0b', tension: .3 },
                  { label: 'Questions', data: safeTrend.map(t => t.questionCount), borderColor: '#3b82f6', tension: .3, yAxisID: 'y1' },
                ]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#8b8fa3' } } },
                scales: {
                  x: { grid: { color: 'rgba(46,51,72,.3)' }, ticks: { color: '#8b8fa3' } },
                  y: { grid: { color: 'rgba(46,51,72,.3)' }, ticks: { color: '#8b8fa3' }, title: { display: true, text: 'Talk %', color: '#8b8fa3' } },
                  y1: { position: 'right', grid: { drawOnChartArea: false }, ticks: { color: '#8b8fa3' }, title: { display: true, text: 'Questions', color: '#8b8fa3' } },
                }
              },
            });
          }
        }
      }

      // Load AE interventions
      loadAEInterventions(name);
    }, 50);

  } catch (err) {
    $('app').innerHTML = '<button class="back-btn" onclick="loadTeam()">&larr; Back</button><div class="card" style="border-color:var(--red)"><p>Error: '+err.message+'</p></div>';
  }
}

// ════════════════════════════════════════════════════════
//  CALL DETAIL
// ════════════════════════════════════════════════════════

async function loadCallDetail(rid, aeName) {
  showLoading('Loading call...');
  try {
    const call = await api('/api/call/' + rid);
    if (!call) { showError('Failed to load call data'); return; }
    await loadFeedback(rid);

    const cq = call.call_quality_score || 0;
    const date = (call.created_at || '').slice(0, 10);
    const dur = call.duration_seconds ? Math.round(call.duration_seconds / 60) : 0;
    const outcome = call.outcome || '';
    const baseUrl = call.recording_url || '';

    // Header
    let html = '<button class="back-btn" onclick="loadAEDetail(\''+esc(aeName)+'\')">&larr; Back to '+aeName+'</button>';
    html += '<div class="card" style="margin-bottom:20px">'+
      '<div style="font-size:18px;font-weight:700;margin-bottom:4px">'+(call.title||'Untitled Call')+'</div>'+
      '<div style="font-size:13px;color:var(--text2);margin-bottom:6px">'+call.recorder_name+' &middot; '+date+' &middot; '+(call.deal_name||'')+
      (outcome?' &middot; <span style="font-size:11px;color:var(--text2)">'+outcome+'</span>':'')+
      '</div>'+
      (baseUrl?'<a href="'+baseUrl+'" target="_blank" style="font-size:12px">Open in Claap &rarr;</a>':'')+
    '</div>';

    // Deep Analysis (LLM) — available on demand for deeper insight — placed prominently after header
    html += '<div class="card" style="border-left:3px solid var(--purple)">'+
      '<div style="display:flex;align-items:center;gap:12px">'+
        '<div style="flex:1"><div style="font-size:14px;font-weight:600">Go Deeper</div><div style="font-size:12px;color:var(--text2)">AI-powered Koen-style coaching review with full prescriptions</div></div>'+
        '<button id="narrative-btn" onclick="generateNarrative(\''+rid+'\')" style="padding:8px 16px;background:var(--purple2);color:white;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Generate Deep Analysis</button>'+
      '</div>'+
      '<div id="narrative-result"></div>'+
    '</div>';

    // Pillar scores
    if (call.pillar_scores && Object.keys(call.pillar_scores).length) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Pillar Scores</h3>'+
        pillarBarsHTML(call.pillar_scores, true)+
      '</div>';
    }

    // Quality + Game Score Stats
    const gs = call.game_score || {};
    const gsPoints = gs.totalPoints !== undefined ? gs.totalPoints : '—';
    const gsClr = gs.totalPoints >= 40 ? 'var(--green)' : gs.totalPoints >= 15 ? 'var(--orange)' : gs.totalPoints !== undefined ? 'var(--red)' : 'var(--text2)';
    html += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px">'+
      '<div class="sbox"><div class="sv" style="color:'+qClr(cq)+'">'+cq+'</div><div class="sl">Quality</div></div>'+
      '<div class="sbox"><div class="sv" style="color:'+gsClr+'">'+gsPoints+'</div><div class="sl">Game Score</div></div>'+
      '<div class="sbox"><div class="sv">'+(call.talk_ratio||0)+'%</div><div class="sl">Talk Ratio</div></div>'+
      '<div class="sbox"><div class="sv">'+(call.question_count||0)+'</div><div class="sl">Questions</div></div>'+
      '<div class="sbox"><div class="sv">'+dur+'m</div><div class="sl">Duration</div></div>'+
    '</div>';

    // Game Scorecard
    if (gs.actions) {
      html += renderGameScorecard(gs);
    }

    // Quality breakdown
    html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Quality Score Breakdown</h3>'+
      qualityBreakdownHTML(call)+
    '</div>';

    // Timeframe Analysis — how metrics shift across the call
    html += '<div class="card" id="tf-card">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
        '<h3 style="font-size:14px;margin:0">Call Timeline</h3>'+
        '<div style="display:flex;gap:4px">'+
          '<button class="tf-btn active" onclick="loadTimeframe(\''+rid+'\',\'quarters\',this)">Quarters</button>'+
          '<button class="tf-btn" onclick="loadTimeframe(\''+rid+'\',\'5min\',this)">5-min</button>'+
          '<button class="tf-btn" onclick="loadTimeframe(\''+rid+'\',\'presets\',this)">Phases</button>'+
        '</div>'+
      '</div>'+
      '<div id="tf-content"><div style="color:var(--text2);font-size:12px">Loading timeline...</div></div>'+
    '</div>';

    // Smart Review (primary call analysis)
    const sr = call.smart_review || {};
    if (sr.summary) {
      html += renderSmartReview(sr, call, baseUrl, rid, dur);
    } else {
      // Fallback: show basic stats if no smart review
      html += '<div class="card" style="padding:16px;color:var(--text2);font-size:13px">Smart review not yet generated. Run <code>npm run analyze -- --full</code> to generate.</div>';
    }

    // Engagement pills
    const callPE = call.prospect_engagement || {};
    const callPeEvidence = callPE.evidence || {};
    const callEngTypes = [
      { key: 'buyingSignals', label: 'Buying Signals', cls: 'g', count: callPE.buyingSignals || 0, evidenceKey: 'buying' },
      { key: 'engagementIndicators', label: 'Engagement', cls: 'b', count: callPE.engagementIndicators || 0, evidenceKey: 'engagement' },
      { key: 'redFlags', label: 'Red Flags', cls: 'r', count: callPE.redFlags || 0, evidenceKey: 'redFlags' },
    ];
    if (callPE.buyingSignals || callPE.engagementIndicators || callPE.redFlags) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Engagement Signals</h3>';
      callEngTypes.forEach(e => {
        const evidence = callPeEvidence[e.evidenceKey] || callPE[e.key + 'Evidence'] || callPE[e.key + 'List'] || [];
        html += '<span class="pill '+e.cls+'" onclick="var el=document.getElementById(\'eng-'+e.key+'\');if(el)el.classList.toggle(\'hidden\')">'+e.label+': '+e.count+'</span>';
        if (evidence.length) {
          html += '<div id="eng-'+e.key+'" class="hidden" style="margin:6px 0 10px 8px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:12px">';
          evidence.forEach(ev => {
            const text = typeof ev === 'string' ? ev : (ev.quote || ev.excerpt || ev.text || '');
            const ts = typeof ev === 'object' ? (ev.timestamp || '') : '';
            const speaker = typeof ev === 'object' ? (ev.speaker || '') : '';
            const evType = typeof ev === 'object' ? (ev.type || '') : '';
            html += '<div style="padding:4px 0;border-bottom:1px solid rgba(46,51,72,.3)">';
            if (ts || speaker) html += '<div style="font-size:10px;color:var(--text2);margin-bottom:2px">'+(ts?'<span style="font-family:monospace">'+ts+'</span> ':'')+(speaker?speaker:'')+(evType?' — <span style="font-weight:600">'+evType+'</span>':'')+'</div>';
            html += '<div style="font-style:italic">"'+text+'"</div></div>';
          });
          html += '</div>';
        }
      });
      html += '</div>';
    }

    // Call verdict pills
    const callVerdict = call.call_verdict || [];
    const callVerdictArr = Array.isArray(callVerdict) ? callVerdict : (typeof callVerdict === 'string' ? callVerdict.split(',').map(v => v.trim()) : []);
    if (callVerdictArr.length > 0) {
      const verdictExplanations = {
        'No Close': 'The AE ended the call without attempting any closing technique — no assumptive close, no next-step commitment, no contract mention.',
        'Never Checked In': 'The AE talked without checking if the prospect was following along. No pace checks like "Gaat dit te snel?" or "Is dit relevant?"',
        'Missed Buy Signal': 'The prospect showed interest or asked a buying question, but the AE did not advance or build on it.',
        'Too Much Talking': 'The AE dominated the conversation with a talk ratio above 62%, leaving too little room for the prospect.',
        'Accepted Think-It-Over': 'When the prospect said "ik moet erover nadenken", the AE accepted it instead of converting to concrete conditions.',
        'No Discovery': 'The AE jumped into pitching without asking enough discovery questions to understand the prospect\'s situation.',
        'Strong Discovery': 'The AE asked 18+ targeted questions, understood the prospect\'s business before pitching.',
        'Good Check-ins': 'The AE regularly checked in with the prospect, maintaining engagement and adjusting pace.',
        'Price Without Anchor': 'Pricing was mentioned without first establishing ROI context or value anchoring.',
        'Pricing Without ROI': 'The AE discussed pricing before building a clear ROI case for the prospect.',
        'Live Proof': 'The AE demonstrated the product live with the prospect\'s actual data or website.',
        'Assumptive Close': 'The AE used an assumptive close technique, moving the conversation toward a decision naturally.',
        'ROI Reframe': 'The AE reframed the price in terms of ROI or business impact.',
      };
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Call Verdicts</h3>';
      callVerdictArr.filter(Boolean).forEach(v => {
        const isNeg = v.includes('No ') || v.includes('Never') || v.includes('Missed') || v.includes('Too ') || v.includes('Accepted');
        const vId = 'vd-'+v.replace(/[^a-zA-Z]/g,'');
        const explanation = verdictExplanations[v] || '';
        html += '<span class="pill '+(isNeg?'r':'g')+'" onclick="var el=document.getElementById(\''+vId+'\');if(el)el.classList.toggle(\'hidden\')">'+v+'</span>';
        if (explanation) {
          html += '<div id="'+vId+'" class="hidden" style="margin:4px 0 8px 8px;padding:8px 12px;background:var(--bg3);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.6;border-left:2px solid '+(isNeg?'var(--red)':'var(--green)')+'">'+explanation+'</div>';
        }
      });
      html += '</div>';
    }

    // Script adherence pills
    const callSHit = call.sections_hit || [];
    const callSMiss = call.sections_missed || [];
    if (callSHit.length || callSMiss.length) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Script Adherence — '+(call.script_adherence||0)+'%</h3>'+scriptPillsHTML(callSHit, callSMiss)+'</div>';
    }

    // Behavior scores with evidence
    if (call.patterns && Object.keys(call.patterns).length) {
      html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Behavior Scores</h3>'+behaviorScoresHTML(call)+'</div>';
    }

    // Good / Coachable moments
    const callHighlights = call.highlights || [];
    const callGood = callHighlights.filter(h => h.type === 'strength');
    const callBad = callHighlights.filter(h => h.type === 'coachable');
    if (callGood.length || callBad.length) {
      html += '<div class="grid-2">';
      html += '<div class="card" style="border-top:3px solid var(--green)"><h3 style="font-size:14px;margin-bottom:12px;color:var(--green)">What Went Well</h3>';
      if (callGood.length) { callGood.forEach(h => { html += renderMoment(h, 'good', baseUrl, rid); }); }
      else { html += '<div style="color:var(--text2);font-size:13px">No strengths detected</div>'; }
      html += '</div>';
      html += '<div class="card" style="border-top:3px solid var(--orange)"><h3 style="font-size:14px;margin-bottom:12px;color:var(--orange)">What To Improve</h3>';
      if (callBad.length) { callBad.forEach(h => { html += renderMoment(h, 'coachable', baseUrl, rid); }); }
      else { html += '<div style="color:var(--text2);font-size:13px">No coachable moments detected</div>'; }
      html += '</div>';
      html += '</div>';
    }

    $('app').innerHTML = html;

    // Auto-load timeframe analysis
    loadTimeframe(rid, 'quarters', null);

  } catch (err) {
    $('app').innerHTML = '<button class="back-btn" onclick="loadAEDetail(\''+esc(aeName)+'\')">&larr; Back</button><div class="card" style="border-color:var(--red)"><p>Error: '+err.message+'</p></div>';
  }
}

// ════════════════════════════════════════════════════════
//  CLAAP ANALYZER
// ════════════════════════════════════════════════════════

async function analyzeClaapLink() {
  const input = $('claap-url');
  const url = input ? input.value.trim() : '';
  if (!url) return;

  $('app').innerHTML = '<div style="text-align:center;padding:60px"><div style="font-size:20px;margin-bottom:8px">Analyzing...</div><div style="color:var(--text2)">Fetching from Claap, parsing transcript, running pattern detection</div></div>';

  try {
    const res = await fetch('/api/analyze-call', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer '+authToken },
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (data.error) {
      $('app').innerHTML = '<div style="max-width:700px;margin:40px auto"><div class="card" style="border-color:var(--red)"><h3>Error</h3><p>'+data.error+'</p></div><button class="back-btn" onclick="loadTeam()">&larr; Back to team</button></div>';
      return;
    }
    renderLiveAnalysis(data, url);
  } catch (err) {
    $('app').innerHTML = '<div style="max-width:700px;margin:40px auto"><div class="card" style="border-color:var(--red)"><h3>Error</h3><p>'+(err.message||'Failed to analyze')+'</p></div><button class="back-btn" onclick="loadTeam()">&larr; Back</button></div>';
  }
}

function renderLiveAnalysis(data, originalUrl) {
  const r = data.recording || {};
  const a = data.analysis || {};
  const rid = r.id || '';
  const cq = a.callQualityScore || a.callQuality || 0;
  const verdicts = data.verdicts || [];

  let html = '<div style="max-width:900px;margin:0 auto">';
  html += '<button class="back-btn" onclick="loadTeam()">&larr; Back to team</button>';

  // Recording info
  html += '<div class="card" style="border-left:3px solid var(--purple)">'+
    '<div style="font-size:11px;color:var(--purple);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Live Call Analysis</div>'+
    '<h2 style="font-size:18px;margin-bottom:4px">'+(r.title||'Untitled')+'</h2>'+
    '<div style="color:var(--text2);font-size:13px">'+(r.recorder||'')+' &middot; '+(r.createdAt||'').slice(0,10)+' &middot; '+(r.duration||'')+'min</div>'+
    (r.url?'<a href="'+r.url+'" target="_blank" style="display:inline-block;margin-top:8px;font-size:12px">Open in Claap &rarr;</a>':'')+
  '</div>';

  // Instant verdict table
  if (verdicts.length) {
    html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Instant Verdict</h3>'+
      '<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="text-align:left;padding:6px 10px;color:var(--text2);font-size:11px;border-bottom:1px solid var(--border)">Metric</th><th style="text-align:right;padding:6px 10px;color:var(--text2);font-size:11px;border-bottom:1px solid var(--border)">This Call</th><th style="text-align:right;padding:6px 10px;color:var(--text2);font-size:11px;border-bottom:1px solid var(--border)">Team Avg</th><th style="text-align:left;padding:6px 10px;color:var(--text2);font-size:11px;border-bottom:1px solid var(--border)">Verdict</th></tr></thead><tbody>';
    verdicts.forEach(v => {
      const vClr = v.verdict === 'good' ? 'var(--green)' : v.verdict === 'bad' ? 'var(--red)' : 'var(--orange)';
      html += '<tr><td style="padding:6px 10px;border-bottom:1px solid var(--border)">'+v.metric+'</td>'+
        '<td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);font-weight:600">'+v.value+'</td>'+
        '<td style="padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);color:var(--text2)">'+v.teamAvg+'</td>'+
        '<td style="padding:6px 10px;border-bottom:1px solid var(--border);color:'+vClr+'">'+v.tip+'</td></tr>';
    });
    html += '</tbody></table></div>';
  }

  // Stats
  html += '<div class="grid-4" style="margin-bottom:16px">'+
    '<div class="sbox"><div class="sv" style="color:'+qClr(cq)+'">'+cq+'</div><div class="sl">Quality</div></div>'+
    '<div class="sbox"><div class="sv">'+(a.talkRatio||0)+'%</div><div class="sl">Talk Ratio</div></div>'+
    '<div class="sbox"><div class="sv">'+(a.questionCount||0)+'</div><div class="sl">Questions</div></div>'+
    '<div class="sbox"><div class="sv">'+(r.duration||0)+'m</div><div class="sl">Duration</div></div>'+
  '</div>';

  // Script coverage
  const sHit = a.sectionsHit || [];
  const sMiss = a.sectionsMissed || [];
  if (sHit.length || sMiss.length) {
    html += '<div class="card"><h3 style="font-size:14px;margin-bottom:8px">Script Adherence — '+(a.scriptAdherence||0)+'%</h3>'+scriptPillsHTML(sHit, sMiss)+'</div>';
  }

  // Good / Coachable moments
  const highlights = a.highlights || [];
  const good = highlights.filter(h => h.type === 'strength');
  const bad = highlights.filter(h => h.type === 'coachable');

  html += '<div class="grid-2">';
  html += '<div class="card" style="border-top:3px solid var(--green)"><h3 style="font-size:14px;margin-bottom:12px;color:var(--green)">Good Moments</h3>';
  good.slice(0,6).forEach(h => { html += renderMoment(h, 'good', r.url, rid); });
  if (!good.length) html += '<div style="color:var(--text2);font-size:13px">None detected</div>';
  html += '</div>';

  html += '<div class="card" style="border-top:3px solid var(--orange)"><h3 style="font-size:14px;margin-bottom:12px;color:var(--orange)">Coachable Moments</h3>';
  bad.slice(0,6).forEach(h => { html += renderMoment(h, 'coachable', r.url, rid); });
  if (!bad.length) html += '<div style="color:var(--text2);font-size:13px">None detected</div>';
  html += '</div>';
  html += '</div>';

  // Deep analysis (auto-trigger)
  html += '<div class="card" style="border-left:3px solid var(--purple)">'+
    '<div style="font-size:14px;font-weight:600;margin-bottom:8px">Deep Call Analysis</div>'+
    '<div id="narrative-result"><div style="padding:20px;text-align:center;color:var(--text2)">Generating analysis...</div></div>'+
  '</div>';

  html += '</div>'; // end wrapper

  $('app').innerHTML = html;

  // Auto-trigger narrative
  if (rid) {
    (async () => {
      const result = $('narrative-result');
      try {
        const res = await fetch('/api/call/'+rid+'/narrative', { method: 'POST', headers: { 'Authorization': 'Bearer '+authToken } });
        const d = await res.json();
        if (d.error) { result.innerHTML = '<div style="color:var(--red)">'+d.error+'</div>'; return; }
        result.innerHTML = '<div style="margin-top:8px">'+
          narrativeSectionHTML('Call Summary', d.summary, 'var(--text)', true)+
          narrativeSectionHTML('Objections & Doubts', d.objectionsAnalysis, 'var(--red)', true)+
          narrativeSectionHTML('Buying Signals', d.buyingSignalsAnalysis, 'var(--green)', true)+
          narrativeSectionHTML('Key Coaching Moments', d.coachingMoments, 'var(--orange)', true)+
          narrativeSectionHTML('Overall Verdict', d.overallVerdict, 'var(--purple)', true)+
          '<div style="font-size:10px;color:var(--text2);margin-top:8px">Generated '+(d.generatedAt?new Date(d.generatedAt).toLocaleString():'now')+'</div></div>';
      } catch (err) { result.innerHTML = '<div style="color:var(--red)">'+err.message+'</div>'; }
    })();
  }
}

async function loadSettingsPage() {
  if (authRole !== 'lead') return;
  const settings = await api('/api/settings');
  if (!settings) return;

  let html = '<button class="back-btn" onclick="loadTeam()">&larr; Back</button>';
  html += '<h2 style="font-size:20px;margin-bottom:16px">Platform Settings</h2>';

  // Passwords
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Access Passwords</h3>' +
    '<div style="display:flex;gap:12px;margin-bottom:8px"><label style="font-size:12px;color:var(--text2);width:80px">AE password</label><input id="s-pw-ae" type="text" value="" placeholder="Enter new AE password" style="flex:1;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px"></div>' +
    '<div style="display:flex;gap:12px;margin-bottom:8px"><label style="font-size:12px;color:var(--text2);width:80px">Lead password</label><input id="s-pw-lead" type="text" value="" placeholder="Enter new Lead password" style="flex:1;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px"></div>' +
    '<button onclick="savePasswords()" style="padding:6px 16px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer">Save Passwords</button></div>';

  // Sync Channels
  const channels = settings.sync_channels || [];
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Claap Sync Channels</h3>';
  channels.forEach((ch, i) => {
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="font-size:13px;flex:1">' + ch.name + '</span><span style="font-size:11px;color:var(--text2)">' + ch.id + '</span><button onclick="removeChannel(' + i + ')" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:12px">Remove</button></div>';
  });
  html += '<div style="display:flex;gap:8px;margin-top:8px"><input id="s-ch-id" placeholder="Channel ID" style="flex:1;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px"><input id="s-ch-name" placeholder="Channel Name" style="flex:1;padding:6px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px"><button onclick="addChannel()" style="padding:6px 12px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer">Add</button></div></div>';

  // Quality Weights
  const qw = settings.quality_weights || {};
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Quality Score Weights (must sum to 100)</h3>';
  ['talkBalance','discovery','scriptAdherence','engagement','coachable'].forEach(k => {
    const labels = {talkBalance:'Talk Balance',discovery:'Discovery (Questions)',scriptAdherence:'Script Adherence',engagement:'Engagement',coachable:'Call Discipline'};
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><label style="font-size:12px;color:var(--text2);width:140px">' + labels[k] + '</label><input id="s-qw-' + k + '" type="number" value="' + (qw[k]||0) + '" style="width:60px;padding:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;text-align:center"></div>';
  });
  html += '<button onclick="saveQualityWeights()" style="padding:6px 16px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:4px">Save Weights</button></div>';

  // Thresholds
  const th = settings.thresholds || {};
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Analysis Thresholds</h3>';
  [['talkRatioHigh','Talk ratio "too high" (%)',60],['questionCountLow','Questions "too low"',18],['questionCountTarget','Questions target',22],['monologueWords','Monologue threshold (words)',100],['softeningWordsPerTurn','Softening words per turn',3]].forEach(([k,label,def]) => {
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><label style="font-size:12px;color:var(--text2);width:200px">' + label + '</label><input id="s-th-' + k + '" type="number" value="' + (th[k]||def) + '" style="width:60px;padding:6px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;text-align:center"></div>';
  });
  html += '<button onclick="saveThresholds()" style="padding:6px 16px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:4px">Save Thresholds</button></div>';

  // Deal Patterns
  const dp = settings.deal_patterns || [];
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">Won Deal Name Patterns</h3><div style="font-size:12px;color:var(--text2);margin-bottom:8px">Deal names containing these words are auto-classified as "won"</div>';
  html += '<textarea id="s-dp" style="width:100%;height:60px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:monospace">' + dp.join(', ') + '</textarea>';
  html += '<button onclick="saveDealPatterns()" style="padding:6px 16px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-top:8px">Save Patterns</button></div>';

  // LLM Model
  html += '<div class="card"><h3 style="font-size:14px;margin-bottom:12px">LLM Model for Deep Analysis</h3>';
  html += '<select id="s-llm" style="padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px">';
  ['claude-sonnet-4-6','claude-sonnet-4-20250514','claude-haiku-4-5'].forEach(m => {
    html += '<option value="' + m + '"' + (m === (settings.llm_model||'') ? ' selected' : '') + '>' + m + '</option>';
  });
  html += '</select><button onclick="saveLlmModel()" style="padding:6px 16px;background:var(--purple2);color:white;border:none;border-radius:6px;font-size:12px;cursor:pointer;margin-left:8px">Save</button></div>';

  $('app').innerHTML = html;
}

// Settings save functions
async function savePasswords() {
  const ae = document.getElementById('s-pw-ae').value;
  const lead = document.getElementById('s-pw-lead').value;
  if (!ae || !lead) { alert('Both passwords required'); return; }
  await fetch('/api/settings/auth_passwords', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: { ae, lead } }) });
  alert('Passwords updated. New passwords take effect immediately.');
}

async function saveQualityWeights() {
  const w = {};
  ['talkBalance','discovery','scriptAdherence','engagement','coachable'].forEach(k => { w[k] = parseInt(document.getElementById('s-qw-' + k).value) || 0; });
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  if (sum !== 100) { alert('Weights must sum to 100 (currently ' + sum + ')'); return; }
  await fetch('/api/settings/quality_weights', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: w }) });
  alert('Quality weights saved. Run npm run analyze --full to recalculate.');
}

async function saveThresholds() {
  const th = {};
  ['talkRatioHigh','questionCountLow','questionCountTarget','monologueWords','softeningWordsPerTurn'].forEach(k => { th[k] = parseInt(document.getElementById('s-th-' + k).value) || 0; });
  await fetch('/api/settings/thresholds', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: th }) });
  alert('Thresholds saved.');
}

async function saveDealPatterns() {
  const text = document.getElementById('s-dp').value;
  const patterns = text.split(',').map(s => s.trim()).filter(Boolean);
  await fetch('/api/settings/deal_patterns', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: patterns }) });
  alert('Deal patterns saved.');
}

async function saveLlmModel() {
  const model = document.getElementById('s-llm').value;
  await fetch('/api/settings/llm_model', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: model }) });
  alert('LLM model saved.');
}

async function removeChannel(index) {
  const settings = await api('/api/settings');
  const channels = settings.sync_channels || [];
  channels.splice(index, 1);
  await fetch('/api/settings/sync_channels', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: channels }) });
  loadSettingsPage();
}

async function addChannel() {
  const id = document.getElementById('s-ch-id').value.trim();
  const name = document.getElementById('s-ch-name').value.trim();
  if (!id || !name) { alert('Both ID and name required'); return; }
  const settings = await api('/api/settings');
  const channels = settings.sync_channels || [];
  channels.push({ id, name });
  await fetch('/api/settings/sync_channels', { method: 'PUT', headers: { 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, body: JSON.stringify({ value: channels }) });
  loadSettingsPage();
}

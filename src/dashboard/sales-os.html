.deal-list-item .dli-meta { font-size:12px; color:var(--text-light); }
.deal-list-item .dli-del { color:var(--text-light); font-size:16px; padding:4px 8px; border-radius:4px; border:none; background:none; cursor:pointer; }
.deal-list-item .dli-del:hover { background:rgba(229,72,77,.08); color:var(--red); }

.roi-cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin:16px 0; }
.roi-col { padding:20px; border-radius:var(--radius); }
.roi-col.waste { background:rgba(229,72,77,.04); border:1px solid rgba(229,72,77,.12); }
.roi-col.cost { background:rgba(183,72,255,.04); border:1px solid rgba(183,72,255,.12); }
.roi-col.compound { background:rgba(44,182,125,.04); border:1px solid rgba(44,182,125,.12); }
.roi-col h4 { font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; font-weight:800; }
.roi-col.waste h4 { color:var(--red); }
.roi-col.cost h4 { color:var(--purple3); }
.roi-col.compound h4 { color:var(--green); }
.roi-row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid rgba(0,0,0,.04); font-size:14px; }
.roi-row:last-child { border:none; }
.roi-row .rr-label { color:var(--text); }
.roi-row .rr-value { font-weight:700; color:var(--blackish); font-variant-numeric:tabular-nums; }
.roi-summary { background:var(--navy); color:white; padding:20px 24px; border-radius:var(--radius); margin:16px 0; font-size:15px; line-height:1.7; }
.roi-summary strong { color:var(--purple-soft); }
.roi-input-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
.roi-field { display:flex; flex-direction:column; gap:4px; }
.roi-field label { font-size:12px; font-weight:600; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; }
.roi-field input, .roi-field select, .roi-field textarea { padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'Archivo',sans-serif; color:var(--blackish); background:var(--white); }
.roi-field input:focus, .roi-field select:focus, .roi-field textarea:focus { outline:none; border-color:var(--purple3); box-shadow:0 0 0 3px rgba(183,72,255,.08); }
.roi-field textarea { resize:vertical; min-height:60px; line-height:1.5; }

.disc-controls { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
.disc-controls select { padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'Archivo',sans-serif; color:var(--blackish); background:var(--white); min-width:180px; cursor:pointer; }
.disc-controls select:focus { outline:none; border-color:var(--purple3); }
.disc-question { padding:16px 20px; border-left:3px solid var(--purple3); background:var(--light-bg); border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:10px 0; position:relative; }
.disc-question .dq-main { font-size:15px; color:var(--blackish); font-weight:500; line-height:1.6; }
.disc-question .dq-follow { font-size:13px; color:var(--text); margin-top:6px; font-style:italic; }
.disc-question .dq-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; background:rgba(183,72,255,.08); color:var(--purple3); margin-top:8px; display:inline-block; }
.disc-question .dq-votes { display:flex; gap:6px; margin-top:8px; }
.disc-question .dq-vote-btn { padding:3px 10px; border-radius:4px; border:1px solid var(--border); background:var(--white); font-size:11px; font-weight:600; cursor:pointer; font-family:'Archivo',sans-serif; transition:all .15s; }
.disc-question .dq-vote-btn:hover { border-color:var(--purple3); }
.disc-question .dq-vote-btn.up { color:var(--green); }
.disc-question .dq-vote-btn.down { color:var(--red); }

/* Flag system */
.flag-btn { padding:3px 10px; border-radius:4px; border:1px solid var(--border); background:var(--white); font-size:11px; font-weight:600; cursor:pointer; font-family:'Archivo',sans-serif; color:var(--text-light); transition:all .15s; }
.flag-btn:hover { border-color:var(--orange); color:var(--orange); }
.flag-banner { background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.2); border-radius:var(--radius-sm); padding:10px 16px; margin-bottom:16px; font-size:13px; font-weight:600; color:#8C6D1F; }
.flag-form { margin-top:8px; display:flex; gap:6px; }
.flag-form input { flex:1; padding:6px 10px; border:1px solid var(--border); border-radius:4px; font-size:12px; font-family:'Archivo',sans-serif; }
.flag-form button { padding:6px 12px; border-radius:4px; border:none; background:var(--orange); color:white; font-size:11px; font-weight:700; cursor:pointer; font-family:'Archivo',sans-serif; }

/* Experiment cards */
.exp-card { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:20px; margin-bottom:12px; }
.exp-card .exp-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.exp-card .exp-name { font-size:15px; font-weight:700; color:var(--blackish); flex:1; }
.exp-card .exp-meta { font-size:13px; color:var(--text); margin-top:6px; line-height:1.6; }
.exp-card .exp-actions { display:flex; gap:6px; margin-top:10px; }

/* Learning log entries */
.learning-entry { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:16px 20px; margin-bottom:10px; }
.learning-entry .le-what { font-size:14px; font-weight:600; color:var(--blackish); margin-bottom:4px; }
.learning-entry .le-learned { font-size:14px; color:var(--text); line-height:1.6; }
.learning-entry .le-meta { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
.learning-entry .le-cat { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; background:rgba(183,72,255,.08); color:var(--purple3); }
.learning-entry .le-impact { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; }
.learning-entry .le-impact.validates { background:rgba(44,182,125,.1); color:var(--green); }
.learning-entry .le-impact.challenges { background:rgba(229,72,77,.1); color:var(--red); }
.learning-entry .le-impact.new-insight { background:rgba(123,159,255,.1); color:var(--blue); }
.learning-entry .le-impact.needs-data { background:rgba(245,166,35,.1); color:var(--orange); }
.learning-entry .le-date { font-size:11px; color:var(--text-light); }
.learning-entry .le-deal { font-size:11px; color:var(--text-light); font-style:italic; }
.learning-entry .le-change { font-size:13px; color:var(--text); margin-top:4px; font-style:italic; border-left:2px solid var(--purple-soft); padding-left:10px; }

/* ICP hypothesis */
.icp-card { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:20px; margin-bottom:12px; }
.icp-card .icp-header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.icp-card .icp-hyp { font-size:15px; font-weight:700; color:var(--blackish); }
.icp-card .icp-evidence { margin-top:10px; }
.icp-card .icp-ev-item { font-size:13px; padding:4px 0; border-bottom:1px solid var(--border-light); color:var(--text); }
.icp-card .icp-ev-item:last-child { border:none; }
.icp-card .icp-ev-for { color:var(--green); }
.icp-card .icp-ev-against { color:var(--red); }

/* Category filter pills */
.filter-pills { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
.filter-pill { padding:5px 14px; border-radius:20px; border:1px solid var(--border); background:var(--white); font-size:12px; font-weight:600; cursor:pointer; font-family:'Archivo',sans-serif; color:var(--text); transition:all .15s; }
.filter-pill:hover { border-color:var(--purple3); color:var(--purple3); }
.filter-pill.active { background:var(--purple3); color:white; border-color:var(--purple3); }
.filter-pill .fp-count { font-size:10px; opacity:.7; margin-left:2px; }

@media(max-width:900px) {
  .sidebar { display:none; }
  .stat-grid,.scenario-kpi { grid-template-columns:1fr 1fr; }
  .tier-cards,.do-dont,.grid-2,.grid-3,.roi-cols,.roi-input-grid { grid-template-columns:1fr; }
  .pipeline { flex-wrap:wrap; }
  .content { padding:16px; }
  .topbar { padding:12px 16px; }
}

<script>
// ── STATE ──
let currentRole = 'ae';
let currentPage = 'dashboard';

// ── API AUTH ──
function getAuthToken() {
  return localStorage.getItem('SALES_OS_API_TOKEN') || '';
}
function apiFetch(url, opts = {}) {
  const token = getAuthToken();
  const headers = { ...(opts.headers || {}), 'X-Auth-Token': token };
  if (opts.body && typeof opts.body === 'string') headers['Content-Type'] = 'application/json';
  return fetch(url, { ...opts, headers });
}
function isApiAuthenticated() {
  return !!getAuthToken();
}
function showApiLogin(onSuccess) {
  const el = document.getElementById('content');
  el.innerHTML = `<div class="page-header"><h1>Connect to API</h1><p>Enter your dashboard password to access call recordings and analysis.</p></div>
  <div class="card" style="max-width:400px"><div style="display:flex;flex-direction:column;gap:10px">
    <input type="password" id="api-pw" placeholder="Dashboard password" style="padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Archivo',sans-serif">
    <button onclick="doApiLogin()" style="padding:10px;background:var(--purple3);color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Archivo',sans-serif">Connect</button>
    <div id="api-login-err" style="font-size:13px;color:var(--red);display:none"></div>
  </div></div>`;
  window._apiLoginCallback = onSuccess;
}
window.doApiLogin = async function() {
  const pw = document.getElementById('api-pw').value;
  try {
    const res = await fetch('/api/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:pw}) });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('SALES_OS_API_TOKEN', data.token);
      if (window._apiLoginCallback) window._apiLoginCallback();
      else navigateTo(currentPage);
    } else {
      const err = document.getElementById('api-login-err');
      err.textContent = 'Invalid password';
      err.style.display = 'block';
    }
  } catch(e) {
    const err = document.getElementById('api-login-err');
    err.textContent = 'Connection failed: ' + e.message;
    err.style.display = 'block';
  }
};

// ── LOCALSTORAGE ──
const LS={get(k){try{return JSON.parse(localStorage.getItem('SALES_OS_'+k))}catch{return null}},set(k,v){localStorage.setItem('SALES_OS_'+k,JSON.stringify(v))},del(k){localStorage.removeItem('SALES_OS_'+k)}};
function fmt(n){return n>=1000?'\u20AC'+(n/1000).toFixed(n%1000===0?0:1)+'k':'\u20AC'+n;}
function fmtM(n){return '\u20AC'+(n/1000000).toFixed(2)+'M';}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function confPill(level){return '<span class="conf-pill '+level+'">'+level.charAt(0).toUpperCase()+level.slice(1)+'</span>';}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard'));}
function copyTemplate(key){copyText(OS.templates[key]);}

// ── DATA ──
const OS = {
  stages: [
    {id:'s0',num:'0',name:'BDR Qualification',conf:'testing',owner:'BDR',goal:'Protect AE time -- only Green/near-Green accounts reach AEs.',artifacts:['Deal Hypothesis: ICP fit, trigger/pain signal, what to validate, one disqualifier'],exit:['Hypothesis logged in CRM','AE accepts or rejects within 24h'],kills:['Hypothesis incomplete -- AE may reject'],multiThread:'N/A',tips:'Tell the prospect: "I\'m connecting you with [AE] who leads our strategic accounts. They\'ll spend the first call understanding your situation -- no pitch, no demo."'},
    {id:'s1',num:'1',name:'Problem Framing',conf:'testing',owner:'AE',goal:'Decide fast if this account deserves further investment. No demo. No pitch. No features.',artifacts:['Problem Statement -- one paragraph, in buyer language exactly as they describe it'],exit:['Buyer agrees a structural problem exists','Buyer rejects "more content / better agency" as solution','AE restates problem in buyer language','At least one additional stakeholder role named'],kills:['Wants tactics immediately','Asks for rankings / guarantees','Frames us as a tool or agency','Curiosity without pain'],multiThread:'Ask: "Who else internally would immediately recognize this problem?"',tips:'This is a disqualification stage, not a pitch stage. Killing bad deals here is a success outcome.'},
    {id:'s2',num:'2',name:'Current State Deconstruction',conf:'testing',owner:'AE',goal:'Expose waste, friction, and decision latency. Test where WP SEO AI wins unfairly.',artifacts:['Current State Map: owners, tools, bottlenecks, what happens to non-performing content, how decisions are made'],exit:['Buyer acknowledges content/effort waste','Buyer sees value in learning before scaling','Clear internal owner identified','Second stakeholder function identified','Validation Demo scheduled (or reason logged)'],kills:['No demo scheduled within 7 days -> auto-park'],multiThread:'Ask: "This usually breaks between teams -- who would challenge or validate this internally?"',tips:'Get the inputs for the business case here: content production volume, tooling costs, agency spend, performing content %.'},

function renderSidebar(){
  const nav=NAV[currentRole]||NAV.ae;
  let html='';
  nav.forEach(section=>{
    html+=`<div class="sb-section"><div class="sb-section-title">${section.section}</div>`;
    section.items.forEach(item=>{
      html+=`<div class="sb-item${item.id===currentPage?' active':''}" onclick="navigateTo('${item.id}')"><span class="sb-icon">${item.icon}</span><span class="sb-label">${item.label}</span></div>`;
    });
    html+='</div>';
  });
  document.getElementById('sidebarNav').innerHTML=html;
}

function navigateTo(page){
  currentPage=page;
  renderSidebar();
  const el=document.getElementById('content');
  const titleEl=document.getElementById('pageTitle');
  const labels={};
  Object.values(NAV).forEach(sections=>sections.forEach(s=>s.items.forEach(i=>{labels[i.id]=i.label;})));
  titleEl.innerHTML='/ '+(labels[page]||page);
  el.innerHTML='';
  if(PAGE_RENDERERS[page])PAGE_RENDERERS[page](el);
  else el.innerHTML='<div class="callout warn">Page not found: '+page+'</div>';
  document.querySelector('.content').scrollTop=0;
}

function setRole(r){
  currentRole=r;
  LS.set('ROLE',r);
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===r));
  renderSidebar();
  navigateTo('dashboard');
}

// ── SEARCH ──
function handleSearch(q){
  const box=document.getElementById('searchResults');
  if(!q||q.length<2){box.classList.remove('show');return;}
  const lower=q.toLowerCase();
  const allPages=[];
  Object.values(NAV).forEach(sections=>sections.forEach(s=>s.items.forEach(i=>{
    if(!allPages.find(p=>p.id===i.id))allPages.push(i);
  })));
  const searchItems=[];
  allPages.forEach(p=>{searchItems.push({id:p.id,title:p.label,context:'Page',tag:''});});
  OS.stages.forEach(s=>{searchItems.push({id:'process',title:'Stage '+s.num+': '+s.name,context:s.goal.substring(0,80),tag:'Process'});});
  OS.narrative.acts.forEach(a=>{searchItems.push({id:'narrative',title:'Act '+a.n+': '+a.title,context:a.hook,tag:'Narrative'});});
  OS.narrative.dataPoints.forEach(d=>{searchItems.push({id:'narrative',title:d.d,context:'Source: '+d.s,tag:'Data'});});
  searchItems.push({id:'narrative-b2c',title:'B2C Narrative',context:'Talk track for consumer businesses — e-commerce, retail, hospitality, health and fitness',tag:'Foundation'});
  OS.offers.forEach(o=>{searchItems.push({id:'offers',title:o.tier+' '+o.price,context:o.scope,tag:'Offer'});});
  OS.championTests.forEach(t=>{searchItems.push({id:'champion',title:t.test,context:t.action.substring(0,60),tag:'Champion'});});
  // Search learnings
  const learnings=LS.get('LEARNINGS')||[];
  learnings.forEach(l=>{searchItems.push({id:'learning-log',title:l.what,context:l.learned||'',tag:'Learning'});});
  // Search experiments
  const exps=LS.get('EXPERIMENTS')||getDefaultExperiments();
  exps.forEach(e=>{searchItems.push({id:'experiments',title:e.name,context:e.hypothesis,tag:'Experiment'});});
  const results=searchItems.filter(i=>(i.title+' '+i.context+' '+i.tag).toLowerCase().includes(lower)).slice(0,8);
  if(!results.length){box.classList.remove('show');return;}
  box.innerHTML=results.map(r=>`<div class="sr-item" onmousedown="navigateTo('${r.id}')"><div class="sr-title">${r.title}</div>${r.context?'<div class="sr-context">'+r.context+'</div>':''}${r.tag?'<div class="sr-tag">'+r.tag+'</div>':''}</div>`).join('');
  box.classList.add('show');
}

PAGE_RENDERERS.objections=(el)=>{
  const flags=LS.get('FLAGS_objections')||[];
  const obs=[
    {id:'obj1',o:'"We already have an agency."',r:'That means you have a point of comparison. What we hear is the agency delivers content but doesn\'t close the learning loop. When AI search changes, you wait for the quarterly review. What happens to content that doesn\'t perform?',s:'1-2',conf:'testing'},
    {id:'obj2',o:'"We can do this in-house with AI tools."',r:'You can -- that solves volume. But volume without signal is waste at scale. If you don\'t know which 5% drives 80% of authority, you\'re producing cost, not return.',s:'1-3',conf:'testing'},

    {id:'obj4',o:'"The timing isn\'t right."',r:'What changes in 3-6 months? Authority positions are being claimed now. Every quarter of delay is compounding advantage given to someone else. 18-24 months to close the gap.',s:'3-4',conf:'hypothesis'},
    {id:'obj5',o:'"\\u20AC15K for a pilot is a lot."',r:'It\'s less than two months of agency content that doesn\'t compound. You get 240-360 articles, visibility growth, AI citations, and a data-backed go/no-go at month 6. What\'s the residual value of your last \\u20AC15K in ad spend?',s:'3-4',conf:'hypothesis'},
    {id:'obj6',o:'"We need procurement / legal."',r:'Good -- that means it\'s being taken seriously. Let\'s map the process: who, what timeline, what they need. We\'ll build that into the Mutual Action Plan.',s:'4',conf:'hypothesis'},
    {id:'obj7',o:'"Can you guarantee results?"',r:'We don\'t guarantee rankings. We guarantee execution: volume, the loop, measurement, optimization. The pilot has clear KPIs we control. You\'ll see trajectory in 90 days.',s:'2-4',conf:'hypothesis'}
  ];

  function render(){
    el.innerHTML=`<div class="page-header"><h1>Objection handling</h1><p>Common objections with stage context and response frameworks. Flag anything that needs updating.</p></div>
    ${flags.length?'<div class="flag-banner">'+flags.length+' item(s) flagged by the team</div>':''}
    ${obs.map(o=>{
      const itemFlags=flags.filter(f=>f.itemId===o.id);
      return `<div class="card"><h3>${o.o} <span class="badge purple">Stage ${o.s}</span> ${confPill(o.conf)}</h3><p>${o.r}</p>
      <div style="display:flex;gap:8px;margin-top:10px;align-items:center">
        <button class="flag-btn" onclick="toggleFlagForm('${o.id}')">Flag this</button>
        ${itemFlags.length?'<span style="font-size:11px;color:var(--orange);font-weight:600">'+itemFlags.length+' flag(s)</span>':''}
      </div>
      <div id="flag-form-${o.id}" style="display:none" class="flag-form">
        <input type="text" id="flag-input-${o.id}" placeholder="What's wrong with this response?">
        <button onclick="submitFlag('objections','${o.id}')">Submit</button>
      </div>
      ${itemFlags.map(f=>'<div style="font-size:12px;color:var(--orange);margin-top:4px;padding-left:12px;border-left:2px solid var(--orange)">'+escapeHtml(f.text)+' <span style="color:var(--text-light)">'+f.date+'</span></div>').join('')}
      </div>`;
    }).join('')}`;
  }

  window.toggleFlagForm=function(id){
    const form=document.getElementById('flag-form-'+id);
    form.style.display=form.style.display==='none'?'flex':'none';
  };
  window.submitFlag=function(page,itemId){
    const input=document.getElementById('flag-input-'+itemId);
    if(!input.value.trim())return;
    const flags=LS.get('FLAGS_'+page)||[];
    flags.push({itemId:itemId,text:input.value.trim(),date:new Date().toISOString().split('T')[0]});
    LS.set('FLAGS_'+page,flags);
    toast('Flag submitted');
    render();
  };

  render();
};

PAGE_RENDERERS['learning-log']=(el)=>{
  let learnings=LS.get('LEARNINGS')||[];
  let activeFilter='all';

  const categories=['Process','ICP','Pricing','Narrative','Objections','Competitive','Discovery','Expansion','Team'];
  const impacts=['Validates current approach','Challenges current approach','New insight','Needs more data'];

  function getCatCounts(){
    const counts={all:learnings.length};
    categories.forEach(c=>{counts[c]=learnings.filter(l=>l.category===c).length;});
    return counts;
  }

  function render(){
    const filtered=activeFilter==='all'?learnings:learnings.filter(l=>l.category===activeFilter);

    el.innerHTML=`<div class="page-header"><h1>Learning log</h1><p>Quick-capture what you learn from every deal, call, and experiment. 30 seconds max.</p></div>
    <div class="card"><h3>Capture a learning</h3>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="roi-field"><label>What happened (1-2 lines)</label><textarea id="ll-what" rows="2" placeholder="e.g., Foodora CFO pushed back on pilot pricing"></textarea></div>
        <div class="grid-2">
          <div class="roi-field"><label>Category</label><select id="ll-category">${categories.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>
          <div class="roi-field"><label>Confidence impact</label><select id="ll-impact">${impacts.map(i=>`<option value="${i}">${i}</option>`).join('')}</select></div>
        </div>
        <div class="roi-field"><label>What we learned (1-2 lines)</label><textarea id="ll-learned" rows="2" placeholder="e.g., CFO wants ROI framed as cost avoidance, not growth"></textarea></div>
        <div class="grid-2">
          <div class="roi-field"><label>What should change (optional)</label><textarea id="ll-change" rows="2" placeholder="e.g., Add cost avoidance framing to Stage 3 deck"></textarea></div>
          <div class="roi-field"><label>Deal name (optional)</label><input id="ll-deal" placeholder="e.g., Foodora"></div>
        </div>
        <button class="qa-btn primary" onclick="saveLearning()">Save learning</button>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px">
      <h3 style="font-size:16px;font-weight:700;color:var(--blackish)">${learnings.length} learning${learnings.length!==1?'s':''} captured</h3>
    </div>
    <div class="filter-pills">
      <div class="filter-pill${activeFilter==='all'?' active':''}" onclick="filterLearnings('all')">All <span class="fp-count">${counts.all}</span></div>
      ${categories.filter(c=>counts[c]>0).map(c=>`<div class="filter-pill${activeFilter===c?' active':''}" onclick="filterLearnings('${c}')">${c} <span class="fp-count">${counts[c]}</span></div>`).join('')}
    </div>

    ${filtered.length?filtered.map((l,i)=>{
      const impactClass=l.impact==='Validates current approach'?'validates':l.impact==='Challenges current approach'?'challenges':l.impact==='New insight'?'new-insight':'needs-data';
      return `<div class="learning-entry">
        <div class="le-what">${escapeHtml(l.what)}</div>
        <div class="le-learned">${escapeHtml(l.learned||'')}</div>
        ${l.change?'<div class="le-change">'+escapeHtml(l.change)+'</div>':''}
        <div class="le-meta">
          <span class="le-cat">${l.category}</span>
          <span class="le-impact ${impactClass}">${l.impact}</span>
          ${l.deal?'<span class="le-deal">'+escapeHtml(l.deal)+'</span>':''}
          <span class="le-date">${l.date||''}</span>
          <button class="flag-btn" onclick="deleteLearning(${i})" style="margin-left:auto;color:var(--red);border-color:var(--red)">Delete</button>
        </div>
      </div>`;
    }).join(''):'<div class="callout info">No learnings captured yet. Use the form above.</div>'}`;
  }

  window.saveLearning=function(){
    const what=document.getElementById('ll-what').value.trim();

    if(!what){toast('Enter what happened');return;}
    learnings.unshift({
      what:what,
      category:document.getElementById('ll-category').value,
      learned:learned,
      change:document.getElementById('ll-change').value.trim(),
      impact:document.getElementById('ll-impact').value,
      deal:document.getElementById('ll-deal').value.trim(),
      date:new Date().toISOString().split('T')[0]
    });
    LS.set('LEARNINGS',learnings);
    toast('Learning captured');
    render();
  };
  window.filterLearnings=function(cat){activeFilter=cat;render();};
  window.deleteLearning=function(i){learnings.splice(i,1);LS.set('LEARNINGS',learnings);render();};

  render();
};

// ── SCENARIO PLANNER ──
const MONTHS=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TARGET=2000000;
const ARR_PILOT=15000,ARR_MED=50000,ARR_BIG=100000;
const CONV_DELAY=5; // month-5 review per MM-OS

const SCENARIO_V2_DEFAULTS={
  // Deal entries per month — from whiteboard session
  pilots:    [0, 2, 5, 5, 5, 5, 6, 8, 9],   // €15K each
  directMed: [0, 0, 1, 0, 0, 0, 0, 0, 0],   // €50K each
  directBig: [0, 1, 0, 1, 1, 2, 1, 3, 4],   // €100K each
  // Headcount per month (editable)
  aesRamped: [1.2, 1.2, 2, 2, 2, 2, 2, 2, 2],  // Martijn(1) + Victor(0.2→1 in Jun), no ramp
  aesNew:    [0, 0, 0, 2, 2, 3, 4, 5, 5],       // new hires, subject to ramp curve
  bdrs:      [1, 2, 3, 3, 4, 4, 5, 5, 5],
  // Conversion assumptions
  convToMed: 40,   // % of pilots that convert to Medium
  convToBig: 10,   // % of pilots that convert to Large
  // Funnel assumptions
  closePilot:10, closeMed:10, closeBig:5, bdrMeetings:15,
  // AE capacity
  aeQuarterlyTarget: 240,  // €K per Q per fully ramped AE
  aeRampPct: [50, 75, 100] // month 1/2/3+ productivity %
};
const AE_COST=6000, BDR_COST=4000; // monthly cost per head

function computeModel(s){
  const pilots=s.pilots||[...SCENARIO_V2_DEFAULTS.pilots];
  const dMed=s.directMed||[...SCENARIO_V2_DEFAULTS.directMed];
  const dBig=s.directBig||[...SCENARIO_V2_DEFAULTS.directBig];
  const cMed=(s.convToMed!=null?s.convToMed:SCENARIO_V2_DEFAULTS.convToMed)/100;
  const cBig=(s.convToBig!=null?s.convToBig:SCENARIO_V2_DEFAULTS.convToBig)/100;

  // Per-month ARR waterfall
  const newPilotARR=[], newMedARR=[], newBigARR=[];
  const convMedARR=[], convBigARR=[];
  let cumARR=0, cumNewDeal=0;
  const cumLine=[], cumNewLine=[];
  let totPilots=0,totDMed=0,totDBig=0,totConvMed=0,totConvBig=0;

  for(let i=0;i<MONTHS.length;i++){
    const p=pilots[i]||0, m=dMed[i]||0, b=dBig[i]||0;
    totPilots+=p; totDMed+=m; totDBig+=b;

    // New deal ARR
    newPilotARR[i]=p*ARR_PILOT;
    newMedARR[i]=m*ARR_MED;
    newBigARR[i]=b*ARR_BIG;

    // Conversions: pilots from month (i - CONV_DELAY) converting now
    const srcIdx=i-CONV_DELAY;
    let cM=0, cB=0;
    if(srcIdx>=0 && pilots[srcIdx]>0){
      cM=Math.round(pilots[srcIdx]*cMed*10)/10;
      cB=Math.round(pilots[srcIdx]*cBig*10)/10;
      totConvMed+=cM; totConvBig+=cB;
    }
    // Conversion ARR = upgrade delta (they already had pilot ARR)
    convMedARR[i]=cM*(ARR_MED-ARR_PILOT);
    convBigARR[i]=cB*(ARR_BIG-ARR_PILOT);

    const newDealARR=newPilotARR[i]+newMedARR[i]+newBigARR[i];
    const expansionARR=convMedARR[i]+convBigARR[i];
    cumNewDeal+=newDealARR;
    cumARR+=newDealARR+expansionARR;
    cumLine[i]=cumARR;
    cumNewLine[i]=cumNewDeal;
  }
  return {pilots,dMed,dBig,newPilotARR,newMedARR,newBigARR,convMedARR,convBigARR,
    cumLine,cumARR,cumNewLine,cumNewDeal,
    totPilots,totDMed,totDBig,totConvMed,totConvBig,cMed,cBig};
}

    </div>`).join('')}</div>`:'<div class="callout info">No deals scored yet. Create your first scorecard above.</div>'}`;
  }

  function renderEditor(deal,idx){
    const score=DEAL_CHECKS.reduce((s,c)=>s+(deal.checks[c.id]?c.weight:0),0);
    const unchecked=DEAL_CHECKS.filter(c=>!deal.checks[c.id]).sort((a,b)=>b.weight-a.weight);
    el.innerHTML=`<div class="page-header"><h1>${escapeHtml(deal.name||'New deal')}</h1><p>Score: ${score}/100</p></div>
    <div class="grid-2"><div>
    <div class="card" style="text-align:center">
      <div class="score-ring ${scoreColor(score)}"><div class="sr-num" style="color:var(--${scoreColor(score)})">${score}</div><div class="sr-label">${scoreLabel(score)}</div></div>
    </div>
    <div class="card"><h3>Deal info</h3>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input placeholder="Deal name" value="${escapeHtml(deal.name||'')}" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'name',this.value)">
        <select style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'stage',this.value)">
          ${['0','1','2','2.5','3','4','5'].map(s=>`<option value="${s}"${deal.stage===s?' selected':''}>Stage ${s}</option>`).join('')}
        </select>
        <input type="number" placeholder="Deal value (\u20AC)" value="${deal.value||''}" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'value',this.value)">
      </div>
    </div>
    ${unchecked.length?`<div class="card"><h3 style="color:var(--red)">Fix these first</h3><ul style="font-size:14px;line-height:2;list-style:none">${unchecked.slice(0,5).map(c=>`<li><span class="badge ${c.weight>=15?'red':c.weight>=10?'orange':'blue'}">${c.weight}pts</span> ${c.label}</li>`).join('')}</ul></div>`:''}
    </div><div>
    <div class="card"><h3>Health checklist</h3>
      ${DEAL_CHECKS.map(c=>`<div class="deal-check"><input type="checkbox" ${deal.checks[c.id]?'checked':''} onchange="toggleDealCheck(${idx},'${c.id}',this.checked)"><div class="dc-label">${c.label}</div><div class="dc-weight">${c.weight}pts</div><div class="dc-cat">${c.cat}</div></div>`).join('')}
    </div></div></div>
    <div style="margin-top:16px" class="card"><h3>What did you learn from scoring this deal?</h3>
      <p style="margin-bottom:8px;font-size:13px;color:var(--text)">Quick capture -- this goes straight to the learning log.</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <textarea id="deal-learning" rows="2" placeholder="e.g., Multi-threading is the blocker -- need to push for second stakeholder earlier" style="padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:'Archivo',sans-serif;resize:vertical"></textarea>
        <button class="qa-btn primary" onclick="saveDealLearning(${idx})">Save learning from this deal</button>
      </div>
    </div>
    <button class="qa-btn" onclick="backToDeals()" style="margin-top:12px"><span class="qa-icon">&larr;</span> Back to all deals</button>`;
  }

  window.startNewDeal=function(){const d={name:'',stage:'1',value:'',checks:{},score:0};deals.push(d);LS.set('DEALS',deals);renderEditor(d,deals.length-1);};
  window.editDeal=function(i){renderEditor(deals[i],i);};
  window.deleteDeal=function(i){deals.splice(i,1);LS.set('DEALS',deals);renderList();};
  window.backToDeals=function(){renderList();};
  window.updateDealField=function(i,f,v){deals[i][f]=v;LS.set('DEALS',deals);renderEditor(deals[i],i);};
  window.toggleDealCheck=function(i,id,v){deals[i].checks[id]=v;deals[i].score=DEAL_CHECKS.reduce((s,c)=>s+(deals[i].checks[c.id]?c.weight:0),0);LS.set('DEALS',deals);renderEditor(deals[i],i);};
  window.saveDealLearning=function(idx){
    const text=document.getElementById('deal-learning').value.trim();
    if(!text){toast('Enter what you learned');return;}
    const learnings=LS.get('LEARNINGS')||[];
    learnings.unshift({
      what:'Deal scorecard: '+(deals[idx].name||'Unnamed')+' (Stage '+deals[idx].stage+')',
      category:'Process',
      learned:text,
      change:'',
      impact:'New insight',
      deal:deals[idx].name||'',
      date:new Date().toISOString().split('T')[0]
    });
    LS.set('LEARNINGS',learnings);
    toast('Learning captured from deal');
    document.getElementById('deal-learning').value='';
  };

  renderList();
};

PAGE_RENDERERS.discovery=(el)=>{
  let persona='CMO',stage='1';
  const votes=LS.get('DISC_VOTES')||{};

  function render(){
    const key=persona+'-'+stage;
    const qs=DISC_QUESTIONS[key]||[];
    const personas=['CMO','VP Marketing','Head of Content','CTO','CFO','Procurement'];
    const stages=['1','2','3','4'];

    <div class="disc-controls">
      <select onchange="updateDisc('persona',this.value)">${personas.map(p=>`<option${p===persona?' selected':''}>${p}</option>`).join('')}</select>
      <select onchange="updateDisc('stage',this.value)">${stages.map(s=>`<option value="${s}"${s===stage?' selected':''}>Stage ${s}</option>`).join('')}</select>
    </div>
    ${qs.length?qs.map((q,i)=>{
      const vk=key+'-'+i;
      const up=(votes[vk+'_up']||0);
      const down=(votes[vk+'_down']||0);
      return `<div class="disc-question"><div class="dq-main">"${q.q}"</div><div class="dq-follow">Follow-up: ${q.f}</div><div class="dq-tag">${q.t}</div>

    toast(dir==='up'?'Marked as worked':'Marked as didn\'t work');
    render();
  };
  render();
};

// ── MARKDOWN RENDERER ──
function mdToHtml(md) {
  return md
    .replace(/^### (.+)$/gm, '<h3 style="margin-top:24px;margin-bottom:8px;color:var(--blackish)">$1</h3>')
    .replace(/^## (.+)$/gm, '<h2 style="margin-top:32px;margin-bottom:12px;font-size:20px;font-weight:700;color:var(--blackish);border-bottom:2px solid var(--border-light);padding-bottom:8px">$1</h2>')
    .replace(/^# (.+)$/gm, '')
    .replace(/^\*\*(.+?)\*\*$/gm, '<p style="font-weight:700;color:var(--blackish);margin:8px 0">$1</p>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*\[(.+?)\]\*/g, '<em style="color:var(--text-light);font-size:13px">[$1]</em>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)$/gm, '<li style="margin:2px 0;padding-left:4px">$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li style="margin:2px 0;padding-left:4px">$2</li>')
    .replace(/^\| (.+) \|$/gm, (match) => {
      const cells = match.slice(1,-1).split('|').map(c => c.trim());
      return '<tr>' + cells.map(c => '<td style="padding:6px 10px;border-bottom:1px solid var(--border-light);font-size:13px">' + c + '</td>').join('') + '</tr>';
    })
    .replace(/^\|[-| ]+\|$/gm, '')
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border-light);margin:24px 0">')
    .replace(/^(?!<[hplutrdi])((?!^$).+)$/gm, '<p style="margin:6px 0;line-height:1.7">$1</p>')
    .replace(/(<li[^>]*>.*<\/li>\n?)+/g, (match) => '<ul style="list-style:none;margin:8px 0;padding-left:12px">' + match + '</ul>')
    .replace(/(<tr>.*<\/tr>\n?)+/g, (match) => '<table class="os-table" style="margin:12px 0">' + match + '</table>')
    .replace(/<p[^>]*>\s*<\/p>/g, '');
}

    document.getElementById('fn-loading').innerHTML = '<span class="badge red">Failed: ' + err.message + '</span>';
  });
};

// ── B2C NARRATIVE PAGE ──
PAGE_RENDERERS['narrative-b2c'] = (el) => {
  el.innerHTML = `<div class="page-header"><h1>B2C narrative ${confPill('draft')}</h1><p>Talk track for mid-market B2C companies — e-commerce, retail, hospitality, health and fitness, consumer brands.</p></div><div id="b2c-loading" class="callout info">Loading B2C narrative...</div><div id="b2c-content"></div>`;

  apiFetch('/api/mm/narrative-b2c').then(r => {
    if (r.status === 401) { showApiLogin(() => navigateTo('narrative-b2c')); return; }
    return r.text();
  }).then(md => {
    if (!md) return;
    document.getElementById('b2c-loading').style.display = 'none';
    document.getElementById('b2c-content').innerHTML = `<div class="callout info" style="margin-bottom:16px"><strong>B2C adaptation:</strong> Same structure as the B2B narrative but reframed for consumer businesses. Opening uses customer behaviour (not procurement data). Examples use products (running shoes, yoga mats) not abstract B2B categories. Urgency framed through CAC and seasonal timing.</div><div class="card" style="max-width:720px;line-height:1.8;font-size:15px;color:var(--text)">${mdToHtml(md)}</div>`;
  }).catch(err => {
    document.getElementById('b2c-loading').innerHTML = '<span class="badge red">Failed: ' + err.message + '</span>';
  });
};

// ── CALL ANALYSIS PAGE ──
PAGE_RENDERERS['call-analysis'] = (el) => {
  if (!isApiAuthenticated()) { showApiLogin(() => navigateTo('call-analysis')); return; }
  el.innerHTML = `<div class="page-header"><h1>MM call analysis</h1><p>53 recordings across 31 deals. Select a deal to analyze calls against the MM sales process.</p></div><div id="ca-loading" class="callout info">Loading MM recordings from Claap...</div><div id="ca-content"></div>`;

  apiFetch('/api/mm/calls').then(r=>{if(r.status===401){showApiLogin(()=>navigateTo('call-analysis'));return {error:'auth'};}return r.json();}).then(data => {
  if(data.error==='auth')return;
    if (data.error) { document.getElementById('ca-loading').innerHTML = '<span class="badge red">Error: '+data.error+'</span>'; return; }

    const statsHtml = `<div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-box"><div class="sv" style="color:var(--purple3)">${data.totalRecordings}</div><div class="sl">Recordings</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--green)">${data.totalDeals}</div><div class="sl">Deals</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--blue)">${Math.round(data.totalMinutes/60)}h</div><div class="sl">Total hours</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--orange)">${data.aes?.length||0}</div><div class="sl">AEs involved</div></div>
    </div>`;

    const dealsHtml = data.deals.map(d => {
      const recList = d.recordings.map(r => {
        const date = new Date(r.created_at).toISOString().split('T')[0];
        const dur = Math.round((r.duration_seconds||0)/60);
        return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border-light)">
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600;color:var(--blackish)">${r.title}</div>
            <div style="font-size:12px;color:var(--text-light)">${date} · ${dur}min · ${r.recorder_name||''}</div>
          </div>
          <a href="${r.url}" target="_blank" style="font-size:12px;color:var(--purple3);font-weight:600;text-decoration:none;padding:6px 12px;border:1px solid var(--border);border-radius:6px">Open in Claap</a>
          <button onclick="analyzeMMCall('${r.id}')" style="font-size:12px;color:white;font-weight:600;padding:6px 12px;background:var(--purple3);border:none;border-radius:6px;cursor:pointer;font-family:'Archivo',sans-serif">Analyze</button>
        </div>`;
      }).join('');

      return `<div class="card" style="margin-bottom:12px">
        <h3 style="display:flex;align-items:center;gap:8px">${d.deal} <span class="badge purple">${d.recordings.length} call${d.recordings.length>1?'s':''}</span> <span class="badge blue">${d.totalMinutes}min</span></h3>
        <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">AEs: ${d.aes.join(', ')}</div>
        ${recList}
      </div>`;
    }).join('');

    document.getElementById('ca-loading').style.display = 'none';
    document.getElementById('ca-content').innerHTML = statsHtml + dealsHtml;
  }).catch(err => {
    document.getElementById('ca-loading').innerHTML = '<span class="badge red">Failed to load: '+err.message+'</span>';
  });
};

window.analyzeMMCall = function(recordingId) {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = 'Analyzing...';
  btn.style.background = 'var(--orange)';

  apiFetch('/api/mm/analyze-call', {
    method: 'POST',
    body: JSON.stringify({ recordingId })
  }).then(r=>r.json()).then(data => {
    if (data.error) { alert('Error: '+data.error); btn.disabled=false; btn.textContent='Analyze'; btn.style.background='var(--purple3)'; return; }
    // Show analysis in a modal-like overlay
    showCallAnalysis(data);
    btn.disabled = false;
    btn.textContent = 'Re-analyze';
    btn.style.background = 'var(--green)';
  }).catch(err => {
    alert('Analysis failed: '+err.message);
    btn.disabled = false;
    btn.textContent = 'Analyze';
    btn.style.background = 'var(--purple3)';
  });
};

function showCallAnalysis(data) {
  const a = data.analysis;
  const r = data.recording;
  const date = new Date(r.created_at).toISOString().split('T')[0];
  const dur = Math.round((r.duration_seconds||0)/60);

  const el = document.getElementById('ca-content');
  const existingCards = el.innerHTML;

  const complianceColor = (a.processCompliance?.score||0) >= 70 ? 'green' : (a.processCompliance?.score||0) >= 40 ? 'orange' : 'red';
  const discoveryColor = (a.discoveryDepth?.score||0) >= 70 ? 'green' : (a.discoveryDepth?.score||0) >= 40 ? 'orange' : 'red';

  const analysisHtml = `<div class="card" style="border:2px solid var(--purple3);margin-bottom:24px" id="analysis-result">
    <h3 style="font-size:18px">${r.title} — Analysis</h3>
    <div style="font-size:13px;color:var(--text-light);margin-bottom:16px">${date} · ${dur}min · ${r.recorder_name} · Deal: ${r.deal_name}</div>

    <div style="padding:14px 18px;background:var(--light-bg);border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.7;color:var(--blackish)">${a.overallAssessment||'No assessment available.'}</div>

    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">
      <div class="stat-box"><div class="sv" style="color:var(--purple3)">Stage ${a.stageDetected||'?'}</div><div class="sl">${a.stageConfidence||''} confidence</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--${complianceColor})">${a.processCompliance?.score||0}</div><div class="sl">Process compliance</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--${discoveryColor})">${a.discoveryDepth?.score||0}</div><div class="sl">Discovery depth</div></div>
      <div class="stat-box"><div class="sv" style="color:${(a.multiThreading?.stakeholdersMentioned||[]).length>=2?'var(--green)':'var(--orange)'}">${(a.multiThreading?.stakeholdersMentioned||[]).length}</div><div class="sl">Stakeholders</div></div>
    </div>

    <div class="grid-2">
      <div class="card" style="margin-bottom:0">
        <h3 style="color:var(--green)">Process followed</h3>
        <ul style="font-size:13px;line-height:2;list-style:none">${(a.processCompliance?.followed||[]).map(f=>'<li>→ '+f+'</li>').join('')||'<li style="color:var(--text-light)">None detected</li>'}</ul>
      </div>
      <div class="card" style="margin-bottom:0">
        <h3 style="color:var(--red)">Process missed</h3>
        <ul style="font-size:13px;line-height:2;list-style:none">${(a.processCompliance?.missed||[]).map(m=>'<li>✕ '+m+'</li>').join('')||'<li style="color:var(--text-light)">None detected</li>'}</ul>
        ${(a.processCompliance?.violations||[]).length ? '<div class="callout danger" style="margin-top:8px"><strong>Violations:</strong> '+(a.processCompliance.violations||[]).join(', ')+'</div>' : ''}
      </div>
    </div>

    <div class="card" style="margin-top:12px">
      <h3>Narrative delivery</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px">
        <span class="badge ${a.narrativeDelivery?.marketShiftLanded?'green':'red'}">${a.narrativeDelivery?.marketShiftLanded?'✓':'✕'} Market shift</span>
        <span class="badge ${a.narrativeDelivery?.threeChannelExplained?'green':'red'}">${a.narrativeDelivery?.threeChannelExplained?'✓':'✕'} Three channels</span>
        <span class="badge ${a.narrativeDelivery?.ceilingValidated?'green':'red'}">${a.narrativeDelivery?.ceilingValidated?'✓':'✕'} Ceiling validated</span>
        <span class="badge ${a.narrativeDelivery?.managedServicePositioned?'green':'red'}">${a.narrativeDelivery?.managedServicePositioned?'✓':'✕'} Managed service</span>
      </div>
      ${a.narrativeDelivery?.notes ? '<p style="margin-top:8px;font-size:13px;color:var(--text)">'+a.narrativeDelivery.notes+'</p>' : ''}
    </div>

    ${(a.learnings||[]).length ? `<div class="card" style="margin-top:12px">
      <h3>Learnings extracted</h3>
      ${(a.learnings||[]).map(l => `<div style="padding:12px 16px;border-left:3px solid var(--purple3);background:var(--light-bg);border-radius:0 8px 8px 0;margin:8px 0">
        <div style="display:flex;gap:8px;margin-bottom:4px"><span class="badge purple">${l.category}</span><span class="badge ${l.confidenceImpact==='Validates current approach'?'green':l.confidenceImpact==='Challenges current approach'?'red':'blue'}">${l.confidenceImpact}</span></div>
        <div style="font-size:14px;color:var(--blackish);font-weight:500">${l.insight}</div>
        <div style="font-size:12px;color:var(--text);margin-top:4px;font-style:italic">"${l.evidence}"</div>
      </div>`).join('')}
    </div>` : ''}

    ${(a.keyMoments||[]).length ? `<div class="card" style="margin-top:12px">
      <h3>Key moments</h3>
      ${(a.keyMoments||[]).map(m => `<div style="padding:10px 14px;border-bottom:1px solid var(--border-light);display:flex;gap:12px">
        <span class="badge ${m.type==='strength'?'green':m.type==='breakthrough'?'purple':m.type==='objection'?'orange':'red'}">${m.type}</span>
        <div style="flex:1"><div style="font-size:13px;color:var(--blackish)">${m.description}</div>
        <div style="font-size:12px;color:var(--text);margin-top:2px">${m.recommendation}</div></div>
      </div>`).join('')}
    </div>` : ''}

    ${(a.actionItems||[]).length ? `<div class="callout info" style="margin-top:12px"><strong>Action items:</strong><ul style="margin-top:4px;padding-left:16px">${(a.actionItems||[]).map(i=>'<li>'+i+'</li>').join('')}</ul></div>` : ''}
  </div>`;

  el.innerHTML = analysisHtml + existingCards;
  document.getElementById('analysis-result')?.scrollIntoView({ behavior: 'smooth' });
}

// ── CALL LEARNINGS PAGE ──
PAGE_RENDERERS['call-learnings'] = (el) => {
  if (!isApiAuthenticated()) { showApiLogin(() => navigateTo('call-learnings')); return; }
  el.innerHTML = `<div class="page-header"><h1>MM call learnings</h1><p>Aggregated learnings from AI analysis of MM deal calls. Analyze calls first in the Call Analysis section.</p></div><div id="cl-loading" class="callout info">Loading analyzed calls...</div><div id="cl-content"></div>`;

  apiFetch('/api/mm/analyses').then(r=>{if(r.status===401){showApiLogin(()=>navigateTo('call-learnings'));return {error:'auth'};}return r.json();}).then(data => {
  if(data.error==='auth')return;
    document.getElementById('cl-loading').style.display = 'none';
    const content = document.getElementById('cl-content');

    if (!data.totalLearnings) {
      content.innerHTML = `<div class="callout warn"><strong>No learnings yet.</strong> Go to Call Analysis, select MM recordings, and click "Analyze" to extract learnings from call transcripts.</div>
      <button class="qa-btn" onclick="navigateTo('call-analysis')"><span class="qa-icon">&#9835;</span> Go to call analysis</button>`;
      return;
    }

    const statsHtml = `<div class="stat-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px">
      <div class="stat-box"><div class="sv" style="color:var(--purple3)">${data.totalLearnings}</div><div class="sl">Total learnings</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--green)">${data.totalCalls}</div><div class="sl">Calls analyzed</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--blue)">${Object.keys(data.learningsByCategory||{}).length}</div><div class="sl">Categories</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--orange)">${data.learnings.filter(l=>l.confidenceImpact==='Challenges current approach').length}</div><div class="sl">Challenges</div></div>
    </div>`;

    // Category filter
    const cats = Object.entries(data.learningsByCategory||{}).sort((a,b)=>b[1]-a[1]);
    const filterHtml = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <button class="qa-btn cl-filter active" data-cat="all" onclick="filterLearnings('all',this)" style="font-size:12px;padding:6px 14px">All (${data.totalLearnings})</button>
      ${cats.map(([cat,count])=>`<button class="qa-btn cl-filter" data-cat="${cat}" onclick="filterLearnings('${cat}',this)" style="font-size:12px;padding:6px 14px">${cat} (${count})</button>`).join('')}
    </div>`;

    // All learnings
    const learningsHtml = data.learnings.map((l,i) => {
      const date = l.callDate ? new Date(l.callDate).toISOString().split('T')[0] : '';
      const impactColor = l.confidenceImpact === 'Validates current approach' ? 'green' : l.confidenceImpact === 'Challenges current approach' ? 'red' : l.confidenceImpact === 'New insight' ? 'purple' : 'blue';
      return `<div class="cl-item" data-cat="${l.category}" style="padding:14px 18px;border-left:3px solid var(--purple3);background:var(--light-bg);border-radius:0 8px 8px 0;margin:8px 0">
        <div style="display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap">
          <span class="badge purple">${l.category}</span>
          <span class="badge ${impactColor}">${l.confidenceImpact}</span>
          <span style="font-size:11px;color:var(--text-light)">${l.dealName||''} · ${l.recorderName||''} · ${date}</span>
        </div>
        <div style="font-size:14px;color:var(--blackish);font-weight:600;line-height:1.5">${l.insight}</div>
        <div style="font-size:13px;color:var(--text);margin-top:4px;font-style:italic">"${l.evidence}"</div>
      </div>`;
    }).join('');

    // Patterns summary — group learnings that point the same direction
    const validates = data.learnings.filter(l => l.confidenceImpact === 'Validates current approach');
    const challenges = data.learnings.filter(l => l.confidenceImpact === 'Challenges current approach');
    const newInsights = data.learnings.filter(l => l.confidenceImpact === 'New insight');

    const patternsHtml = `<div class="grid-2" style="margin-bottom:20px">
      <div class="card" style="border-left:3px solid var(--green)">
        <h3 style="color:var(--green)">Validating (${validates.length})</h3>
        <p style="font-size:13px;color:var(--text);margin-bottom:8px">These learnings confirm our current approach is working.</p>
        ${validates.slice(0,5).map(l=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border-light)">→ ${l.insight} <span style="color:var(--text-light);font-size:11px">(${l.category})</span></div>`).join('')||'<div style="color:var(--text-light);font-size:13px">No validating signals yet.</div>'}
      </div>
      <div class="card" style="border-left:3px solid var(--red)">
        <h3 style="color:var(--red)">Challenging (${challenges.length})</h3>
        <p style="font-size:13px;color:var(--text);margin-bottom:8px">These learnings suggest we need to adjust.</p>
        ${challenges.slice(0,5).map(l=>`<div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border-light)">✕ ${l.insight} <span style="color:var(--text-light);font-size:11px">(${l.category})</span></div>`).join('')||'<div style="color:var(--text-light);font-size:13px">No challenging signals yet.</div>'}
      </div>
    </div>`;

    content.innerHTML = statsHtml + patternsHtml + filterHtml + '<div id="cl-list">' + learningsHtml + '</div>';
  }).catch(err => {
    document.getElementById('cl-loading').innerHTML = '<span class="badge red">Failed: '+err.message+'</span>';
  });
};

window.filterLearnings = function(cat, btn) {
  document.querySelectorAll('.cl-filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.cl-item').forEach(item => {
    item.style.display = (cat === 'all' || item.dataset.cat === cat) ? '' : 'none';
  });
};

// ── KEYBOARD ──
document.addEventListener('keydown',(e)=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}
  if(e.key==='Escape'){document.getElementById('searchResults').classList.remove('show');document.getElementById('searchInput').blur();}
});

// ── INIT ──
const savedRole=LS.get('ROLE');
if(savedRole)currentRole=savedRole;
document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===currentRole));
renderSidebar();
navigateTo('dashboard');
</script>
</body>

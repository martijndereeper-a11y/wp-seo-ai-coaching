<style>
:root {
  --white: #FFFFFF;
  --light-bg: #E9EEFA;
  --navy: #0f042c;
  --blackish: #16151A;
  --text: #615567;
  --text-light: rgba(97,85,103,.55);
  --purple-soft: #BEB5FF;
  --purple3: #B748FF;
  --purple2: #DA6BFF;
  --pink: #FF5FC2;
  --blue: #7B9FFF;
  --yellow: #FFDD68;
  --green: #2CB67D;
  --red: #E5484D;
  --orange: #F5A623;
  --border: #E0DFE6;
  --border-light: #EEEDF2;
  --sidebar-w: 272px;
  --max-w: 960px;
  --radius: 12px;
  --radius-sm: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Archivo',sans-serif; background:var(--white); color:var(--text); overflow:hidden; height:100vh; font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
a { color:var(--purple3); text-decoration:none; }
a:hover { text-decoration:underline; }
::selection { background:var(--purple-soft); color:var(--blackish); }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--purple-soft); }

/* ── LAYOUT ── */
.app { display:flex; height:100vh; }
.sidebar { width:var(--sidebar-w); background:var(--navy); display:flex; flex-direction:column; flex-shrink:0; overflow:hidden; }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--light-bg); }
.topbar { background:var(--white); border-bottom:1px solid var(--border); padding:14px 32px; display:flex; align-items:center; gap:16px; flex-shrink:0; }
.content { flex:1; overflow-y:auto; padding:32px; }
.content-inner { max-width:var(--max-w); margin:0 auto; }

/* ── SIDEBAR ── */
.sb-header { padding:24px 24px 20px; border-bottom:1px solid rgba(255,255,255,.08); }
.sb-logo { height:24px; opacity:.95; }
.sb-title { font-size:12px; color:rgba(255,255,255,.45); margin-top:10px; text-transform:uppercase; letter-spacing:1.5px; font-weight:600; }
.sb-nav { flex:1; overflow-y:auto; padding:16px 0; }
.sb-section { padding:0 12px; margin-bottom:4px; }
.sb-section-title { font-size:10px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,.3); padding:12px 12px 6px; font-weight:700; }
.sb-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:var(--radius-sm); cursor:pointer; font-size:13px; color:rgba(255,255,255,.55); transition:all .15s; user-select:none; font-weight:500; }
.sb-item:hover { background:rgba(255,255,255,.06); color:rgba(255,255,255,.85); }
.sb-item.active { background:rgba(183,72,255,.2); color:#fff; }
.sb-item .sb-icon { width:20px; text-align:center; font-size:15px; flex-shrink:0; opacity:.7; }
.sb-item.active .sb-icon { opacity:1; }
.sb-item .sb-label { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sb-footer { padding:16px; border-top:1px solid rgba(255,255,255,.08); }

/* ── ROLE SELECTOR ── */
.role-selector { display:flex; background:rgba(255,255,255,.06); border-radius:var(--radius-sm); overflow:hidden; }
.role-btn { flex:1; padding:8px 0; font-size:11px; font-weight:700; background:none; border:none; color:rgba(255,255,255,.4); cursor:pointer; transition:all .15s; text-align:center; text-transform:uppercase; letter-spacing:.5px; }
.role-btn.active { background:var(--purple3); color:white; }
.role-btn:hover:not(.active) { color:rgba(255,255,255,.7); }

/* ── TOPBAR ── */
.topbar .breadcrumb { font-size:13px; color:var(--text-light); font-weight:500; }
.topbar .breadcrumb span { color:var(--blackish); font-weight:600; }
.search-box { margin-left:auto; position:relative; }
.search-box input { padding:8px 14px 8px 34px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--light-bg); color:var(--blackish); font-size:13px; width:240px; outline:none; transition:all .2s; font-family:'Archivo',sans-serif; }
.search-box input:focus { border-color:var(--purple3); width:320px; background:var(--white); box-shadow:0 0 0 3px rgba(183,72,255,.1); }
.search-box input::placeholder { color:var(--text-light); }
.search-box .search-icon { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:14px; }
.search-results { position:absolute; top:calc(100% + 6px); right:0; width:420px; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); max-height:420px; overflow-y:auto; z-index:200; display:none; box-shadow:0 12px 40px rgba(11,31,59,.12); }
.search-results.show { display:block; }
.sr-item { padding:12px 16px; cursor:pointer; border-bottom:1px solid var(--border-light); transition:background .1s; }
.sr-item:hover { background:var(--light-bg); }
.sr-item:last-child { border:none; }
.sr-item .sr-title { font-size:14px; font-weight:600; color:var(--blackish); }
.sr-item .sr-context { font-size:12px; color:var(--text); margin-top:2px; }
.sr-item .sr-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:4px; background:rgba(183,72,255,.08); color:var(--purple3); margin-top:4px; font-weight:600; }

/* ── PAGE HEADER ── */
.page-header { margin-bottom:28px; }
.page-header h1 { font-size:28px; font-weight:800; color:var(--blackish); margin-bottom:6px; line-height:1.2; }
.page-header p { font-size:15px; color:var(--text); max-width:640px; }

/* ── CARD ── */
.card { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:24px; margin-bottom:16px; transition:box-shadow .15s; }
.card:hover { box-shadow:0 2px 12px rgba(11,31,59,.04); }
.card h3 { font-size:16px; font-weight:700; color:var(--blackish); margin-bottom:10px; display:flex; align-items:center; gap:8px; line-height:1.3; }
.card p { font-size:14px; color:var(--text); line-height:1.7; }

/* ── STAT GRID ── */
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
.stat-box { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:20px; text-align:center; }
.stat-box .sv { font-size:32px; font-weight:800; color:var(--blackish); }
.stat-box .sl { font-size:12px; color:var(--text-light); margin-top:4px; font-weight:500; }
.stat-box.purple .sv { color:var(--purple3); }
.stat-box.green .sv { color:var(--green); }
.stat-box.orange .sv { color:var(--orange); }
.stat-box.blue .sv { color:var(--blue); }

/* ── GRIDS ── */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
@media(max-width:1100px) { .grid-2,.grid-3 { grid-template-columns:1fr; } }

/* ── PIPELINE ── */
.pipeline { display:flex; gap:3px; margin:16px 0; }
.pipe-stage { flex:1; padding:14px 8px; background:var(--light-bg); text-align:center; cursor:pointer; transition:all .15s; border-radius:var(--radius-sm); position:relative; }
.pipe-stage:hover { background:rgba(183,72,255,.06); }
.pipe-stage.active { background:rgba(183,72,255,.1); outline:2px solid var(--purple3); outline-offset:-2px; }
.pipe-stage .ps-num { font-size:10px; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; font-weight:700; }
.pipe-stage .ps-name { font-size:11px; font-weight:600; color:var(--blackish); margin-top:3px; }
.pipe-stage .ps-arrow { position:absolute; right:-7px; top:50%; transform:translateY(-50%); color:var(--text-light); z-index:2; font-size:13px; }

/* ── CHECKLIST ── */
.checklist { list-style:none; }
.checklist li { padding:10px 14px; font-size:14px; display:flex; align-items:flex-start; gap:10px; border-bottom:1px solid var(--border-light); color:var(--blackish); }
.checklist li:last-child { border:none; }
.checklist .cl-icon { flex-shrink:0; width:20px; height:20px; border-radius:5px; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:10px; margin-top:2px; font-weight:700; }
.checklist .cl-icon.required { border-color:var(--purple3); color:var(--purple3); background:rgba(183,72,255,.06); }
.checklist .cl-icon.done { border-color:var(--green); background:rgba(44,182,125,.1); color:var(--green); }

/* ── TEMPLATE BOX ── */
.template-box { background:var(--light-bg); border-radius:var(--radius-sm); padding:20px; margin:12px 0; font-family:'SF Mono',SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; line-height:1.9; color:var(--text); white-space:pre-wrap; border-left:3px solid var(--purple3); position:relative; }
.template-box .copy-btn { position:absolute; top:10px; right:10px; background:var(--white); border:1px solid var(--border); color:var(--purple3); padding:5px 14px; border-radius:6px; font-size:11px; cursor:pointer; font-weight:600; font-family:'Archivo',sans-serif; transition:all .15s; }
.template-box .copy-btn:hover { background:var(--purple3); color:white; border-color:var(--purple3); }

/* ── TABLE ── */
.os-table { width:100%; border-collapse:collapse; font-size:14px; }
.os-table th { text-align:left; padding:12px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-light); border-bottom:2px solid var(--border); font-weight:700; }
.os-table td { padding:12px 14px; border-bottom:1px solid var(--border-light); vertical-align:top; color:var(--blackish); }
.os-table tr:hover { background:var(--light-bg); }

/* ── BADGES ── */
.badge { display:inline-block; padding:3px 10px; border-radius:5px; font-size:11px; font-weight:700; letter-spacing:.3px; }
.badge.green { background:rgba(44,182,125,.1); color:var(--green); }
.badge.orange { background:rgba(245,166,35,.1); color:var(--orange); }
.badge.red { background:rgba(229,72,77,.1); color:var(--red); }
.badge.purple { background:rgba(183,72,255,.1); color:var(--purple3); }
.badge.blue { background:rgba(123,159,255,.1); color:var(--blue); }
.badge.navy { background:rgba(11,31,59,.08); color:var(--navy); }

/* ── CALLOUT ── */
.callout { padding:16px 20px; border-radius:var(--radius-sm); margin:14px 0; font-size:14px; line-height:1.7; }
.callout strong { color:var(--blackish); }
.callout.warn { background:rgba(245,166,35,.06); border:1px solid rgba(245,166,35,.15); color:#8C6D1F; }
.callout.info { background:rgba(123,159,255,.06); border:1px solid rgba(123,159,255,.15); color:#4A6FA5; }
.callout.success { background:rgba(44,182,125,.06); border:1px solid rgba(44,182,125,.15); color:#1B7A52; }
.callout.danger { background:rgba(229,72,77,.06); border:1px solid rgba(229,72,77,.15); color:#C53030; }

/* ── ACCORDION ── */
.accordion { border:1px solid var(--border-light); border-radius:var(--radius); overflow:hidden; margin:14px 0; }
.acc-item { border-bottom:1px solid var(--border-light); }
.acc-item:last-child { border:none; }
.acc-header { padding:14px 18px; cursor:pointer; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; color:var(--blackish); transition:background .1s; user-select:none; }
.acc-header:hover { background:var(--light-bg); }
.acc-header .acc-arrow { color:var(--purple3); transition:transform .2s; font-size:12px; }
.acc-header.open .acc-arrow { transform:rotate(90deg); }
.acc-body { padding:0 18px 16px; font-size:14px; color:var(--text); line-height:1.7; display:none; }
.acc-body.open { display:block; }

/* ── DO/DON'T ── */
.do-dont { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:14px 0; }
.do-col { padding:20px; border-radius:var(--radius); }
.do-col.do { background:rgba(44,182,125,.04); border:1px solid rgba(44,182,125,.15); }
.do-col.dont { background:rgba(229,72,77,.04); border:1px solid rgba(229,72,77,.15); }
.do-col h4 { font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; font-weight:800; }
.do-col.do h4 { color:var(--green); }
.do-col.dont h4 { color:var(--red); }
.do-col ul { list-style:none; font-size:14px; line-height:2; }
.do-col.do ul li::before { content:"→ "; color:var(--green); font-weight:700; }
.do-col.dont ul li::before { content:"✕ "; color:var(--red); font-weight:700; }

/* ── TIER CARDS ── */
.tier-cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:20px 0; }
.tier-card { background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius); padding:28px 24px; text-align:center; transition:all .2s; position:relative; }
.tier-card:hover { transform:translateY(-3px); box-shadow:0 8px 24px rgba(11,31,59,.08); }
.tier-card.featured { border-color:var(--purple3); box-shadow:0 0 0 1px var(--purple3); }
.tier-card .tier-label { font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--text-light); font-weight:700; }
.tier-card .tier-price { font-size:36px; font-weight:800; margin:10px 0; color:var(--blackish); }
.tier-card .tier-price span { font-size:14px; font-weight:500; color:var(--text-light); }
.tier-card .tier-term { font-size:13px; color:var(--text-light); margin-bottom:20px; }
.tier-card .tier-features { text-align:left; font-size:13px; line-height:2.2; }
.tier-card .tier-features li { list-style:none; color:var(--text); }
.tier-card .tier-features li::before { content:"→ "; color:var(--purple3); font-weight:700; }
.tier-card .rec-badge { position:absolute; top:-11px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--purple2),var(--blue)); color:white; padding:4px 16px; border-radius:20px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.8px; }

/* ── SCALE/KILL GRID ── */
.sk-grid { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:0; border:1px solid var(--border-light); border-radius:var(--radius-sm); overflow:hidden; margin:14px 0; font-size:13px; }
.sk-grid .sk-header { background:var(--light-bg); padding:10px 14px; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.8px; border-bottom:1px solid var(--border); color:var(--text-light); }
.sk-grid .sk-cell { padding:10px 14px; border-bottom:1px solid var(--border-light); border-right:1px solid var(--border-light); color:var(--blackish); }
.sk-grid .sk-cell:nth-child(4n) { border-right:none; }
.sk-grid .sk-cell.scale { background:rgba(44,182,125,.03); }
.sk-grid .sk-cell.continue { background:rgba(245,166,35,.03); }
.sk-grid .sk-cell.kill { background:rgba(229,72,77,.03); }

/* ── QUICK ACTIONS ── */
.quick-actions { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0; }
.qa-btn { padding:10px 18px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--white); color:var(--blackish); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; display:flex; align-items:center; gap:8px; font-family:'Archivo',sans-serif; }
.qa-btn:hover { border-color:var(--purple3); color:var(--purple3); box-shadow:0 2px 8px rgba(183,72,255,.08); }
.qa-btn .qa-icon { font-size:15px; color:var(--purple3); }

/* ── ROLE HINTS ── */
.role-hint { display:inline-flex; align-items:center; gap:4px; padding:2px 10px; border-radius:4px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.role-hint.bdr { background:rgba(123,159,255,.1); color:var(--blue); }
.role-hint.ae { background:rgba(183,72,255,.08); color:var(--purple3); }
.role-hint.lead { background:rgba(255,95,194,.08); color:var(--pink); }

/* ── PROGRESS TRACK ── */
.progress-track { display:flex; align-items:center; gap:0; margin:20px 0; }
.pt-step { flex:1; text-align:center; padding:8px 4px; }
.pt-step .pt-dot { width:32px; height:32px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:12px; font-weight:800; background:var(--white); }
.pt-step.done .pt-dot { background:var(--green); border-color:var(--green); color:white; }
.pt-step.current .pt-dot { background:var(--purple3); border-color:var(--purple3); color:white; }
.pt-step .pt-label { font-size:11px; color:var(--text-light); font-weight:600; }
.pt-step.done .pt-label { color:var(--green); }
.pt-step.current .pt-label { color:var(--purple3); }
.pt-line { flex:0 0 40px; height:2px; background:var(--border); }
.pt-line.done { background:var(--green); }

/* ── TOAST ── */
.toast { position:fixed; bottom:24px; right:24px; background:var(--navy); color:white; padding:12px 24px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; z-index:999; transform:translateY(80px); opacity:0; transition:all .3s; box-shadow:0 8px 24px rgba(11,31,59,.2); }
.toast.show { transform:translateY(0); opacity:1; }

/* ── HERO SECTION (dashboard) ── */
.hero { background:var(--navy); border-radius:var(--radius); padding:36px 32px; margin-bottom:24px; color:white; position:relative; overflow:hidden; }
.hero::after { content:''; position:absolute; top:-50%; right:-10%; width:400px; height:400px; background:radial-gradient(circle,rgba(183,72,255,.15),transparent 70%); pointer-events:none; }
.hero h1 { font-size:26px; font-weight:800; margin-bottom:6px; position:relative; z-index:1; }
.hero p { font-size:14px; color:rgba(255,255,255,.6); max-width:520px; position:relative; z-index:1; }

/* ── PROCESS COLORS ── */
.process-pink { color:var(--pink); }
.process-purple { color:var(--purple-soft); }
.process-purple2 { color:var(--purple2); }
.process-blue { color:var(--blue); }
.process-yellow { color:var(--yellow); }

/* ── SCENARIO PLANNER ── */
.fin-table { width:100%; border-collapse:collapse; font-size:13px; }
.fin-table th { padding:8px 6px; font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--text-light); border-bottom:2px solid var(--border); font-weight:700; text-align:right; }
.fin-table th:first-child { text-align:left; }
.fin-table td { padding:6px; border-bottom:1px solid var(--border-light); text-align:right; font-variant-numeric:tabular-nums; }
.fin-table td:first-child { text-align:left; font-weight:600; color:var(--blackish); }
.fin-table tr.total-row { background:var(--light-bg); font-weight:700; }
.fin-table tr.total-row td { border-top:2px solid var(--border); color:var(--blackish); }
.fin-table input[type="number"] { width:68px; padding:4px 6px; border:1px solid var(--border); border-radius:4px; font-size:13px; font-family:'Archivo',sans-serif; text-align:right; background:rgba(255,242,204,.4); color:var(--blackish); font-variant-numeric:tabular-nums; }
.fin-table input[type="number"]:focus { outline:none; border-color:var(--purple3); background:rgba(183,72,255,.04); }
.fin-total { font-size:36px; font-weight:800; color:var(--blackish); }
.fin-total.on-track { color:var(--green); }
.fin-total.behind { color:var(--red); }
.progress-bar-wrap { background:var(--light-bg); border-radius:6px; height:14px; overflow:hidden; margin:8px 0; border:1px solid var(--border-light); }
.progress-bar-fill { height:100%; border-radius:5px; transition:width .3s; background:linear-gradient(90deg,var(--purple3),var(--blue)); }
.scenario-kpi { display:flex; gap:16px; margin:16px 0; }
.scenario-kpi .kpi { flex:1; background:var(--white); border:1px solid var(--border-light); border-radius:var(--radius-sm); padding:16px; text-align:center; }
.scenario-kpi .kpi .kv { font-size:24px; font-weight:800; }
.scenario-kpi .kpi .kl { font-size:11px; color:var(--text-light); margin-top:2px; }

/* ── DEAL SCORECARD ── */
.score-ring { width:120px; height:120px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; margin:0 auto 12px; border:6px solid var(--border); }
.score-ring.green { border-color:var(--green); }
.score-ring.orange { border-color:var(--orange); }
.score-ring.red { border-color:var(--red); }
.score-ring .sr-num { font-size:36px; font-weight:800; }
.score-ring .sr-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
.deal-check { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border-light); cursor:pointer; transition:background .1s; }
.deal-check:hover { background:var(--light-bg); }
.deal-check:last-child { border:none; }
.deal-check input[type="checkbox"] { width:18px; height:18px; accent-color:var(--purple3); cursor:pointer; }
.deal-check .dc-label { flex:1; font-size:14px; color:var(--blackish); }
.deal-check .dc-weight { font-size:12px; font-weight:700; color:var(--text-light); min-width:40px; text-align:right; }
.deal-check .dc-cat { font-size:10px; padding:2px 8px; border-radius:4px; background:rgba(183,72,255,.06); color:var(--purple3); font-weight:600; }
.deal-list-item { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border-light); cursor:pointer; transition:background .1s; }
.deal-list-item:hover { background:var(--light-bg); }
.deal-list-item .dli-score { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; color:white; flex-shrink:0; }
.deal-list-item .dli-score.green { background:var(--green); }
.deal-list-item .dli-score.orange { background:var(--orange); }
.deal-list-item .dli-score.red { background:var(--red); }
.deal-list-item .dli-info { flex:1; }
.deal-list-item .dli-name { font-weight:600; color:var(--blackish); font-size:14px; }
.deal-list-item .dli-meta { font-size:12px; color:var(--text-light); }
.deal-list-item .dli-del { color:var(--text-light); font-size:16px; padding:4px 8px; border-radius:4px; border:none; background:none; cursor:pointer; }
.deal-list-item .dli-del:hover { background:rgba(229,72,77,.08); color:var(--red); }

/* ── ROI CALCULATOR ── */
.roi-cols { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin:16px 0; }
.roi-col { padding:20px; border-radius:var(--radius); }
.roi-col.waste { background:rgba(229,72,77,.04); border:1px solid rgba(229,72,77,.12); }
.roi-col.cost { background:rgba(183,72,255,.04); border:1px solid rgba(183,72,255,.12); }
.roi-col.compound { background:rgba(44,182,125,.04); border:1px solid rgba(44,182,125,.12); }
.roi-col h4 { font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; font-weight:800; }
.roi-col.waste h4 { color:var(--red); }
.roi-col.cost h4 { color:var(--purple3); }
.roi-col.compound h4 { color:var(--green); }
.roi-row { display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; border-bottom:1px solid rgba(0,0,0,.04); font-size:14px; }
.roi-row:last-child { border:none; }
.roi-row .rr-label { color:var(--text); }
.roi-row .rr-value { font-weight:700; color:var(--blackish); font-variant-numeric:tabular-nums; }
.roi-summary { background:var(--navy); color:white; padding:20px 24px; border-radius:var(--radius); margin:16px 0; font-size:15px; line-height:1.7; }
.roi-summary strong { color:var(--purple-soft); }
.roi-input-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0; }
.roi-field { display:flex; flex-direction:column; gap:4px; }
.roi-field label { font-size:12px; font-weight:600; color:var(--text-light); text-transform:uppercase; letter-spacing:.5px; }
.roi-field input { padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'Archivo',sans-serif; color:var(--blackish); background:var(--white); }
.roi-field input:focus { outline:none; border-color:var(--purple3); box-shadow:0 0 0 3px rgba(183,72,255,.08); }

/* ── DISCOVERY ENGINE ── */
.disc-controls { display:flex; gap:12px; margin:16px 0; flex-wrap:wrap; }
.disc-controls select { padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px; font-family:'Archivo',sans-serif; color:var(--blackish); background:var(--white); min-width:180px; cursor:pointer; }
.disc-controls select:focus { outline:none; border-color:var(--purple3); }
.disc-question { padding:16px 20px; border-left:3px solid var(--purple3); background:var(--light-bg); border-radius:0 var(--radius-sm) var(--radius-sm) 0; margin:10px 0; }
.disc-question .dq-main { font-size:15px; color:var(--blackish); font-weight:500; line-height:1.6; }
.disc-question .dq-follow { font-size:13px; color:var(--text); margin-top:6px; font-style:italic; }
.disc-question .dq-tag { font-size:10px; font-weight:700; padding:2px 8px; border-radius:4px; background:rgba(183,72,255,.08); color:var(--purple3); margin-top:8px; display:inline-block; }

@media(max-width:900px) {
  .sidebar { display:none; }
  .stat-grid,.scenario-kpi { grid-template-columns:1fr 1fr; }
  .tier-cards,.do-dont,.grid-2,.grid-3,.roi-cols,.roi-input-grid { grid-template-columns:1fr; }
  .pipeline { flex-wrap:wrap; }
  .content { padding:16px; }
  .topbar { padding:12px 16px; }
}

// ── DATA ──
const OS = {
  stages: [
    {id:'s0',num:'0',name:'BDR Qualification',owner:'BDR',goal:'Protect AE time — only Green/near-Green accounts reach AEs.',artifacts:['Deal Hypothesis: ICP fit, trigger/pain signal, what to validate, one disqualifier'],exit:['Hypothesis logged in CRM','AE accepts or rejects within 24h'],kills:['Hypothesis incomplete — AE may reject'],multiThread:'N/A',tips:'Tell the prospect: "I\'m connecting you with [AE] who leads our strategic accounts. They\'ll spend the first call understanding your situation — no pitch, no demo."'},
    {id:'s1',num:'1',name:'Problem Framing',owner:'AE',goal:'Decide fast if this account deserves further investment. No demo. No pitch. No features.',artifacts:['Problem Statement — one paragraph, in buyer language exactly as they describe it'],exit:['Buyer agrees a structural problem exists','Buyer rejects "more content / better agency" as solution','AE restates problem in buyer language','At least one additional stakeholder role named'],kills:['Wants tactics immediately','Asks for rankings / guarantees','Frames us as a tool or agency','Curiosity without pain'],multiThread:'Ask: "Who else internally would immediately recognize this problem?"',tips:'This is a disqualification stage, not a pitch stage. Killing bad deals here is a success outcome.'},
    {id:'s2',num:'2',name:'Current State Deconstruction',owner:'AE',goal:'Expose waste, friction, and decision latency. Test where WP SEO AI wins unfairly.',artifacts:['Current State Map: owners, tools, bottlenecks, what happens to non-performing content, how decisions are made'],exit:['Buyer acknowledges content/effort waste','Buyer sees value in learning before scaling','Clear internal owner identified','Second stakeholder function identified','Validation Demo scheduled (or reason logged)'],kills:['No demo scheduled within 7 days → auto-park'],multiThread:'Ask: "This usually breaks between teams — who would challenge or validate this internally?"',tips:'Get the inputs for the business case here: content production volume, tooling costs, agency spend, performing content %.'},
    {id:'s25',num:'2.5',name:'Validation Demo',owner:'AE + Solutioning',goal:'Create internal belief. This is a validation gate, not a sales demo.',artifacts:['Demo Recap (shareable): problem recap, what was validated, open questions, next steps','Stakeholder Map v1'],exit:['Buyer states this is different from current approach','WP SEO AI understood as a system, not a tool','Internal champion identified + their internal job defined','Buyer comfortable involving additional stakeholders'],kills:['CCs, recordings, or "they\'ll watch later" do NOT count as stakeholder engagement'],multiThread:'At least one new stakeholder attends live OR is explicitly committed to next step.',tips:'Required attendees: original buyer + at least one operational/technical stakeholder. From WP SEO AI: AE + one expert (Product/CS/SEO), not sales.'},
    {id:'s3',num:'3',name:'Economic Framing',owner:'AE',goal:'Decide whether a proposal is worth producing at all.',artifacts:['Decision Map: who decides, who blocks, who influences, decision date, evaluation criteria'],exit:['Buyer articulates value in business terms','Decision plan has names and dates','Economic buyer identified or meeting booked','WP SEO AI positioned as performance infrastructure'],kills:['No proposal without a completed Decision Map'],multiThread:'Minimum 3 stakeholder functions identified. Economic buyer identified or access path defined.',tips:'Translate waste into business impact. Frame cost of inaction. This is where the TRG business case format gets built.'},
    {id:'s4',num:'4',name:'Proposal & Commitment',owner:'AE',goal:'Confirm commitment — not explain slides.',artifacts:['Mutual Action Plan: steps, owners, dates, attached to proposal'],exit:['Decision date agreed','Procurement/legal path acknowledged','Final decision meeting scheduled with right people'],kills:['Never send proposal without Decision Map'],multiThread:'All decision-makers engaged.',tips:'Ask for commitment early: "If this reflects what we agreed, are you comfortable moving forward?" Surface objections explicitly.'},
    {id:'s5',num:'5',name:'Close or Clean Loss',owner:'AE',goal:'Close cleanly or learn cleanly. No zombie deals.',artifacts:['Win/Loss Postmortem: 5 bullets — required before deal is marked closed'],exit:['Deal marked closed-won or closed-lost with complete postmortem'],kills:['Incomplete postmortem — deal cannot be marked closed'],multiThread:'N/A',tips:'Closed-won → document why we won. Closed-lost → document where it broke. Both feed the Learning System.'}
  ],
  offers: [
    {tier:'Small — Pilot',price:'€15K',priceNote:'6-month term',term:'6 months',scope:'1 domain, 1-2 markets, SEO+GEO',volume:'40-60 articles/month (GSC-scoped clusters)',kpis:'Unbranded visibility + LLM citations',reporting:'Monthly check-ins',conversion:'→ Medium at month 4 review',featured:false},
    {tier:'Medium',price:'€50K',priceNote:'ARR',term:'12 months',scope:'1-3 domains, 2-3 markets, SEO+GEO+SEA',volume:'Full authority build',kpis:'Above + traffic + SEA CPC reduction',reporting:'Monthly + quarterly business review',conversion:'→ Large at annual review',featured:true},
    {tier:'Large',price:'€100K',priceNote:'ARR',term:'12-24 months',scope:'Multi-domain, multi-market, full stack',volume:'Enterprise authority program',kpis:'Above + revenue attribution',reporting:'Monthly + QBR + exec sponsor review',conversion:'→ Multi-year at renewal',featured:false}

  scaleKill: [
    {signal:'Organic clicks from pilot content',scale:'>2,000/mo',cont:'500–2,000/mo with upward trend',kill:'<500/mo, flat or declining'},
    {signal:'Unbranded keywords in top 10',scale:'>10,000',cont:'3,000–10,000 with growth',kill:'<3,000, no growth'},
    {signal:'AI search citations',scale:'Present on 2+ platforms',cont:'Present on 1 platform',kill:'No measurable presence'},
    {signal:'Content indexation rate',scale:'>80% indexed within 30d',cont:'50–80% indexed',kill:'<50% indexed'},
    {signal:'Stakeholder engagement',scale:'Champion + exec sponsor engaged',cont:'Champion engaged, no exec yet',kill:'Champion disengaged/departed'},

  templates: {
    briefing:`DEAL BRIEF — [Company Name] — [Date]\n──────────────────────────────────────\nAccount context:    [Industry, size, current setup, deal stage]\nStakeholders:       [Name / Title / Role in decision / Engagement level]\nHypothesis:         [What we believe their problem is and why we win]\nThis meeting goal:  [One sentence: what must be true after this meeting]\nAsk for solutioning: [Specific request — what to demo, what to address]\nOpen risks:         [What could kill this deal]`,
    debrief:`DEBRIEF — [Company Name] — [Date]\n──────────────────────────────────\nWhat happened:      [2-3 sentences, buyer behavior not AE narration]\nHypothesis status:  [Confirmed / Adjusted / Rejected — and why]\nStakeholder update: [New contacts, power shifts, champion strength]\nNext step:          [Specific action + owner + date]\nPattern captured:   [Anything reusable for other deals]\nKill signal check:  [Any kill signals observed? Y/N + detail]`,
    handoffBdrAe:`BDR → AE HANDOFF\n─────────────────\nDeal Hypothesis:    [Why this account fits Green/Yellow ICP]\nTrigger/Pain:       [What signal did we see?]\nValidate in Call 1: [What must be confirmed?]\nFast disqualifier:  [One thing that kills this immediately]\nProspect told:      "I'm connecting you with [AE] who leads strategic accounts.\n                     First call is understanding your situation — no pitch, no demo."`,
    handoffAeCs:`AE → CS HANDOFF — [Company] — [Close Date]\n───────────────────────────────────────────\nWhat they bought:       [Tier, scope, term]\nWhy they bought:        [Problem statement in their words]\nWhat was promised:      [Specific KPIs and deliverables — nothing more]\nKey stakeholders:       [Name / Role / Engagement / Communication pref]\nChampion:               [Name, motivation, how they sold internally]\nKnown risks:            [What could cause churn]\nWhat NOT to promise:    [Anything excluded from scope]\nFirst 30-day priority:  [What CS should focus on first]`,

    stakeholderMap:`STAKEHOLDER MAP — [Company] — [Date] — Stage [X]\n──────────────────────────────────────────────────\n┌──────────────┬────────────┬──────────┬───────────┬────────────┐\n│ Name         │ Title      │ Role     │ Stance    │ Engagement │\n├──────────────┼────────────┼──────────┼───────────┼────────────┤\n│              │            │ Champion │ For       │ Active     │\n│              │            │ Econ     │ Neutral   │ Passive    │\n│              │            │ Blocker  │ Against   │ Unknown    │\n│              │            │ User     │ Unknown   │            │\n│              │            │ Influencer│          │            │\n└──────────────┴────────────┴──────────┴───────────┴────────────┘\n\nChampion Strength Score:\n  □ Articulated the problem in their own words\n  □ Shared internal information we didn't ask for\n  □ Completed homework (shared data, scheduled internal meeting)\n  □ Introduced us to another stakeholder\n  □ Can describe our value proposition without our help\n  Score: ___/5`,
    expansionReview:`EXPANSION REVIEW — [Company] — Month 4\n───────────────────────────────────────\nKPI performance:    [vs. pilot targets]\nContent status:     [published, performing %, authority trajectory]\nStakeholder health: [champion, new stakeholders, exec awareness]\nExpansion case:     [Which tier? Additional scope? Business case?]\nDecision:           [Expand now / At renewal / Need time / At risk]\nNext step:          [Specific action + date]`
  },
  championTests: [
    {test:'Homework',action:'Ask them to pull a specific data point (content volume, GA4 export)',strong:'Delivers within 48h',weak:'"I\'ll try to get to it"'},
    {test:'Internal meeting',action:'Ask them to schedule an internal meeting before next call',strong:'Schedules, shares who\'s invited',weak:'Delays or makes excuses'},
    {test:'Reframe',action:'Ask them to explain the problem as they\'d tell their CFO',strong:'Clear, business-language summary',weak:'Repeats your words back'},
    {test:'Challenge',action:'Gently challenge one of their assumptions',strong:'Engages, refines thinking',weak:'Defers, goes quiet'},
    {test:'Access',action:'Ask for direct intro to economic buyer',strong:'Makes the intro',weak:'"Let me handle that internally"'}
  ],
  dataPoints: [
    {stat:'94%',label:'of B2B buyers use AI in buying process',source:'Forrester, Jan 2026'},

    {stat:'€16-42',label:'per article vs. €250-375 agency rate',source:'WP SEO AI internal'}
  ],
  icpCriteria: [
    {dim:'Annual revenue',mm:'>€10M',smb:'<€10M'},

PAGE_RENDERERS.narrative=(el)=>{el.innerHTML=`<div class="page-header"><h1>Narrative & data points</h1><p>The numbers that open conversations. Know these so you can pull them naturally.</p></div><div class="grid-2" style="margin-bottom:24px">${OS.dataPoints.map(d=>`<div class="card" style="display:flex;align-items:center;gap:16px"><div style="font-size:32px;font-weight:800;color:var(--purple3);min-width:80px;text-align:right;line-height:1">${d.stat}</div><div><div style="font-size:14px;color:var(--blackish)">${d.label}</div><div style="font-size:12px;color:var(--text-light);margin-top:2px">${d.source}</div></div></div>`).join('')}</div><div class="card"><h3>The story arc (7 acts)</h3><p style="margin-bottom:14px">Two-phase motion: Discovery (Acts 1-3) → Demo/Proposal (Acts 4-6). You don't need every act every call.</p><div class="accordion"><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Opening:</strong>&nbsp;The decision has already been made</div><div class="acc-body">"92% of buyers enter with a vendor already in mind. The shortlist is formed in AI — in ChatGPT, in Copilot, in Gemini — before your sales team is ever involved." Let that land. Then: "That is the starting point for everything I'm about to show you."</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 1:</strong>&nbsp;The market has structurally shifted</div><div class="acc-body">Google's share dropped from 89% to 71%. ChatGPT holds 20%. But search isn't shrinking — the pie grew 26%. AI added a new layer on top. Almost nobody has a systematic way to capture it.</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 2:</strong>&nbsp;Three channels, one search result</div><div class="acc-body">SEA (sponsored) + GEO (AI Overviews) + SEO (organic) — three channels on one page, one buyer session. Most companies manage them separately. No shared intelligence. Everything resets.</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 3:</strong>&nbsp;Why everything they've tried hits a ceiling</div><div class="acc-body">Agencies: €250-375/article, quarterly cycles, no freshness tracking. Internal hires: 10-15 pieces/month before reporting eats capacity. DIY automation: volume without signal is waste. None close the learning loop.</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 4:</strong>&nbsp;What WP SEO AI actually is</div><div class="acc-body">Search Visibility Platform. Closed-loop learning system: Research → Produce → Publish → Measure → Optimize. We run it on your behalf. Not a platform you log into. We do the work. Plus long-tail SEA at 30-60% lower CPCs.</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 5:</strong>&nbsp;Why this is not a channel bet</div><div class="acc-body">RAG is architecturally permanent. OpenAI crawler requests grew 2,800% in 2025. AI platforms need authoritative content. Build topical authority = become structurally embedded in how AI answers questions.</div></div><div class="acc-item"><div class="acc-header" onclick="toggleAcc(this)"><span class="acc-arrow">›</span> <strong>Act 6:</strong>&nbsp;The close</div><div class="acc-body">In Europe, the window is still open (~6 months behind US). 18-24 month lead. Offer: visibility audit on top 5 category queries — ranking in Google, cited in ChatGPT, gaps. One day. No cost.</div></div></div></div>`;};

PAGE_RENDERERS.offers=(el)=>{el.innerHTML=`<div class="page-header"><h1>Offer architecture</h1><p>Three tiers. No bespoke deals. No exception pricing without approval.</p></div><div class="tier-cards">${OS.offers.map(o=>`<div class="tier-card${o.featured?' featured':''}">${o.featured?'<div class="rec-badge">Most common</div>':''}<div class="tier-label">${o.tier}</div><div class="tier-price">${o.price} <span>/ ${o.priceNote}</span></div><div class="tier-term">${o.term}</div><ul class="tier-features"><li>${o.scope}</li><li>${o.volume}</li><li>KPIs: ${o.kpis}</li><li>${o.reporting}</li><li>${o.conversion}</li></ul></div>`).join('')}</div><div class="callout warn"><strong>Pricing wall:</strong> MM buyers must not see SMB pricing. Pilot pricing only visible after MM qualification confirmed.</div><div class="card"><h3>Pilot scale / kill criteria</h3><p style="margin-bottom:14px">Decision rules at end of month 6. No ambiguity.</p><div class="sk-grid"><div class="sk-header">Signal</div><div class="sk-header" style="color:var(--green)">→ Scale</div><div class="sk-header" style="color:var(--orange)">→ Continue</div><div class="sk-header" style="color:var(--red)">→ Kill</div>${OS.scaleKill.map(sk=>`<div class="sk-cell">${sk.signal}</div><div class="sk-cell scale">${sk.scale}</div><div class="sk-cell continue">${sk.cont}</div><div class="sk-cell kill">${sk.kill}</div>`).join('')}</div><div style="margin-top:16px;font-size:14px;line-height:2"><p><span class="badge green">Scale</span> 4+ of 6 in Scale → recommend expansion at month 4</p><p><span class="badge orange">Continue</span> Majority in Continue, none in Kill → extend 3 months (one extension max)</p><p><span class="badge red">Kill</span> 2+ in Kill → honest conversation at month 4, close cleanly at month 6</p></div></div>`;};

PAGE_RENDERERS.icp=(el)=>{el.innerHTML=`<div class="page-header"><h1>ICP & qualification</h1><p>Not every account deserves the MM motion.</p></div><div class="card"><h3>MM vs. SMB routing</h3><table class="os-table"><tr><th>Dimension</th><th style="color:var(--purple3)">→ MM</th><th style="color:var(--text-light)">→ SMB</th></tr>${OS.icpCriteria.map(c=>`<tr><td><strong>${c.dim}</strong></td><td>${c.mm}</td><td>${c.smb}</td></tr>`).join('')}</table></div><div class="grid-2"><div class="card"><h3 style="color:var(--green)">Intent signals → route to MM</h3><ul style="font-size:14px;line-height:2.2;list-style:none"><li>→ Inbound from VP/Director+ title</li><li>→ Company in competitive loss analysis</li><li>→ Active SEO/GEO RFP or agency review</li><li>→ Event-sourced from MM-targeted events</li><li>→ SMB customer hitting content ceiling</li></ul></div><div class="card"><h3 style="color:var(--red)">Disqualification signals</h3><ul style="font-size:14px;line-height:2.2;list-style:none"><li>✕ Wants tactical SEO fixes only</li><li>✕ No budget authority after 2 calls</li><li>✕ Single-threaded after Stage 2</li><li>✕ Frames us as tool/agency only</li></ul></div></div>`;};

PAGE_RENDERERS['bdr-qualify']=(el)=>{el.innerHTML=`<div class="page-header"><h1>BDR qualification checklist</h1><p>Complete before every handoff. AEs can reject incomplete handoffs.</p></div><div class="card"><h3>Step 1: Does this account qualify?</h3><table class="os-table"><tr><th>Check</th><th>MM qualifier</th></tr>${OS.icpCriteria.map(c=>`<tr><td><strong>${c.dim}</strong></td><td>${c.mm}</td></tr>`).join('')}</table><div class="callout warn" style="margin-top:12px"><strong>All criteria must be true.</strong> If any fail → route to SMB.</div></div><div class="card"><h3>Step 2: Build the deal hypothesis</h3><div class="template-box"><button class="copy-btn" onclick="copyTemplate('handoffBdrAe')">Copy</button>${escapeHtml(OS.templates.handoffBdrAe)}</div></div><div class="card"><h3>Step 3: Set the prospect's expectation</h3><div class="callout info">Tell them: <strong>"I'm connecting you with [AE name] who leads our strategic accounts. They'll spend the first call understanding your situation — no pitch, no demo."</strong></div></div>`;};

PAGE_RENDERERS.champion=(el)=>{el.innerHTML=`<div class="page-header"><h1>Champion building</h1><p>A champion sells internally when you're not in the room. Test them before you trust them.</p></div><div class="card"><h3>Champion strength score (0-5)</h3><ul class="checklist"><li><span class="cl-icon">□</span> Articulated the problem in their own words</li><li><span class="cl-icon">□</span> Shared internal info we didn't ask for</li><li><span class="cl-icon">□</span> Completed homework (data, internal meeting)</li><li><span class="cl-icon">□</span> Introduced us to another stakeholder</li><li><span class="cl-icon">□</span> Can describe our value prop without help</li></ul><div class="callout warn" style="margin-top:10px"><strong>Score ≤ 2?</strong> You have a contact, not a champion.</div></div><div class="card"><h3>5 champion tests</h3><table class="os-table"><tr><th>Test</th><th>Action</th><th style="color:var(--green)">Strong</th><th style="color:var(--red)">Weak</th></tr>${OS.championTests.map(t=>`<tr><td><strong>${t.test}</strong></td><td>${t.action}</td><td>${t.strong}</td><td>${t.weak}</td></tr>`).join('')}</table></div>`;};

PAGE_RENDERERS.stakeholders=(el)=>{el.innerHTML=`<div class="page-header"><h1>Stakeholder mapping</h1><p>Multi-threading is non-negotiable.</p></div><div class="card"><h3>Stakeholder map template</h3><div class="template-box"><button class="copy-btn" onclick="copyTemplate('stakeholderMap')">Copy</button>${escapeHtml(OS.templates.stakeholderMap)}</div></div><div class="card"><h3>Multi-threading plays by stage</h3><table class="os-table"><tr><th>Stage</th><th>Minimum</th><th>The play</th></tr><tr><td><span class="badge purple">1</span></td><td>1 role named</td><td>"Who else would immediately recognize this problem?"</td></tr><tr><td><span class="badge purple">2</span></td><td>2 functions</td><td>"This usually breaks between teams — who would challenge this?"</td></tr><tr><td><span class="badge purple">2.5</span></td><td>3 functions</td><td>New stakeholder in the demo room (live only)</td></tr><tr><td><span class="badge purple">3</span></td><td>Econ buyer</td><td>"Who decides, who blocks, who influences?"</td></tr><tr><td><span class="badge purple">4</span></td><td>All decision-makers</td><td>All names in the MAP</td></tr></table></div>`;};

PAGE_RENDERERS.expansion=(el)=>{el.innerHTML=`<div class="page-header"><h1>Expansion playbook</h1><p>The pilot is the land. This is the expand.</p></div><div class="progress-track"><div class="pt-step done"><div class="pt-dot">✓</div><div class="pt-label">Pilot close</div></div><div class="pt-line done"></div><div class="pt-step current"><div class="pt-dot">4</div><div class="pt-label">Month 4 review</div></div><div class="pt-line"></div><div class="pt-step"><div class="pt-dot">6</div><div class="pt-label">Pilot end</div></div><div class="pt-line"></div><div class="pt-step"><div class="pt-dot">→</div><div class="pt-label">Medium / Large</div></div></div><div class="card"><h3>Month 4 review template</h3><div class="template-box"><button class="copy-btn" onclick="copyTemplate('expansionReview')">Copy</button>${escapeHtml(OS.templates.expansionReview)}</div></div><div class="card"><h3>Expansion triggers</h3><table class="os-table"><tr><th>Trigger</th><th>Timing</th><th>Action</th></tr><tr><td>Month 4 review</td><td>Mandatory</td><td>AE + CS review KPIs, prepare expansion proposal</td></tr><tr><td>KPI overperformance</td><td>After M3</td><td>AE initiates expansion conversation early</td></tr><tr><td>Scope request</td><td>Any time</td><td>Route to AE for expansion pricing</td></tr><tr><td>Champion promoted</td><td>Any time</td><td>AE re-qualifies opportunity</td></tr></table></div><div class="card"><h3>Ownership by phase</h3><table class="os-table"><tr><th>Phase</th><th>Primary</th><th>Support</th></tr><tr><td>Pilot (M1-6)</td><td>AE</td><td>CS (delivery)</td></tr><tr><td>Expansion conversation</td><td>AE</td><td>CS (data)</td></tr><tr><td>Expansion delivery</td><td>CS</td><td>AE (relationship)</td></tr><tr><td>Renewal (Y2+)</td><td>CS</td><td>AE (strategic)</td></tr></table></div>`;};

PAGE_RENDERERS.handoffs=(el)=>{el.innerHTML=`<div class="page-header"><h1>Handoff protocols</h1><p>Bad handoffs destroy momentum and set up churn.</p></div><div class="grid-2"><div class="card"><h3>BDR → AE <span class="role-hint bdr">BDR</span></h3><ul style="font-size:14px;line-height:2.2;list-style:none"><li>→ Deal hypothesis logged in CRM</li><li>→ Prospect told: first call = understanding, no pitch</li><li>→ AE reviews within 24h, accepts or rejects</li><li>→ Warm intro email with 2-line context</li></ul><div class="template-box" style="margin-top:12px"><button class="copy-btn" onclick="copyTemplate('handoffBdrAe')">Copy</button>${escapeHtml(OS.templates.handoffBdrAe)}</div></div><div class="card"><h3>AE → CS <span class="role-hint ae">AE</span></h3><ul style="font-size:14px;line-height:2.2;list-style:none"><li>→ Handoff document within 48h of close</li><li>→ AE joins first CS kickoff call</li><li>→ AE available for 30 days, then CS owns</li><li>→ Onboarding expectations set in Stage 4</li></ul><div class="template-box" style="margin-top:12px"><button class="copy-btn" onclick="copyTemplate('handoffAeCs')">Copy</button>${escapeHtml(OS.templates.handoffAeCs)}</div></div></div>`;};

PAGE_RENDERERS['ae-standard']=(el)=>{el.innerHTML=`<div class="page-header"><h1>What good looks like</h1><p>The operating standard for MM AEs.</p></div><div class="callout info"><strong>Key difference:</strong> A MM AE is not an SMB AE with bigger deals. Multi-stage (60-90 days), 3-5 stakeholders, transformation selling.</div><div class="do-dont"><div class="do-col do"><h4>What great looks like</h4><ul><li>Kills bad deals fast (Stage 1 = disqualification)</li><li>Problem statements in buyer language</li><li>Multi-threads proactively</li><li>Requests solutioning with clear briefing</li><li>Business cases from discovery data</li><li>Pilot as wedge to larger deal</li><li>Captures and shares patterns</li><li>Never sends proposal without Decision Map</li></ul></div><div class="do-col dont"><h4>What to avoid</h4><ul><li>Running MM like long SMB deals</li><li>Skipping stages ("they seem interested")</li><li>Demo-led selling</li><li>Deals >21 days without activity</li><li>Custom pricing without approval</li><li>Meetings without a hypothesis</li><li>"It went well" debriefs</li><li>Single-threaded past Stage 2</li></ul></div></div><div class="card"><h3>Daily rhythm</h3><table class="os-table"><tr><th>Block</th><th>Activity</th></tr><tr><td><strong>Morning</strong></td><td>Pipeline review: next steps due, call prep</td></tr><tr><td><strong>Pre-call</strong></td><td>Briefing one-pager (even solo calls)</td></tr><tr><td><strong>Post-call</strong></td><td>Debrief within 2h, CRM update, flag patterns</td></tr><tr><td><strong>Weekly</strong></td><td>Top 3 + 1 at-risk in pipeline review</td></tr><tr><td><strong>Bi-weekly</strong></td><td>MM sync, share learnings</td></tr></table></div><div class="card"><h3>Merit score (4 dimensions)</h3><table class="os-table"><tr><th>Dimension</th><th>Weight</th><th>Measure</th></tr><tr><td>Meeting-to-Opportunity</td><td>25%</td><td>Stage 1 → Stage 2 rate</td></tr><tr><td>Opportunity-to-Close</td><td>25%</td><td>Win rate</td></tr><tr><td>Deal velocity</td><td>25%</td><td>Average days to close</td></tr><tr><td>ACV vs. target</td><td>25%</td><td>Avg deal size vs. target</td></tr></table><div class="callout warn" style="margin-top:12px"><strong>MM eligibility = Tier 1 only.</strong> 90-day rolling. Below median → SMB only + coaching plan.</div></div>`;};

PAGE_RENDERERS.objections=(el)=>{const obs=[{o:'"We already have an agency."',r:'That means you have a point of comparison. What we hear is the agency delivers content but doesn\'t close the learning loop. When AI search changes, you wait for the quarterly review. What happens to content that doesn\'t perform?',s:'1-2'},{o:'"We can do this in-house with AI tools."',r:'You can — that solves volume. But volume without signal is waste at scale. If you don\'t know which 5% drives 80% of authority, you\'re producing cost, not return.',s:'1-3'},{o:'"What if AI search changes?"',r:'RAG is architecturally permanent — it solves knowledge cutoff and hallucination. OpenAI crawler requests grew 2,800% in 2025. You don\'t invest at that scale in something you plan to replace.',s:'2-3'},{o:'"The timing isn\'t right."',r:'What changes in 3-6 months? Authority positions are being claimed now. Every quarter of delay is compounding advantage given to someone else. 18-24 months to close the gap.',s:'3-4'},{o:'"€15K for a pilot is a lot."',r:'It\'s less than two months of agency content that doesn\'t compound. You get 240-360 articles, visibility growth, AI citations, and a data-backed go/no-go at month 6. What\'s the residual value of your last €15K in ad spend?',s:'3-4'},{o:'"We need procurement / legal."',r:'Good — that means it\'s being taken seriously. Let\'s map the process: who, what timeline, what they need. We\'ll build that into the Mutual Action Plan.',s:'4'},{o:'"Can you guarantee results?"',r:'We don\'t guarantee rankings. We guarantee execution: volume, the loop, measurement, optimization. The pilot has clear KPIs we control. You\'ll see trajectory in 90 days.',s:'2-4'}];el.innerHTML=`<div class="page-header"><h1>Objection handling</h1><p>Common objections with stage context and response frameworks.</p></div>${obs.map(o=>`<div class="card"><h3>${o.o} <span class="badge purple">Stage ${o.s}</span></h3><p>${o.r}</p></div>`).join('')}`;};

PAGE_RENDERERS.competitive=(el)=>{el.innerHTML=`<div class="page-header"><h1>Competitive positioning</h1><p>How we differ from the alternatives.</p></div><div class="card"><table class="os-table"><tr><th>Alternative</th><th>What they do</th><th>Where they fall short</th><th>Our angle</th></tr><tr><td><strong>Profound / Peec</strong></td><td>AI citation measurement</td><td>Measurement without execution. No content production, no loop.</td><td>"We don't just measure — we run the loop."</td></tr><tr><td><strong>SEO Agencies</strong></td><td>Content + strategy</td><td>Quarterly cycles. No freshness tracking. No pruning. €250-375/article.</td><td>"€16-42/article, continuous, all three channels."</td></tr><tr><td><strong>In-house team</strong></td><td>Ownership + quality</td><td>10-15 pieces/month ceiling. Can't scale across markets.</td><td>"Scale without headcount. <2 hrs/month."</td></tr><tr><td><strong>DIY AI tools</strong></td><td>Volume at low cost</td><td>Volume without signal. No learning loop. No authority building.</td><td>"Anyone can produce. We compound."</td></tr></table></div><div class="callout info"><strong>Positioning:</strong> The only closed-loop learning system for topical authority across SEO, GEO, and SEA — run as a managed service.</div>`;};

PAGE_RENDERERS['os-status']=(el)=>{const cs=[{n:1,nm:'Market thesis & narrative',l:'Foundation',st:'Live (V3)',b:'green'},{n:2,nm:'ICP & account scoring',l:'Foundation',st:'Designed',b:'orange'},{n:3,nm:'Sales process',l:'Execution',st:'Live (V1)',b:'green'},{n:4,nm:'Deal team model',l:'Execution',st:'Designed',b:'orange'},{n:5,nm:'Enablement & content',l:'Execution',st:'Partial',b:'orange'},{n:6,nm:'Proposal creation',l:'Execution',st:'Live — Foodora ref',b:'green'},{n:7,nm:'Offer architecture',l:'Execution',st:'Designed, pricing TBD',b:'orange'},{n:8,nm:'Call/deal analysis',l:'Intelligence',st:'Infra live',b:'orange'},{n:9,nm:'Pipeline & forecasting',l:'Intelligence',st:'Basic tracking',b:'orange'},{n:10,nm:'Learning capture',l:'Intelligence',st:'Framework designed',b:'orange'},{n:11,nm:'Loss analysis',l:'Intelligence',st:'No aggregation',b:'red'},{n:12,nm:'AE standard',l:'Scale',st:'Designed',b:'orange'},{n:13,nm:'Compensation',l:'Scale',st:'Blocked on Noy',b:'red'},{n:14,nm:'Expansion architecture',l:'Scale',st:'Concept only',b:'red'},{n:15,nm:'Handoff protocols',l:'Scale',st:'Partial',b:'orange'},{n:16,nm:'Stakeholder mapping',l:'Scale',st:'No methodology',b:'red'},{n:17,nm:'Dashboard & metrics',l:'Scale',st:'Spreadsheet',b:'red'},{n:18,nm:'Governance cadence',l:'Scale',st:'Sync live',b:'orange'},{n:19,nm:'Scenario planning',l:'Scale',st:'Identified',b:'red'}];el.innerHTML=`<div class="page-header"><h1>OS component status</h1><p>19 components across 4 layers.</p></div><div class="stat-grid"><div class="stat-box green"><div class="sv">${cs.filter(c=>c.b==='green').length}</div><div class="sl">Live</div></div><div class="stat-box orange"><div class="sv">${cs.filter(c=>c.b==='orange').length}</div><div class="sl">Designed / draft</div></div><div class="stat-box" style=""><div class="sv" style="color:var(--red)">${cs.filter(c=>c.b==='red').length}</div><div class="sl">To build</div></div><div class="stat-box purple"><div class="sv">${cs.length}</div><div class="sl">Total</div></div></div><div class="card"><table class="os-table"><tr><th>#</th><th>Component</th><th>Layer</th><th>Status</th></tr>${cs.map(c=>`<tr><td>${c.n}</td><td><strong>${c.nm}</strong></td><td>${c.l}</td><td><span class="badge ${c.b}">${c.st}</span></td></tr>`).join('')}</table></div>`;};

PAGE_RENDERERS.governance=(el)=>{el.innerHTML=`<div class="page-header"><h1>Governance & cadence</h1><p>Who reviews what, when.</p></div><div class="card"><table class="os-table"><tr><th>Cadence</th><th>Meeting</th><th>Who</th><th>Agenda</th><th>Duration</th></tr>${OS.governance.map(g=>`<tr><td><strong>${g.cadence}</strong></td><td>${g.meeting}</td><td>${g.who}</td><td>${g.agenda}</td><td>${g.dur}</td></tr>`).join('')}</table></div>`;};

const LS={get(k){try{return JSON.parse(localStorage.getItem('SALES_OS_'+k))}catch{return null}},set(k,v){localStorage.setItem('SALES_OS_'+k,JSON.stringify(v))},del(k){localStorage.removeItem('SALES_OS_'+k)}};
function fmt(n){return n>=1000?'€'+(n/1000).toFixed(n%1000===0?0:1)+'k':'€'+n;}
function fmtM(n){return '€'+(n/1000000).toFixed(2)+'M';}

// ── SCENARIO PLANNER ──
const SCENARIO_DEFAULTS={
  smb:[4500,30000,75000,75000,75000,75000,90000,115000,130000],
  med:[0,0,50000,0,0,0,0,0,0],
  big:[0,100000,0,100000,100000,200000,100000,300000,400000],
  fte:[0.6,0.6,1.6,2.5,3.5,4.5,5.5,5.5,5.5]
};
const MONTHS=['Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TARGET=2000000;

PAGE_RENDERERS.scenarios=(el)=>{
  const saved=LS.get('SCENARIO')||{};
  const smb=saved.smb||[...SCENARIO_DEFAULTS.smb];
  const med=saved.med||[...SCENARIO_DEFAULTS.med];
  const big=saved.big||[...SCENARIO_DEFAULTS.big];
  const fte=saved.fte||[...SCENARIO_DEFAULTS.fte];

  function sum(a){return a.reduce((s,v)=>s+(parseFloat(v)||0),0);}
  function render(){
    const total=sum(smb)+sum(med)+sum(big);
    const pct=Math.min(100,Math.round(total/TARGET*100));
    const gap=TARGET-total;
    const fteCost=sum(fte)*240000/9*4; // quarterly * ~4 quarters approx scaled
    const totalFteCost=fte.reduce((s,v)=>s+(parseFloat(v)||0)*((2*15000)+(100000/12)+(50000/12)),0);

    el.innerHTML=`<div class="page-header"><h1>Scenario planner</h1><p>Interactive revenue model — €2M MM target. Edit any yellow cell. Auto-saves.</p></div>
    <div class="scenario-kpi">
      <div class="kpi"><div class="kv ${total>=TARGET?'on-track':'behind'}" style="color:${total>=TARGET?'var(--green)':'var(--blackish)'}">${fmtM(total)}</div><div class="kl">Total projected ARR</div></div>
      <div class="kpi"><div class="kv" style="color:var(--purple3)">${pct}%</div><div class="kl">of €2M target</div></div>
      <div class="kpi"><div class="kv" style="color:${gap>0?'var(--red)':'var(--green)'}">${gap>0?fmtM(gap):'On target'}</div><div class="kl">${gap>0?'Gap to close':'Target met'}</div></div>
      <div class="kpi"><div class="kv">${fte[fte.length-1]}</div><div class="kl">Peak FTE (Dec)</div></div>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <div class="card"><h3>Revenue by tier</h3>
    <div style="overflow-x:auto"><table class="fin-table"><tr><th style="min-width:100px">Tier</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th style="color:var(--purple3)">Total</th></tr>
    <tr><td>SMB / Small<br><span style="font-size:11px;color:var(--text-light);font-weight:400">€15K ARR</span></td>${smb.map((v,i)=>`<td><input type="number" value="${v}" step="5000" min="0" onchange="updateScenario('smb',${i},this.value)"></td>`).join('')}<td style="font-weight:700;color:var(--blackish)">${fmtM(sum(smb))}</td></tr>
    <tr><td>MM / Med<br><span style="font-size:11px;color:var(--text-light);font-weight:400">€50K ARR</span></td>${med.map((v,i)=>`<td><input type="number" value="${v}" step="10000" min="0" onchange="updateScenario('med',${i},this.value)"></td>`).join('')}<td style="font-weight:700;color:var(--blackish)">${fmtM(sum(med))}</td></tr>
    <tr><td>MM / Big<br><span style="font-size:11px;color:var(--text-light);font-weight:400">€100K+ ARR</span></td>${big.map((v,i)=>`<td><input type="number" value="${v}" step="50000" min="0" onchange="updateScenario('big',${i},this.value)"></td>`).join('')}<td style="font-weight:700;color:var(--blackish)">${fmtM(sum(big))}</td></tr>
    <tr class="total-row"><td>Monthly total</td>${MONTHS.map((_,i)=>`<td>${fmt(smb[i]+med[i]+big[i])}</td>`).join('')}<td style="color:var(--purple3)">${fmtM(total)}</td></tr>
    </table></div></div>
    <div class="card"><h3>FTE ramp & cost model</h3>
    <p style="font-size:13px;color:var(--text);margin-bottom:12px">1 FTE = 2x €15K/mo + 1x €100K/yr + 1x €50K/yr. Quarterly budget: €240K.</p>
    <div style="overflow-x:auto"><table class="fin-table"><tr><th>Metric</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}<th>Peak</th></tr>
    <tr><td>Total FTE<br><span style="font-size:11px;color:var(--text-light);font-weight:400">Sales, CS, LS, Testing</span></td>${fte.map((v,i)=>`<td><input type="number" value="${v}" step="0.5" min="0" style="width:56px" onchange="updateScenario('fte',${i},this.value)"></td>`).join('')}<td style="font-weight:700">${Math.max(...fte)}</td></tr>
    <tr><td>Monthly cost</td>${fte.map(v=>`<td>€${Math.round(v*((2*15000)+(100000/12)+(50000/12)))/1000}k</td>`).join('')}<td></td></tr>
    </table></div></div>
    <div class="callout info"><strong>Tier definitions:</strong> Big = €100K+ ARR (multi-year). Med = €50K ARR (12 months). Small = Pilot €15K (6-month term). Revenue numbers show new ARR added per month.</div>`;
  }
  window.updateScenario=function(tier,idx,val){
    const v=parseFloat(val)||0;
    const saved=LS.get('SCENARIO')||{smb:[...SCENARIO_DEFAULTS.smb],med:[...SCENARIO_DEFAULTS.med],big:[...SCENARIO_DEFAULTS.big],fte:[...SCENARIO_DEFAULTS.fte]};
    saved[tier][idx]=v;
    if(tier==='smb')smb[idx]=v;if(tier==='med')med[idx]=v;if(tier==='big')big[idx]=v;if(tier==='fte')fte[idx]=v;
    LS.set('SCENARIO',saved);
    render();
  };
  render();
};

const DEAL_CHECKS=[
  {id:'problem',label:'Problem statement in buyer language',weight:10,cat:'Discovery'},
  {id:'multithread',label:'Multi-threaded (2+ stakeholders engaged)',weight:15,cat:'Access'},
  {id:'champion',label:'Champion identified and tested (score 3+/5)',weight:15,cat:'Champion'},

PAGE_RENDERERS['deal-scorecard']=(el)=>{
  const deals=LS.get('DEALS')||[];
  let editing=LS.get('EDITING_DEAL')||null;

  function scoreColor(s){return s>=71?'green':s>=41?'orange':'red';}
  function scoreLabel(s){return s>=71?'Healthy':s>=41?'Needs work':'At risk';}

  function renderList(){
    el.innerHTML=`<div class="page-header"><h1>Deal health scorecard</h1><p>Score your deals against the MM process. Fix the highest-weight gaps first.</p></div>
    <button class="qa-btn" onclick="startNewDeal()" style="margin-bottom:20px"><span class="qa-icon">+</span> New deal scorecard</button>
    ${deals.length?`<div class="card"><h3>Saved deals</h3>${deals.map((d,i)=>`<div class="deal-list-item" onclick="editDeal(${i})">
      <div class="dli-score ${scoreColor(d.score)}">${d.score}</div>
      <div class="dli-info"><div class="dli-name">${d.name||'Unnamed'}</div><div class="dli-meta">Stage ${d.stage} · ${d.value?'€'+d.value:'No value'} · ${scoreLabel(d.score)}</div></div>
      <button class="dli-del" onclick="event.stopPropagation();deleteDeal(${i})">✕</button>
    </div>`).join('')}</div>`:'<div class="callout info">No deals scored yet. Create your first scorecard above.</div>'}`;
  }

  function renderEditor(deal,idx){
    const score=DEAL_CHECKS.reduce((s,c)=>s+(deal.checks[c.id]?c.weight:0),0);
    const unchecked=DEAL_CHECKS.filter(c=>!deal.checks[c.id]).sort((a,b)=>b.weight-a.weight);
    el.innerHTML=`<div class="page-header"><h1>${deal.name||'New deal'}</h1><p>Score: ${score}/100</p></div>
    <div class="grid-2"><div>
    <div class="card" style="text-align:center">
      <div class="score-ring ${scoreColor(score)}"><div class="sr-num" style="color:var(--${scoreColor(score)})">${score}</div><div class="sr-label">${scoreLabel(score)}</div></div>
    </div>
    <div class="card"><h3>Deal info</h3>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input placeholder="Deal name" value="${deal.name||''}" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'name',this.value)">
        <select style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'stage',this.value)">
          ${['0','1','2','2.5','3','4','5'].map(s=>`<option value="${s}"${deal.stage===s?' selected':''}>Stage ${s}</option>`).join('')}
        </select>
        <input type="number" placeholder="Deal value (€)" value="${deal.value||''}" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:'Archivo',sans-serif" onchange="updateDealField(${idx},'value',this.value)">
      </div>
    </div>
    ${unchecked.length?`<div class="card"><h3 style="color:var(--red)">Fix these first</h3><ul style="font-size:14px;line-height:2;list-style:none">${unchecked.slice(0,5).map(c=>`<li><span class="badge ${c.weight>=15?'red':c.weight>=10?'orange':'blue'}">${c.weight}pts</span> ${c.label}</li>`).join('')}</ul></div>`:''}</div>
    <div><div class="card"><h3>Health checklist</h3>
      ${DEAL_CHECKS.map(c=>`<div class="deal-check"><input type="checkbox" ${deal.checks[c.id]?'checked':''} onchange="toggleDealCheck(${idx},'${c.id}',this.checked)"><div class="dc-label">${c.label}</div><div class="dc-weight">${c.weight}pts</div><div class="dc-cat">${c.cat}</div></div>`).join('')}
    </div></div></div>
    <button class="qa-btn" onclick="backToDeals()" style="margin-top:12px"><span class="qa-icon">←</span> Back to all deals</button>`;
  }

  window.startNewDeal=function(){const d={name:'',stage:'1',value:'',checks:{},score:0};deals.push(d);LS.set('DEALS',deals);renderEditor(d,deals.length-1);};
  window.editDeal=function(i){renderEditor(deals[i],i);};
  window.deleteDeal=function(i){deals.splice(i,1);LS.set('DEALS',deals);renderList();};
  window.backToDeals=function(){renderList();};
  window.updateDealField=function(i,f,v){deals[i][f]=v;LS.set('DEALS',deals);renderEditor(deals[i],i);};
  window.toggleDealCheck=function(i,id,v){deals[i].checks[id]=v;deals[i].score=DEAL_CHECKS.reduce((s,c)=>s+(deals[i].checks[c.id]?c.weight:0),0);LS.set('DEALS',deals);renderEditor(deals[i],i);};

  renderList();
};

        <div class="roi-row"><span class="rr-label">Articles (3x your volume)</span><span class="rr-value">${weArticles}/yr</span></div>
        <div class="roi-row"><span class="rr-label">Your time required</span><span class="rr-value">&lt;2 hrs/mo</span></div>
        <div class="roi-row"><span class="rr-label">Content cost range</span><span class="rr-value">€${Math.round(weCostLow/1000)}k–€${Math.round(weCostHigh/1000)}k</span></div>
      </div>
      <div class="roi-col compound"><h4>What compounds</h4>
        <div class="roi-row"><span class="rr-label">Target performing %</span><span class="rr-value" style="color:var(--green)">20%+ (vs ${d.performPct}%)</span></div>
        <div class="roi-row"><span class="rr-label">Performing articles</span><span class="rr-value" style="color:var(--green)">${wePerforming}</span></div>
        <div class="roi-row"><span class="rr-label">CPC reduction</span><span class="rr-value">€${cpcReductionLow}–€${cpcReductionHigh}</span></div>
        <div class="roi-row"><span class="rr-label">Annual SEA savings</span><span class="rr-value" style="color:var(--green)">€${Math.round(seaSavingsLow/1000)}k–€${Math.round(seaSavingsHigh/1000)}k</span></div>
        <div class="roi-row"><span class="rr-label">Year 3 organic cost/visit</span><span class="rr-value">Fraction of paid</span></div>
        <div class="roi-row"><span class="rr-label">Asset residual value</span><span class="rr-value" style="color:var(--green)">Compounds forever</span></div>
      </div>
    </div>
    <div class="roi-summary">You're spending <strong>€${Math.round((d.contentCost+d.agencySpend)/1000)}k/year</strong> to get <strong>${performingNow} performing articles</strong> out of ${totalArticles}. We deliver <strong>${weArticles} articles at €16–42 each</strong> with a target of <strong>20%+ performing</strong> — that's <strong>${wePerforming} performing articles</strong>, ${wePerforming>0&&performingNow>0?Math.round(wePerforming/performingNow)+'x':'significantly'} more than today. And unlike paid, it compounds when you stop spending.</div>`;
  }
  window.updateROI=function(f,v){saved[f]=parseFloat(v)||0;LS.set('ROI',saved);render();};
  render();
};

// ── DISCOVERY ENGINE ──
const DISC_QUESTIONS={
  'CMO-1':[{q:'How do you currently measure the ROI of your organic content investment?',f:'If they say traffic: "Traffic is an input, not an outcome. What percentage of that traffic converts?"',t:'ROI'},{q:'When you think about where your brand appears in AI-generated answers, how confident are you in that visibility?',f:'If confident: "How are you tracking it? 83% of AI usage is in mobile apps — GA4 can\'t see it."',t:'AI Search'},{q:'What happens internally when a content piece doesn\'t generate traffic after 90 days?',f:'If nothing: "That\'s where 96.55% of content ends up. The question is whether you have a system to catch and fix that."',t:'Waste'}],
  'CMO-2':[{q:'Walk me through your content production workflow — from idea to published, who touches it?',f:'Look for bottlenecks, handoff delays, and approval loops that kill velocity.',t:'Process'},{q:'How much are you spending annually on content production and SEO — agency, tools, and internal time combined?',f:'Need this number for the business case. If they don\'t know, that\'s a data point in itself.',t:'Business case'},{q:'What percentage of your published content is actually driving measurable results?',f:'Industry benchmark is 3.45%. Most are shocked when they do the math.',t:'Waste'}],
  'CMO-3':[{q:'If you could quantify the cost of your current non-performing content, what would that number look like?',f:'Help them calculate: articles × cost per article × (1 - performing %). The waste number sells itself.',t:'Economics'},{q:'What would it mean for your team if organic and AI search became a predictable, compounding channel rather than a project-based effort?',f:'Listen for language about "predictability" and "scalability" — these are buying signals.',t:'Vision'},{q:'How are you thinking about the budget allocation between paid and organic for the next 12 months?',f:'If mostly paid: "Every euro in paid stops the moment budget stops. Organic compounds."',t:'Budget'}],
  'VP Marketing-1':[{q:'What\'s the biggest gap between your content strategy and your actual execution capacity?',f:'This surfaces the "Fourth Trap" — having strategy but not the team to run it continuously.',t:'Capacity'},{q:'How are you approaching the shift to AI search — ChatGPT, Gemini, AI Overviews?',f:'If "we\'re watching it": "94% of B2B buyers are already using AI. Watching is falling behind."',t:'Urgency'},{q:'When was the last time you pruned or removed underperforming content from your site?',f:'If never: "That content is actively diluting your domain authority and confusing AI crawlers."',t:'Waste'}],
  'VP Marketing-2':[{q:'How many different tools are in your current SEO and content stack?',f:'Most have 5-8. "Each one solves a slice. None of them close the loop between measurement and action."',t:'Tool sprawl'},{q:'Who internally is responsible for connecting SEO performance data to content production decisions?',f:'If nobody: "That\'s the synthesis layer that doesn\'t exist in the market. That\'s what we do."',t:'Gap'},{q:'What does your reporting cadence look like — how often do you review what\'s working and what\'s not?',f:'If quarterly: "AI search changes every few weeks. Quarterly review cycles can\'t keep pace."',t:'Speed'}],
  'VP Marketing-3':[{q:'If I showed you that you could get 3x the content output at 30% of the cost with 20%+ performing — what would that free up for your team?',f:'Don\'t wait for the answer — let them paint the picture. Their words become the business case.',t:'Vision'},{q:'What does the internal approval process look like for a €15K pilot investment?',f:'Map the decision: who signs, what timeline, what they need. This builds your Decision Map.',t:'Process'}],
  'Head of Content-1':[{q:'How many content pieces are you producing per month, and how much of that is new vs. refreshing existing?',f:'If all new: "You\'re adding to the pile without optimizing what you have. That\'s how 96% of content dies."',t:'Volume'},{q:'What does your process look like when a piece isn\'t ranking after 60 days?',f:'If no process: "The learning loop is missing. Publish → measure → optimize → repeat."',t:'Loop'},{q:'How are you structuring content around topical clusters vs. individual keywords?',f:'If keywords: "Keyword-first is legacy SEO. Topical authority is how you win in both Google and AI search."',t:'Strategy'}],
  'Head of Content-2':[{q:'If you had unlimited production capacity, what would you build first?',f:'This reveals their strategic priority without the constraint of capacity. Gold for scoping.',t:'Priority'},{q:'How do you currently decide what to write next — what\'s the decision framework?',f:'If gut feel or keyword volume: "We map every question the market asks across Google, ChatGPT, and Gemini."',t:'Research'}],
  'CTO-2':[{q:'Walk me through your CMS architecture — WordPress, headless, custom?',f:'If WordPress: "We\'re native. Plugin installed by us, content archive set up by us, zero engineering."',t:'Technical'},{q:'What does the content publishing pipeline look like from a technical standpoint?',f:'Look for manual steps, staging environments, approval queues — all friction we eliminate.',t:'Process'},{q:'How comfortable is your team with a third-party plugin having publish access to your WordPress instance?',f:'Address security directly: "Read-only dashboard access. Content goes through your existing approval."',t:'Security'}],
  'CTO-3':[{q:'What are your requirements around data handling, GDPR compliance, and third-party access?',f:'We\'re European-first, GDPR-compliant, data stays in EU. Get specifics for the proposal.',t:'Compliance'},{q:'If we needed to integrate with your existing analytics and reporting stack, what would that look like?',f:'GSC + GA4 are standard. Ask about custom dashboards, Looker, Tableau — scoping info.',t:'Integration'}],
  'CFO-3':[{q:'How do you currently evaluate the ROI of your marketing technology spend?',f:'If they don\'t have a framework: "We measure two things you control: visibility growth and AI citations."',t:'ROI'},{q:'What\'s the total cost of your current content and SEO operation — internal headcount, agency, tools combined?',f:'Build the waste calculation live: total spend × (1 - performing %). The number is always shocking.',t:'Business case'},{q:'How do you think about the difference between an expense that stops when budget stops versus an asset that compounds?',f:'This reframes the pilot from "cost" to "investment with residual value."',t:'Framing'}],
  'CFO-4':[{q:'What does your procurement process look like for a €15K pilot — who needs to sign off?',f:'Map it: procurement, legal, budget holder. Build into the MAP.',t:'Process'},{q:'If the pilot delivers measurable visibility growth and AI citations at month 4, what would the expansion decision process look like?',f:'Pre-sell the expansion: "We want to set expectations now so there are no surprises at the review."',t:'Expansion'}],
  'Procurement-4':[{q:'What are your standard vendor evaluation criteria for a managed service engagement?',f:'Get their scorecard. We can pre-fill most of it in the proposal.',t:'Process'},{q:'What\'s the typical timeline from proposal received to contract signed for this deal size?',f:'Anchor the MAP timeline against their norm. If 6 weeks, build backwards from close date.',t:'Timeline'},{q:'Are there specific compliance, security, or data residency requirements we should address upfront?',f:'EU-based, GDPR-compliant, data in EU. Get any additional requirements documented.',t:'Compliance'}]
};

PAGE_RENDERERS.discovery=(el)=>{
  let persona='CMO',stage='1';
  function render(){
    const key=persona+'-'+stage;
    const qs=DISC_QUESTIONS[key]||[];
    const personas=['CMO','VP Marketing','Head of Content','CTO','CFO','Procurement'];
    const stages=['1','2','3','4'];
    el.innerHTML=`<div class="page-header"><h1>Discovery engine</h1><p>Select persona and stage. Get ranked questions with follow-up prompts.</p></div>
    <div class="disc-controls">
      <select onchange="updateDisc('persona',this.value)">${personas.map(p=>`<option${p===persona?' selected':''}>${p}</option>`).join('')}</select>
      <select onchange="updateDisc('stage',this.value)">${stages.map(s=>`<option value="${s}"${s===stage?' selected':''}>Stage ${s}</option>`).join('')}</select>
    </div>
    ${qs.length?qs.map(q=>`<div class="disc-question"><div class="dq-main">"${q.q}"</div><div class="dq-follow">Follow-up: ${q.f}</div><div class="dq-tag">${q.t}</div></div>`).join(''):'<div class="callout warn">No questions mapped for <strong>${persona} at Stage ${stage}</strong> yet. Primary discovery personas: CMO, VP Marketing, Head of Content (Stages 1-3). Technical/financial: CTO, CFO, Procurement (Stages 2-4).</div>'}`;
  }
  window.updateDisc=function(f,v){if(f==='persona')persona=v;else stage=v;render();};
  render();
};

// ── KEYBOARD ──
document.addEventListener('keydown',(e)=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('searchInput').focus();}if(e.key==='Escape'){document.getElementById('searchResults').classList.remove('show');document.getElementById('searchInput').blur();}});

// ── INIT ──
const savedRole=LS.get('ROLE');
if(savedRole)currentRole=savedRole;
document.querySelectorAll('.role-btn').forEach(b=>b.classList.toggle('active',b.dataset.role===currentRole));
renderSidebar();
navigateTo('dashboard');
// Save role on switch
const origSetRole=setRole;
setRole=function(r){LS.set('ROLE',r);origSetRole(r);};
</script>
</body>

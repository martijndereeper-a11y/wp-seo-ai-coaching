<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WP SEO AI — Sales Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f042c;--bg2:#1a0e3a;--bg3:#260e49;--border:#3b1d6e;--border-soft:rgba(59,29,110,.55);
  --text:#FFFFFF;--text2:#C2BAD6;--text3:#8A82A0;
  --purple:#B748FF;--purple2:#7c3aed;--purple-soft:#BEB5FF;--purple-tint:rgba(183,72,255,.08);
  --green:#10B981;--red:#EF4444;--orange:#F59E0B;--blue:#3B82F6;
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 20px rgba(0,0,0,.18);
  --shadow-hover:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 28px rgba(0,0,0,.25);
  --radius:14px;--radius-sm:10px;--radius-pill:9999px;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:'Archivo',sans-serif;background:#0f042c;color:var(--text);background:radial-gradient(ellipse 90% 70% at 30% 10%,#20114a 0%,#0f042c 60%,#08011f 100%) fixed;line-height:1.6;font-size:15px;font-weight:400}
a{color:var(--purple-soft);text-decoration:none;cursor:pointer;transition:color .2s var(--ease)}a:hover{color:var(--purple);text-decoration:underline}
button{font-family:inherit}

/* Topbar */
.topbar{background:rgba(15,4,44,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border-soft);padding:14px 28px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:100}
.topbar .logo svg{height:24px;width:auto;display:block}
.topbar h1{font-size:14px;font-weight:500;color:var(--text2);letter-spacing:-.01em}
.topbar h1::before{content:'';display:inline-block;width:1px;height:14px;background:var(--border);margin-right:16px;vertical-align:-2px}
.spacer{flex:1}
.pill-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;transition:all .2s var(--ease);letter-spacing:.01em}
.pill-btn:hover{border-color:var(--purple);color:var(--text);background:var(--purple-tint)}
.pill-btn.primary{background:var(--purple);border-color:var(--purple);color:white;font-weight:600}
.pill-btn.primary:hover{background:var(--purple2);border-color:var(--purple2);color:white}

/* Layout */
.container{max-width:920px;margin:0 auto;padding:36px 24px 60px}
.hidden{display:none}

/* Login */
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,4,44,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:200;display:flex;align-items:center;justify-content:center}
.login-card{background:var(--bg2);border:1px solid var(--border);padding:36px;border-radius:18px;width:380px;box-shadow:var(--shadow-card)}
.login-card h2{font-size:22px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em}
.login-card p{color:var(--text2);font-size:14px;margin-bottom:22px;line-height:1.5}
.login-card input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:14px;margin-bottom:12px;outline:none;font-family:inherit;transition:border-color .2s var(--ease)}
.login-card input:focus{border-color:var(--purple)}
.login-card button{width:100%;padding:12px;background:var(--purple);color:white;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:background .2s var(--ease);font-family:inherit}
.login-card button:hover{background:var(--purple2)}
.login-error{color:var(--red);font-size:12px;margin-top:8px;min-height:16px}

/* Headings */
h2.pgtitle{font-size:30px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em;line-height:1.2}
.pgtitle-sub{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.5}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border-soft);border-radius:var(--radius);padding:24px;margin-bottom:16px;box-shadow:var(--shadow-card);transition:border-color .2s var(--ease),transform .2s var(--ease)}
.card h3{font-size:17px;font-weight:600;margin-bottom:16px;color:var(--text);letter-spacing:-.01em}
.card h3 .meta{font-size:11px;color:var(--text3);font-weight:400;margin-left:8px;letter-spacing:0}

/* Back */
.back{background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:20px;padding:4px 0;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease);font-family:inherit}
.back:hover{color:var(--text)}
.back::before{content:'←';font-size:14px;transition:transform .2s var(--ease)}
.back:hover::before{transform:translateX(-3px)}

/* Team list rows */
.ae-row{display:flex;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .2s var(--ease);gap:14px}
.ae-row:hover{background:var(--bg3)}
.ae-row:last-child{border-bottom:none}
.ae-row .name{font-weight:600;font-size:15px;flex:1;min-width:160px;letter-spacing:-.01em}
.ae-row .meta-col{min-width:94px;font-size:11px;color:var(--text3);text-align:right;letter-spacing:.02em;text-transform:uppercase;font-weight:500}
.ae-row .meta-col .big{font-size:22px;font-weight:700;color:var(--text);display:block;text-transform:none;letter-spacing:-.01em;margin-bottom:2px}
.ae-row .trend{width:24px;text-align:center;font-size:16px;flex-shrink:0}
.trend-up{color:var(--green)}.trend-down{color:var(--red)}.trend-flat{color:var(--text3)}.trend-new{color:var(--text3);font-size:10px}

/* VBAT navigation (jump index) */
.vbat-nav{display:grid;grid-template-columns:1fr;gap:10px}
.vbat-row{display:flex;align-items:flex-start;gap:16px;padding:16px 18px;background:var(--bg3);border-left:3px solid var(--border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;cursor:pointer;transition:background .2s var(--ease),transform .2s var(--ease)}
.vbat-row.confirmed{border-left-color:var(--green)}
.vbat-row.missed{border-left-color:var(--orange)}
.vbat-row:hover{background:#30105a;transform:translateX(2px)}
.vbat-letter{font-size:22px;font-weight:700;width:30px;text-align:center;flex-shrink:0;letter-spacing:-.02em;line-height:1.1}
.vbat-letter.confirmed{color:var(--green)}
.vbat-letter.missed{color:var(--orange)}
.vbat-body{flex:1;min-width:0}
.vbat-label{font-size:13px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.vbat-label .ts{color:var(--purple-soft);font-family:'SF Mono','Menlo',monospace;font-weight:500;margin-left:8px;font-size:10px;padding:2px 7px;background:var(--bg2);border-radius:4px;letter-spacing:.02em}
.vbat-evidence{font-size:14px;color:var(--text2);font-style:italic;line-height:1.55;word-break:break-word}
.vbat-reasoning{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.5}
.vbat-actions{display:flex;gap:6px;margin-top:6px;font-size:11px}
.vbat-wrong-btn{background:none;border:1px solid var(--border);color:var(--text3);padding:2px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.vbat-wrong-btn:hover{border-color:var(--red);color:var(--red)}
.vbat-wrong-btn.flagged{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}
.conf-high{background:rgba(16,185,129,.15);color:var(--green)}
.conf-medium{background:rgba(245,158,11,.15);color:var(--orange)}
.conf-low{background:rgba(239,68,68,.15);color:var(--red)}
.conf-badge{font-size:10px;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:6px}

/* Summary + one-thing */
.summary-block{font-size:15px;line-height:1.65;color:var(--text)}
.one-thing{background:linear-gradient(180deg,rgba(183,72,255,.10) 0%,rgba(183,72,255,.04) 100%);border:1px solid rgba(183,72,255,.28);border-radius:var(--radius);padding:20px;margin-top:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.one-thing .label{font-size:11px;color:var(--purple-soft);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.one-thing .text{font-size:15px;color:var(--text);line-height:1.6}

/* Narrative body */
.narrative-body{font-size:14px;line-height:1.7;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.narrative-body strong, .narrative-body b{color:var(--text);font-weight:600}
.narrative-body h3, .narrative-body h4{color:var(--text);font-size:15px;font-weight:700;margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);letter-spacing:-.01em}
.narrative-body em{color:var(--purple-soft)}
.narrative-loading{color:var(--text3);font-size:14px;font-style:italic;padding:8px 0}
.regenerate-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.regenerate-row .gen-meta{font-size:11px;color:var(--text3);letter-spacing:.02em}

/* Call list */
.call-list-item{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border-soft);cursor:pointer;gap:16px;transition:background .2s var(--ease)}
.call-list-item:hover{background:var(--bg3)}
.call-list-item:last-child{border-bottom:none}
.call-date{font-size:11px;color:var(--text3);min-width:72px;font-family:'SF Mono','Menlo',monospace;letter-spacing:.02em}
.call-title{flex:1;min-width:0;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.call-dots{display:flex;gap:4px;flex-shrink:0}
.dot{width:20px;height:20px;border-radius:50%;background:var(--bg3);color:var(--text3);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);transition:transform .15s var(--ease)}
.call-list-item:hover .dot{transform:scale(1.05)}
.dot.confirmed{background:rgba(16,185,129,.2);color:var(--green);border-color:rgba(16,185,129,.5)}
.dot.missed{background:rgba(245,158,11,.15);color:var(--orange);border-color:rgba(245,158,11,.45)}
.dot.none{background:var(--bg3);color:var(--text3);border-color:var(--border)}
.tier-badge{font-size:10px;padding:3px 8px;border-radius:var(--radius-pill);font-weight:700;min-width:22px;text-align:center;letter-spacing:.05em}
.tier-A{background:rgba(16,185,129,.18);color:var(--green)}
.tier-B{background:rgba(59,130,246,.18);color:var(--blue)}
.tier-C{background:rgba(156,163,175,.18);color:var(--text3)}

/* Expander */
details.expander{background:var(--bg2);border:1px solid var(--border-soft);border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow-card);transition:border-color .2s var(--ease)}
details.expander[open]{border-color:var(--border)}
details.expander summary{padding:16px 22px;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);list-style:none;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.01em;transition:color .2s var(--ease)}
details.expander summary::-webkit-details-marker{display:none}
details.expander summary::after{content:'▾';font-size:14px;color:var(--text3);transition:transform .2s var(--ease)}
details.expander[open] summary::after{transform:rotate(180deg);color:var(--purple-soft)}
details.expander summary:hover{color:var(--text)}
.expander-body{padding:0 22px 22px}

/* Expert level section */
.expert-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);font-weight:700;margin:24px 0 10px;display:flex;align-items:center;gap:10px}
.expert-label::before,.expert-label::after{content:'';flex:1;height:1px;background:var(--border-soft)}

/* Loading / empty states */
.loading{padding:48px;text-align:center;color:var(--text2);font-size:14px;line-height:1.5}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:13px;line-height:1.5}

/* Pattern summary */
.pattern-bar{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:13px}
.pattern-bar .pb-label{width:120px;color:var(--text2);font-weight:500;letter-spacing:-.01em}
.pattern-bar .pb-track{flex:1;height:8px;background:var(--bg3);border-radius:var(--radius-pill);overflow:hidden;border:1px solid var(--border-soft)}
.pattern-bar .pb-fill{height:100%;background:linear-gradient(90deg,var(--purple2) 0%,var(--purple) 100%);border-radius:var(--radius-pill);transition:width .6s var(--ease)}
.pattern-bar .pb-num{width:60px;text-align:right;color:var(--text2);font-size:12px;font-variant-numeric:tabular-nums}

/* Weakest callout */
.weakest-callout{background:linear-gradient(180deg,rgba(245,158,11,.10) 0%,rgba(245,158,11,.04) 100%);border:1px solid rgba(245,158,11,.32);border-radius:var(--radius);padding:18px;font-size:14px;line-height:1.6;margin-top:18px;color:var(--text2)}
.weakest-callout strong{color:var(--orange);font-weight:700}

/* Error banner */
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.4);color:var(--red);padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:13px;line-height:1.5}

/* AE narrative chunks — chip row + section cards */
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border-soft)}
.chip{background:transparent;border:1px solid var(--border);color:var(--text2);padding:7px 13px;border-radius:var(--radius-pill);cursor:pointer;font-size:11px;font-weight:600;transition:all .2s var(--ease);font-family:inherit;display:inline-flex;align-items:center;gap:8px;letter-spacing:.01em}
.chip:hover{border-color:var(--purple);color:var(--text);background:var(--purple-tint)}
.chip .chip-num{color:var(--purple-soft);font-variant-numeric:tabular-nums;font-weight:700;font-size:10px;letter-spacing:.06em}

.ae-sections{display:flex;flex-direction:column;gap:10px}
.ae-section{background:var(--bg3);border:1px solid var(--border-soft);border-radius:var(--radius);transition:border-color .2s var(--ease),background .2s var(--ease)}
.ae-section[open]{border-color:rgba(183,72,255,.4);background:var(--bg2)}
.ae-section summary{padding:16px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:14px;font-size:13px;transition:background .2s var(--ease)}
.ae-section summary::-webkit-details-marker{display:none}
.ae-section summary:hover{background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0}
.ae-section[open] summary:hover{border-radius:var(--radius) var(--radius) 0 0}
.ae-section .sec-num{color:var(--purple-soft);font-size:11px;font-weight:700;min-width:24px;font-variant-numeric:tabular-nums;letter-spacing:.06em;flex-shrink:0}
.ae-section[open] .sec-num{color:var(--purple)}
.ae-section .sec-label{font-weight:600;color:var(--text);min-width:170px;flex-shrink:0;font-size:14px;letter-spacing:-.01em}
.ae-section .sec-teaser{color:var(--text3);font-size:12.5px;flex:1;min-width:0;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.4}
.ae-section .sec-caret{color:var(--text3);font-size:12px;transition:transform .2s var(--ease);margin-left:auto;flex-shrink:0}
.ae-section[open] .sec-caret{transform:rotate(180deg);color:var(--purple-soft)}
.ae-section .sec-body{padding:4px 20px 22px 56px;font-size:14px;line-height:1.7;color:var(--text2)}
.ae-section .sec-body::before{content:'';display:block;height:1px;background:var(--border-soft);margin-bottom:14px}
.ae-section .sec-body h4{color:var(--text);font-size:14px;font-weight:700;margin:14px 0 6px;padding:0;border:none;letter-spacing:-.01em}
.ae-section .sec-body strong{color:var(--text);font-weight:600}

@media (max-width:700px){
  .ae-section .sec-label{min-width:auto}
  .ae-section .sec-teaser{display:none}
  .ae-section .sec-body{padding-left:20px}
  .container{padding:24px 16px 48px}
  h2.pgtitle{font-size:26px}
  .topbar{padding:12px 18px;gap:12px}
  .topbar h1{display:none}
  .ae-row{flex-wrap:wrap;gap:12px;padding:16px}
  .ae-row .meta-col{min-width:70px}
  .card{padding:20px}
}

/* Focus states */
button:focus-visible,.chip:focus-visible,details summary:focus-visible,a:focus-visible,.vbat-row:focus-visible,.ae-row:focus-visible,.call-list-item:focus-visible{outline:2px solid var(--purple);outline-offset:2px;border-radius:var(--radius-sm)}

/* Scrollbar (dark theme) */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:var(--radius-pill);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--border)}
</style>
</head>
<body>

<!-- Login -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>Sales Coaching</h2>
    <p>Enter the team password to continue.</p>
    <input id="login-pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">Sign in</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="explain-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;padding:32px;overflow-y:auto" onclick="if(event.target===this)hideExplanation()">

<div class="container" id="app">

<script>
// ═══════════════════════════ AUTH ═══════════════════════════
let authToken = localStorage.getItem('auth_token') || '';
let authRole = localStorage.getItem('auth_role') || '';

async function doLogin(){
  const pw = document.getElementById('login-pw').value;
  try {
    const res = await fetch('/api/auth/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
    const data = await res.json();
    if (data.error) { document.getElementById('login-error').textContent = data.error; return; }
    authToken = data.token; authRole = data.role;
    localStorage.setItem('auth_token', authToken);
    localStorage.setItem('auth_role', authRole);
    document.getElementById('login-overlay').style.display = 'none';
    applyRoleVisibility();
    loadTeam();
  } catch(e){ document.getElementById('login-error').textContent = 'Connection error'; }
}

function logout(){
  authToken=''; authRole='';
  localStorage.removeItem('auth_token');
  localStorage.removeItem('auth_role');
  location.reload();
}

function goClassic(){ location.href = '/classic'; }

function applyRoleVisibility(){
  const isLead = authRole === 'lead';
  const deepBtn = document.getElementById('btn-deep-view');
  if (deepBtn) deepBtn.style.display = isLead ? '' : 'none';
  const adminBtn = document.getElementById('btn-admin');
  if (adminBtn) adminBtn.style.display = isLead ? '' : 'none';
}

if (authToken) {
  document.getElementById('login-overlay').style.display = 'none';
  applyRoleVisibility();
}

// ═══════════════════════════ API ═══════════════════════════
async function api(path, opts={}){
  const res = await fetch(path, {...opts, headers:{...opts.headers,'Authorization':'Bearer '+authToken,'Content-Type':'application/json'}});
  if (res.status === 401) { logout(); throw new Error('Unauthorized'); }
  return res;
}

async function apiJSON(path, opts){
  const res = await api(path, opts);
  const txt = await res.text();
  if (!txt) return null;
  try { return JSON.parse(txt); } catch { return { _raw: txt }; }
}

// ═══════════════════════════ HELPERS ═══════════════════════════
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

// Map engine's sales-game letters (A=Value, B=Authority, C=Budget, D=Timeline) to Marc's VBAT labels.
// But the VBAT classifier ALREADY uses Marc's letters (V/B/A/T/E/F) so we use them directly.
const VBAT_LABELS = {
  V: 'Value',
  B: 'Budget',
  A: 'Authority',
  T: 'Timeline',
  E: 'Good News Show',
  F: 'Defensive Line',
};
const VBAT_DESC = {
  V: 'Prospect articulated why they need this in their own words',
  B: 'Budget / investment capacity discussed',
  A: 'Decision-maker confirmed',
  T: 'Concrete decision date committed to',
  E: 'Incentive traded for a dated commitment',
  F: 'Urgency pushed → prospect resisted → AE handled it',
};
const SPICED_LABELS = {
  S: 'Situation',
  P: 'Pain',
  I: 'Impact',
  C: 'Critical Event',
  D: 'Decision',
};
const SPICED_DESC = {
  S: 'Prospect described their current state (setup, tools, team, baseline)',
  P: 'Prospect owned a concrete problem in their own words',
  I: 'Pain tied to a business consequence, ideally quantified',
  C: 'A dated compelling event forcing a decision on a timeline',
  D: 'Decision process mapped + a concrete next step agreed',
};

function fmtDate(iso){
  if (!iso) return '';
  const d = new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function trendGlyph(trend){
  if (trend === 'up')   return '<span class="trend trend-up">↑</span>';
  if (trend === 'down') return '<span class="trend trend-down">↓</span>';
  if (trend === 'new')  return '<span class="trend trend-new">·</span>';
  return '<span class="trend trend-flat">→</span>';
}

function renderMarkdown(text){
  if (!text) return '';
  let t = esc(text);
  // Headers: ### Title or #### Title
  t = t.replace(/^#{3,4}\s+(.+)$/gm, '<h4>$1</h4>');
  // Bold **x**
  t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic *x*
  t = t.replace(/(^|\s)\*([^*\n]+)\*/g, '$1<em>$2</em>');
  // Bullet lists
  t = t.replace(/^- (.+)$/gm, '• $1');
  return t;
}

// ═══════════════════════════ TEAM VIEW ═══════════════════════════
function getViewMode(){
  const url = new URLSearchParams(location.search);
  const fromUrl = url.get('view');
  if (fromUrl === 'call-engine' || fromUrl === 'vbat' || fromUrl === 'spiced') return fromUrl;
  const saved = localStorage.getItem('v1ViewMode');
  return (saved === 'call-engine' || saved === 'spiced') ? saved : 'vbat';
}

function setViewMode(mode){
  localStorage.setItem('v1ViewMode', mode);
  const url = new URL(location.href);
  url.searchParams.set('view', mode);
  history.replaceState(null, '', url.toString());
  loadTeam();
}

// ═══════════════════════════ EXPLANATION ═══════════════════════════
const EXPLAIN_VBAT = `
  <h3 style="color:var(--text);font-size:15px;margin:0 0 6px 0">What it is</h3>
  <p>VBAT is the qualification framework: <strong>V</strong>alue, <strong>B</strong>udget, <strong>A</strong>uthority, <strong>T</strong>imeline. For every first-meeting recording, an LLM listens to the transcript and decides whether each of the four dimensions was confirmed in the prospect's own words.</p>
  <ul>
    <li><strong>V — Value:</strong> the prospect articulates a problem, outcome, or use case in their own language (not the AE's pitch repeated back).</li>
    <li><strong>B — Budget:</strong> the prospect makes an explicit spend statement — current marketing budget, what they pay an agency, a bracket they could approve, etc.</li>
    <li><strong>A — Authority:</strong> the decision-maker is identified and either on the call or named as the next required step.</li>
    <li><strong>T — Timeline:</strong> a concrete decision date or trigger event is agreed (within ~1 week is the standard; "we'll think about it" does not count).</li>
  </ul>

  <h3 style="color:var(--text);font-size:15px;margin:18px 0 6px 0">Why we calculate it</h3>
  <p>VBAT is the team's existing qualification language and Marc's framework — it tells the AE whether they actually qualified the prospect, independent of how the call "felt." Discovery quality is the leading indicator that's most under the AE's control, and dimensions consistently missed across an AE's calls become the coaching focus.</p>

  <h3 style="color:var(--text);font-size:15px;margin:18px 0 6px 0">How it's calculated</h3>
  <ol>
    <li>For each Claap recording, the transcript is sent to a Haiku-class model with the VBAT rubric and the AE's name (so we know who's the rep vs the prospect).</li>
    <li>The model returns <code>{ V, B, A, T }</code>, each with <code>confirmed: true | false</code> plus a verbatim evidence quote pulled from the transcript.</li>
    <li>The 60-day window collects every classified call. <em>Hit rate per dimension</em> = confirmed-count ÷ classified-count. <em>Overall VBAT %</em> on the team page = total confirmations ÷ (calls × 4 dimensions).</li>
    <li>The <em>weakest dimension</em> = the dimension with the lowest 60-day hit rate. The pinned worst-miss calls are recent calls where that dimension specifically was marked <code>confirmed: false</code> — so the AE can re-listen and see what they could have asked.</li>
    <li>The trend glyph compares the most recent 30 days vs the prior 30 days (≥+5pp = up, ≤−5pp = down, otherwise flat).</li>
  </ol>
  <p style="font-size:13px;color:var(--text3)">VBAT is computed only on first meetings classified as such by the meeting classifier. Internal meetings, customer-success calls, and follow-up demos are excluded.</p>
`;

const EXPLAIN_CALL_ENGINE = `
  <h3 style="color:var(--text);font-size:15px;margin:0 0 6px 0">What it is</h3>
  <p>The Call Engine view scores AEs on their adoption of <strong>four behaviors that causally drive close rate</strong>, identified by within-AE analysis across 5,000+ recordings:</p>
  <ul>
    <li><strong>Contract / commitment:</strong> the AE uses commitment language toward the end — "contract", "sign", "agreement", "akkoord", "Vertrag". Strongest single signal in the dataset.</li>
    <li><strong>Assumptive close:</strong> language that presumes the deal is happening — "when would you start", "which package fits", "I'll send the contract Thursday". Asks the next-step question instead of waiting for it.</li>
    <li><strong>ROI reframe:</strong> price gets reframed as investment with payback — "investering" / "Investition" / "pay back", explicit ROI horizon. Removes the cost objection before it surfaces.</li>
    <li><strong>Compounding value framing:</strong> the AE explains that value compounds over time — "snowball", "stapelt", "exponentiell", "over time". Justifies a longer commitment.</li>
  </ul>

  <h3 style="color:var(--text);font-size:15px;margin:18px 0 6px 0">Why we calculate it</h3>
  <p>VBAT measures qualification (did you get the right deal?). Call Engine measures <strong>technique</strong> (did you run the right play?). These four behaviors were chosen because they are <em>causally validated</em> — controlling for AE identity (so this isn't "top performers happen to use them"), each of these four independently lifts close rate by between 4% and 13% absolute, with 95% confidence intervals that exclude zero. They're also coachable: at least three of the four are pure language patterns an AE can adopt this week.</p>

  <h3 style="color:var(--text);font-size:15px;margin:18px 0 6px 0">How it's calculated</h3>
  <ol>
    <li><strong>Behavior detection.</strong> Each transcript runs through a tri-lingual regex (NL + DE + EN) per behavior. A behavior is "present" on a call if the regex matches at least once in the AE's turns.</li>
    <li><strong>Adoption rate (per AE, per behavior).</strong> Calls with the behavior present ÷ total calls in last 60 days.</li>
    <li><strong>Per-AE 4-behavior adoption</strong> (the team-list metric) = average of the AE's four adoption rates.</li>
    <li><strong>Top-performer benchmark.</strong> The "Top performers" % shown beside each behavior is the average adoption across the top 25% of AEs by real 60-day close rate (≥10 won/lost calls in window). The gap (+/- pp) tells the AE how far above or below the playbook they currently sit.</li>
    <li><strong>Causal validation</strong> behind the choice of these four behaviors uses Frisch–Waugh–Lovell within-AE demeaning — both behavior and outcome are demeaned by the AE's own mean before regression, so the estimate is the effect of one AE varying their own use of the behavior across their own calls. This removes any AE-level confounders (skill, territory, market).</li>
    <li><strong>Real close rate</strong> on the AE detail header = won ÷ (won + lost) over decided HubSpot deals in last 60 days. The "+/- vs avg" residual compares the AE to the team-wide average across all qualifying AEs.</li>
    <li><strong>Pinned lost deals</strong> are recent <code>lost</code> calls ranked by how many of the four behaviors the AE skipped on that call. They're the highest-leverage replays.</li>
  </ol>
  <p style="font-size:13px;color:var(--text3)">Outcomes are sourced from the HubSpot all-deals export joined to <code>recordings.crm_deal_id</code>. Deal-stage changes since the last export aren't reflected until the CSV is refreshed.</p>
`;

function showExplanation(){
  const mode = getViewMode();
  const title = mode === 'call-engine' ? 'Call Engine — explanation' : 'VBAT — explanation';
  const body = mode === 'call-engine' ? EXPLAIN_CALL_ENGINE : EXPLAIN_VBAT;
  document.getElementById('explain-title').textContent = title;
  document.getElementById('explain-body').innerHTML = body;
  document.getElementById('explain-overlay').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function hideExplanation(){
  document.getElementById('explain-overlay').style.display = 'none';
  document.body.style.overflow = '';
}

async function loadTeam(){
  try {
    $('app').innerHTML = '<div class="loading">Loading team…</div>';
    const mode = getViewMode();
    const path = mode === 'call-engine' ? '/api/v1/team/call-engine' : '/api/v1/team';
    const rows = await apiJSON(path);
    if (!rows || !Array.isArray(rows)) throw new Error('No team data');
    if (mode === 'call-engine') renderTeamCallEngine(rows);
    else if (mode === 'spiced') renderTeamSPICED(rows);
    else renderTeamVBAT(rows);
  } catch(err){
    $('app').innerHTML = `<div class="err">${esc(err.message||'Failed to load')}</div>`;
  }
}

function viewToggleHTML(active){
  const btn = (mode, label) => `<button class="pill-btn${mode===active?' primary':''}" onclick="setViewMode('${mode}')" style="font-size:12px">${label}</button>`;
  return `<div style="display:flex;gap:6px;margin-bottom:14px">
    ${btn('vbat', 'VBAT — qualification')}
    ${btn('spiced', 'SPICED — discovery')}
    ${btn('call-engine', 'Call Engine — behaviors')}
  </div>`;
}

function analyzeCardHTML(){
  return `<div class="card" id="link-analyze-card">
    <h3 style="margin:0 0 10px 0">Analyze a specific call</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="link-url" type="text" placeholder="Paste Claap recording link…" style="flex:1;min-width:260px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')analyzeLink()">
      <button class="pill-btn primary" id="link-btn" onclick="analyzeLink()">Open call</button>
    </div>
    <div id="link-status" style="font-size:12px;color:var(--text3);margin-top:8px;min-height:16px"></div>
  </div>`;
}

// Team grouping is data-driven: each row carries a `team` label assigned
// server-side from the AE's dominant call language (Netherlands / Germany /
// UK / Other). No hardcoded roster — toggles + counts follow the live data.
const TEAM_DEFS = [
  { key: 'Netherlands', label: 'Dutch team' },
  { key: 'Germany', label: 'German team' },
  { key: 'UK', label: 'UK team' },
  { key: 'Other', label: 'Other' },
];
function teamCounts(rows){
  const c = {};
  for (const r of rows) { const t = r.team || 'Other'; c[t] = (c[t] || 0) + 1; }
  return c;
}
function availableTeams(rows){
  const c = teamCounts(rows);
  return TEAM_DEFS.filter(d => (c[d.key] || 0) > 0);
}
function getActiveTeam(){
  const avail = availableTeams(window.__teamRows || []);
  const saved = localStorage.getItem('teamFilter');
  if (saved && avail.some(d => d.key === saved)) return saved;
  return avail.length ? avail[0].key : 'Netherlands';
}
function setActiveTeam(t){ localStorage.setItem('teamFilter', t); loadTeam(); }
function teamFilterRows(rows){
  const team = getActiveTeam();
  const q = (document.getElementById('ae-search')?.value || '').trim().toLowerCase();
  return rows.filter(r => {
    if ((r.team || 'Other') !== team) return false;
    if (q && !(r.name || '').toLowerCase().includes(q)) return false;
    return true;
  });
}
function teamControlsHTML(){
  const rows = window.__teamRows || [];
  const counts = teamCounts(rows);
  const active = getActiveTeam();
  const btn = (key, label) => `<button class="pill-btn${key===active?' primary':''}" onclick="setActiveTeam('${key}')" style="font-size:12px">${label} (${counts[key] || 0})</button>`;
  const buttons = availableTeams(rows).map(d => btn(d.key, d.label)).join('\n      ');

async function analyzeLink(){
  const input = $('link-url');
  const url = input ? input.value.trim() : '';
  if (!url) return;
  const btn = $('link-btn');
  const status = $('link-status');
  btn.disabled = true; btn.textContent = 'Looking up…';
  status.textContent = '';
  status.style.color = 'var(--text3)';

  try {
    const res = await api('/api/v1/analyze-link', {
      method: 'POST',
      body: JSON.stringify({ url }),
    });
    const data = await res.json();
    if (!res.ok) { status.style.color = 'var(--red)'; status.textContent = data.error || 'Failed'; return; }

    status.style.color = 'var(--green)';
    const hints = [];
    if (!data.hasAnalysis) hints.push('not analyzed yet');
    else {
      if (!data.hasVBAT) hints.push('no VBAT');
      if (!data.hasNarrative) hints.push('no narrative');
    }
    status.textContent = `Found: ${data.title} (${data.durationMinutes}min)${hints.length ? ' — ' + hints.join(', ') + ' — open to generate' : ''}`;
    setTimeout(() => loadCall(data.recordingId, data.recorderName), 400);
  } catch(err) {
    status.style.color = 'var(--red)';
    status.textContent = err.message || 'Failed';
  } finally {
    btn.disabled = false; btn.textContent = 'Open call';
  }
}

async function loadAE(name){
  try {
    $('app').innerHTML = '<button class="back" onclick="loadTeam()">← Back to team</button><div class="loading">Loading AE…</div>';
    const mode = getViewMode();
    if (mode === 'call-engine') {
      const data = await apiJSON('/api/v1/ae/' + encodeURIComponent(name) + '/call-engine');
      if (!data || data.error) throw new Error(data?.error || 'Failed');
      renderAECallEngine(data);
    } else if (mode === 'spiced') {
      const data = await apiJSON('/api/v1/ae/' + encodeURIComponent(name) + '/spiced');
      if (!data || data.error) throw new Error(data?.error || 'Failed');
      renderAESPICED(data);
    } else {
      const data = await apiJSON('/api/v1/ae/' + encodeURIComponent(name));
      if (!data || data.error) throw new Error(data?.error || 'Failed');
      renderAE(data);
    }
  } catch(err){
    $('app').innerHTML = `<button class="back" onclick="loadTeam()">← Back</button><div class="err">${esc(err.message||'Failed')}</div>`;
  }
}

function renderAECallEngine(data){
  const { name, totalRecent, behaviors, byBehavior, weeklyTrend, pinnedLostCalls, closeRate, decidedCalls, wonCalls, lostCalls, expectedRate, residual } = data;

  // Per-behavior cards (the four dimensions)
  const dimColors = { contract: '#B748FF', assumptiveClose: '#3B82F6', roiReframe: '#10B981', compounding: '#F59E0B' };

  }).join('');

  // Heatmap: behavior × week

    }).join('');

  let pinnedHTML = '';

      const evidence = c.evidence ? `<div style="font-size:12px;color:var(--text3);margin-top:4px;font-style:italic">${esc(c.evidence.slice(0, 160))}${c.evidence.length > 160 ? '…' : ''}</div>` : '';
      return `<div class="call-list-item" onclick="loadCall('${esc(c.recordingId)}','${esc(name)}')">
        <span class="call-date">${fmtDate(c.createdAt)}</span>
        <div style="flex:1;min-width:0">
          <div class="call-title">${esc(c.title)}</div>
          ${evidence}
        </div>
      </div>`;
    }).join('');
    pinnedHTML = `
      <div class="card" style="padding:0">
        <h3 style="padding:20px 20px 4px">Calls to study — ${esc(SPICED_LABELS[weakestDimension])} was missed</h3>
        <div style="padding:0 20px 12px;font-size:12px;color:var(--text3)">Recent calls where the focus element wasn't confirmed. Listen for what went differently.</div>
        ${items}
      </div>`;
  }

  let callRows = calls.slice(0, 20).map(c => {
    const sp = c.spiced || {};
    const dots = dims.map(d => {
      const v = sp[d];
      if (!v) return '<span class="dot none" title="No data">·</span>';
      return `<span class="dot ${v.confirmed?'confirmed':'missed'}" title="${esc(SPICED_LABELS[d])}: ${v.confirmed?'confirmed':'not confirmed'}">${d}</span>`;
    }).join('');
    const tierCls = `tier-${c.tier || 'B'}`;
    return `<div class="call-list-item" onclick="loadCall('${esc(c.recordingId)}','${esc(name)}')">
      <span class="call-date">${fmtDate(c.createdAt)}</span>
      <span class="call-title">${esc(c.title)}</span>
      <span class="tier-badge ${tierCls}">${c.tier || 'B'}</span>
      <span class="call-dots">${dots}</span>
    </div>`;
  }).join('');

  const html = `
    ${viewToggleHTML('spiced')}
    <button class="back" onclick="loadTeam()">← Back to team</button>
    <h2 class="pgtitle">${esc(name)}</h2>
    <div class="pgtitle-sub">${totalRecent} calls in last 60 days · ${spicedAnalyzed} classified with SPICED</div>

    <div class="card">
      <h3>SPICED pattern across last 60 days</h3>
      ${patternsHTML || '<div class="empty">SPICED data not computed yet for this AE.</div>'}
      ${weakestCallout}
    </div>

    ${heatmapHTML}
    ${pinnedHTML}

    <div class="card" id="ae-deep-card">
      <div class="regenerate-row">
        <h3 style="margin:0">Coaching narrative <span class="meta" id="ae-deep-meta"></span></h3>
        <button class="pill-btn" id="ae-deep-regen" onclick="regenerateAEDeep('${esc(name)}')">Regenerate</button>
      </div>
      <div id="ae-deep-body" class="narrative-body"><div class="narrative-loading">Loading cached analysis…</div></div>
    </div>

    <div class="card" style="padding:0">
      <h3 style="padding:20px 20px 0">Recent calls</h3>
      ${callRows || '<div class="empty">No calls.</div>'}
    </div>

    <details class="expander">
      <summary>Deep dive — pillars, trends, calibration</summary>
      <div class="expander-body">
        <div id="ae-pillars-body" style="font-size:13px;color:var(--text2)">Loading pillars…</div>
      </div>
    </details>
  `;
  $('app').innerHTML = html;

  loadAEDeepAnalysis(name);
  loadAEPillars(name);
}

async function loadAEDeepAnalysis(name){
  try {
    const res = await api('/api/ae/' + encodeURIComponent(name) + '/deep-analysis');
    if (res.status === 404) {
      $('ae-deep-body').innerHTML = '<div class="narrative-loading">No coaching narrative yet. Click Regenerate to create one.</div>';
      $('ae-deep-meta').textContent = '(not generated yet)';
      return;
    }
    const data = await res.json();
    renderAEDeep(data);
  } catch(err) {
    $('ae-deep-body').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

function renderAEDeep(data){
  const sections = [
    { key:'overview',  label:'Overview',               text: data.overview,                   teaser:'Where this AE stands today' },
    { key:'plan',      label:'Coaching plan',          text: data.coachingPlan,               teaser:'Top 3 things to work on' },
    { key:'control',   label:'Call control',           text: data.callControl,                teaser:'Agenda, lead/follow, momentum' },
    { key:'discovery', label:'Discovery & gap',        text: data.discoveryAndGapCreation,    teaser:'Questions, gap creation, proof' },
    { key:'objection', label:'Objection handling',     text: data.objectionPatterns,          teaser:'How AE responds to pushback' },
    { key:'closing',   label:'Closing behaviour',      text: data.closingBehavior,            teaser:'Urgency, next steps, close' },
    { key:'script',    label:'Script execution',       text: data.scriptExecution,            teaser:'Pitch sections nailed / skipped' },
  ].filter(s => s.text && s.text.trim());

  if (sections.length === 0) {
    $('ae-deep-body').innerHTML = '<div class="narrative-loading">No coaching narrative content.</div>';
    return;
  }

  // Chip row + collapsible sections; first section open by default
  const num = i => String(i + 1).padStart(2, '0');
  const chipsHTML = sections.map((s, i) =>
    `<button class="chip" data-target="sec-${s.key}" onclick="toggleAESection('${s.key}')"><span class="chip-num">${num(i)}</span> ${esc(s.label)}</button>`
  ).join('');

  const sectionsHTML = sections.map((s, i) =>
    `<details class="ae-section" id="sec-${s.key}" ${i === 0 ? 'open' : ''}>
      <summary>
        <span class="sec-num">${num(i)}</span>
        <span class="sec-label">${esc(s.label)}</span>
        <span class="sec-teaser">${esc(s.teaser)}</span>
        <span class="sec-caret">▾</span>
      </summary>
      <div class="sec-body">${renderMarkdown(s.text)}</div>
    </details>`
  ).join('');

  $('ae-deep-body').innerHTML = `
    <div class="chip-row">${chipsHTML}</div>
    <div class="ae-sections">${sectionsHTML}</div>
  `;

  if (data._generatedAt) {
    const d = new Date(data._generatedAt);
    $('ae-deep-meta').textContent = `· generated ${d.toLocaleDateString()} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
  }
}

function toggleAESection(key){
  const el = document.getElementById('sec-' + key);
  if (!el) return;
  el.open = !el.open;
  if (el.open) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function regenerateAEDeep(name){
  const btn = $('ae-deep-regen');
  btn.disabled = true; btn.textContent = 'Generating…';
  $('ae-deep-body').innerHTML = '<div class="narrative-loading">Streaming fresh analysis…</div>';

  try {
    const res = await api('/api/ae/' + encodeURIComponent(name) + '/deep-analysis/stream', {method:'POST'});
    if (!res.ok) { throw new Error((await res.json()).error || 'Failed'); }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    $('ae-deep-body').innerHTML = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, {stream:true});
      full += chunk;
      $('ae-deep-body').innerHTML = renderMarkdown(full);
      $('ae-deep-body').scrollIntoView({behavior:'smooth',block:'nearest'});
    }
    // Reload the parsed version from cache so it shows the nicer section structure
    setTimeout(()=>loadAEDeepAnalysis(name), 500);
  } catch(err) {
    $('ae-deep-body').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Regenerate';
  }
}

async function loadAEPillars(name){
  try {
    const pillars = await apiJSON('/api/ae/' + encodeURIComponent(name) + '/pillars');
    if (!pillars || Object.keys(pillars).length === 0) {
      $('ae-pillars-body').innerHTML = '<div class="empty">No pillar data.</div>';
      return;
    }
    const order = ['control','discovery','gapCreation','objectionHandling','advancement'];
    const labels = {control:'Call control',discovery:'Discovery',gapCreation:'Gap creation',objectionHandling:'Objection handling',advancement:'Advancement'};
    const html = order.filter(k => pillars[k]).map(k => {
      const p = pillars[k];
      return `<div class="pattern-bar">
        <div class="pb-label">${esc(labels[k] || k)}</div>
        <div class="pb-track"><div class="pb-fill" style="width:${p.score}%"></div></div>
        <div class="pb-num">${p.score} · ${esc(p.level)}</div>
      </div>`;
    }).join('');
    $('ae-pillars-body').innerHTML = html || '<div class="empty">No pillar data.</div>';
  } catch(err) {
    $('ae-pillars-body').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  }
}

// ═══════════════════════════ CALL VIEW ═══════════════════════════
let currentCallAE = '';

async function loadCall(rid, aeName){
  currentCallAE = aeName;
  try {
    $('app').innerHTML = `<button class="back" onclick="loadAE('${esc(aeName)}')">← Back to ${esc(aeName)}</button><div class="loading">Loading call…</div>`;
    const [call, vbat] = await Promise.all([
      apiJSON('/api/call/' + encodeURIComponent(rid)),
      apiJSON('/api/call/' + encodeURIComponent(rid) + '/vbat').catch(()=>null),
    ]);
    if (!call || call.error) throw new Error(call?.error || 'Not found');
    renderCall(call, vbat);
  } catch(err){
    $('app').innerHTML = `<button class="back" onclick="loadAE('${esc(aeName)}')">← Back</button><div class="err">${esc(err.message)}</div>`;
  }
}

function renderCall(call, vbat){
  const sr = call.smart_review || {};
  const summary = sr.summary || '';
  const oneThing = sr.oneThingToChange || '';
  const url = call.recording_url || '';
  const hasVBAT = vbat && !vbat.error;

  const vbatCore = hasVBAT ? ['V','B','A','T'].map(d => renderVBATRow(call.recording_id, d, vbat[d], url)).join('') : '';
  const vbatExpert = hasVBAT ? ['E','F'].map(d => renderVBATRow(call.recording_id, d, vbat[d], url)).join('') : '';

  const hasNarrative = call.narrative_review && Object.keys(call.narrative_review).length > 0;

  const html = `
    <button class="back" onclick="loadAE('${esc(currentCallAE)}')">← Back to ${esc(currentCallAE)}</button>
    <h2 class="pgtitle">${esc(call.title || 'Untitled')}</h2>
    <div class="pgtitle-sub">${esc(call.recorder_name || '')} · ${fmtDate(call.created_at)} · ${Math.round((call.duration_seconds||0)/60)} min${url?' · <a href="'+esc(url)+'" target="_blank">Open in Claap ↗</a>':''}</div>

    <div class="card">
      <h3>What happened</h3>
      <div class="summary-block">${summary ? esc(summary) : '<span style="color:var(--text3)">No summary generated.</span>'}</div>
      ${oneThing ? `<div class="one-thing"><div class="label">The one thing to change</div><div class="text">${esc(oneThing)}</div></div>` : ''}
    </div>

    <div class="card">
      <h3>VBAT — what the prospect said</h3>
      ${hasVBAT ? `<div class="vbat-nav">${vbatCore}</div>` :
        `<div class="narrative-loading">Not classified yet. <button class="pill-btn" onclick="regenerateVBAT('${esc(call.recording_id)}')">Classify now</button></div>`}

      ${hasVBAT ? `<div class="expert-label">Expert level — advanced moves</div><div class="vbat-nav">${vbatExpert}</div>` : ''}
      ${hasVBAT ? `<div style="margin-top:14px;text-align:right"><button class="pill-btn" onclick="regenerateVBAT('${esc(call.recording_id)}')">Re-classify</button></div>` : ''}
    </div>

    <div class="card" id="call-narrative-card">
      <div class="regenerate-row">
        <h3 style="margin:0">Full coaching narrative <span class="meta" id="call-narrative-meta"></span></h3>
        <button class="pill-btn" id="call-narrative-regen" onclick="regenerateCallNarrative('${esc(call.recording_id)}')">${hasNarrative?'Regenerate':'Generate'}</button>
      </div>
      <div id="call-narrative-body" class="narrative-body"></div>
    </div>

    <details class="expander">
      <summary>Deep dive — pillars, moments, script coverage</summary>
      <div class="expander-body">${renderCallDeepDive(call)}</div>
    </details>
  `;
  $('app').innerHTML = html;

  // Render cached narrative
  if (hasNarrative) renderCallNarrative(call.narrative_review);
  else $('call-narrative-body').innerHTML = '<div class="narrative-loading">Not generated yet. Click Generate to create.</div>';
}

function renderVBATRow(rid, dim, verdict, recordingUrl){
  if (!verdict) {
    return `<div class="vbat-row missed">
      <div class="vbat-letter missed">${dim}</div>
      <div class="vbat-body">
        <div class="vbat-label">${esc(VBAT_LABELS[dim])}</div>
        <div class="vbat-evidence" style="color:var(--text3)">No verdict available.</div>
      </div>
    </div>`;
  }
  const cls = verdict.confirmed ? 'confirmed' : 'missed';
  const conf = verdict.confidence || 'medium';
  const tsDisplay = verdict.timestamp ? `<span class="ts">${esc(verdict.timestamp)}</span>` : '';
  const evidence = verdict.evidence && verdict.evidence.trim()
    ? `<div class="vbat-evidence">"${esc(verdict.evidence)}"</div>`
    : `<div class="vbat-evidence" style="color:var(--text3)">No evidence captured.</div>`;
  const jumpHandler = recordingUrl && verdict.timestamp
    ? `onclick="jumpToMoment('${esc(recordingUrl)}','${esc(verdict.timestamp)}')"`
    : '';
  return `<div class="vbat-row ${cls}" ${jumpHandler}>
    <div class="vbat-letter ${cls}">${dim}</div>
    <div class="vbat-body">
      <div class="vbat-label">${esc(VBAT_LABELS[dim])} — ${verdict.confirmed?'confirmed':'not confirmed'}<span class="conf-badge conf-${conf}">${esc(conf)}</span>${tsDisplay}</div>
      ${evidence}
      <div class="vbat-reasoning">${esc(verdict.reasoning || '')}</div>
      <div class="vbat-actions" onclick="event.stopPropagation()">
        <button class="vbat-wrong-btn" onclick="flagVBATWrong('${esc(rid)}','${dim}',${verdict.confirmed})">This is wrong</button>
      </div>
    </div>
  </div>`;
}

function jumpToMoment(url, timestamp){
  // Timestamp is MM:SS — convert to seconds for Claap deep link
  const parts = String(timestamp).split(':').map(n => parseInt(n, 10));
  if (parts.length !== 2 || parts.some(isNaN)) { window.open(url, '_blank'); return; }
  const seconds = parts[0] * 60 + parts[1];
  const sep = url.includes('?') ? '&' : '?';
  window.open(`${url}${sep}t=${seconds}`, '_blank');
}

async function flagVBATWrong(rid, dim, verdictWas){
  const note = prompt(`Why is the ${VBAT_LABELS[dim]} verdict wrong?\n(Current: ${verdictWas?'confirmed':'not confirmed'})`);
  if (note === null) return;
  try {
    await api('/api/call/' + encodeURIComponent(rid) + '/vbat/feedback', {
      method:'POST',
      body: JSON.stringify({ dimension: dim, verdictWas: verdictWas, correctVerdict: !verdictWas, note }),
    });
    alert('Thanks — feedback recorded. Consider clicking "Re-classify" to regenerate.');
  } catch(err) {
    alert('Could not save feedback: ' + err.message);
  }
}

async function regenerateVBAT(rid){
  if (!confirm('Re-classify VBAT for this call? Uses one LLM call.')) return;
  try {
    $('app').querySelectorAll('.vbat-row').forEach(el => el.style.opacity = '.4');
    const res = await api('/api/call/' + encodeURIComponent(rid) + '/vbat/regenerate', {method:'POST'});
    if (!res.ok) { const e = await res.json(); throw new Error(e.error || 'Failed'); }
    loadCall(rid, currentCallAE);
  } catch(err) {
    alert('Re-classify failed: ' + err.message);
    $('app').querySelectorAll('.vbat-row').forEach(el => el.style.opacity = '1');
  }
}

function renderCallNarrative(n){
  const sections = [
    ['Summary', n.summary],
    ['Doubts & objections', n.objectionsAnalysis],
    ['Buying signals', n.buyingSignalsAnalysis],
    ['Coaching moments', n.coachingMoments],
    ['Verdict', n.overallVerdict],
  ].filter(([_, v]) => v && v.trim());

  if (sections.length === 0) {
    $('call-narrative-body').innerHTML = '<div class="narrative-loading">Narrative empty or not parsed.</div>';
    return;
  }
  $('call-narrative-body').innerHTML = sections.map(([t,v]) => `<h4>${esc(t)}</h4>${renderMarkdown(v)}`).join('');
  if (n.generatedAt) {
    const d = new Date(n.generatedAt);
    $('call-narrative-meta').textContent = `· generated ${d.toLocaleDateString()}`;
  }
}

async function regenerateCallNarrative(rid){
  const btn = $('call-narrative-regen');
  btn.disabled = true; btn.textContent = 'Generating…';
  $('call-narrative-body').innerHTML = '<div class="narrative-loading">Streaming narrative…</div>';

  try {
    const res = await api('/api/call/' + encodeURIComponent(rid) + '/narrative/stream?force=true', {method:'POST'});
    if (!res.ok) throw new Error((await res.json()).error || 'Failed');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = '';
    $('call-narrative-body').innerHTML = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, {stream:true});
      $('call-narrative-body').innerHTML = renderMarkdown(full);
    }
    // Reload to get the parsed cached version (nicer section layout)
    setTimeout(async () => {
      const call = await apiJSON('/api/call/' + encodeURIComponent(rid));
      if (call.narrative_review) renderCallNarrative(call.narrative_review);
    }, 800);
  } catch(err){
    $('call-narrative-body').innerHTML = `<div class="err">${esc(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'Regenerate';
  }
}

function renderCallDeepDive(call){
  // Pillars
  const ps = call.pillar_scores || {};
  const pillarOrder = ['control','discovery','gapCreation','objectionHandling','advancement'];
  const pillarLabels = {control:'Call control',discovery:'Discovery',gapCreation:'Gap creation',objectionHandling:'Objection handling',advancement:'Advancement'};
  const pillarsHTML = pillarOrder.filter(k => ps[k]).map(k => `
    <div class="pattern-bar">
      <div class="pb-label">${esc(pillarLabels[k])}</div>
      <div class="pb-track"><div class="pb-fill" style="width:${ps[k].score||0}%"></div></div>
      <div class="pb-num">${ps[k].score||0}</div>
    </div>
  `).join('');

  // Metrics
  const metricsHTML = `
    <div class="pattern-bar"><div class="pb-label">Talk ratio</div><div class="pb-num" style="text-align:left;flex:1">${call.talk_ratio||0}%</div></div>
    <div class="pattern-bar"><div class="pb-label">Questions</div><div class="pb-num" style="text-align:left;flex:1">${call.question_count||0}</div></div>
    <div class="pattern-bar"><div class="pb-label">Script adherence</div><div class="pb-num" style="text-align:left;flex:1">${call.script_adherence||0}%</div></div>
    <div class="pattern-bar"><div class="pb-label">Quality score</div><div class="pb-num" style="text-align:left;flex:1">${call.call_quality_score||0}</div></div>
    <div class="pattern-bar"><div class="pb-label">Call tier</div><div class="pb-num" style="text-align:left;flex:1">${esc(call.call_tier||'B')}</div></div>
    <div class="pattern-bar"><div class="pb-label">Meeting type</div><div class="pb-num" style="text-align:left;flex:1">${esc(call.meeting_type||'first')}</div></div>
  `;

  // Coachable moments from highlights
  const hl = (call.highlights || []).filter(h => h.type === 'coachable').slice(0, 8);
  const momentsHTML = hl.length ? hl.map(h => `
    <div style="padding:10px 12px;background:var(--bg3);border-left:3px solid var(--orange);margin-bottom:6px;border-radius:0 8px 8px 0">
      <div style="font-size:11px;color:var(--text3);margin-bottom:3px"><strong style="color:var(--orange)">${esc(h.category||'')}</strong> · ${esc(h.timestampDisplay||'')}</div>
      <div style="font-size:13px;color:var(--text2);font-style:italic">${esc(h.excerpt||'')}</div>
      ${h.guidance ? `<div style="font-size:12px;color:var(--blue);margin-top:4px">${esc(h.guidance)}</div>` : ''}
    </div>
  `).join('') : '<div class="empty">No coachable moments flagged.</div>';

  return `
    <h4 style="margin:14px 0 10px;color:var(--text2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Pillars</h4>
    ${pillarsHTML || '<div class="empty">No pillar data.</div>'}
    <h4 style="margin:20px 0 10px;color:var(--text2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Metrics</h4>
    ${metricsHTML}
    <h4 style="margin:20px 0 10px;color:var(--text2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px">Coachable moments</h4>
    ${momentsHTML}
  `;
}
